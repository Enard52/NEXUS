<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://js.whop.com https://*.whop.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' data: blob: https: http: ws: wss:; media-src 'self' data: blob: https: http:; frame-src 'self' https://*.whop.com https://js.whop.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.whop.com"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>NEXUS - Cihaz Ekle</title>
  <link href="css/tailwind.css" rel="stylesheet"/><link href="css/nexus-ui.css" rel="stylesheet"/>
  <link href="fonts/inter/inter.css" rel="stylesheet"/>
  
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    #loading-overlay { display: none; }
    .manual-shell-divider { border-top: 1px solid rgba(226, 232, 240, 0.95); }
    .catalog-search-pill {
      background: #f8fafc;
      border: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .cat-btn {
      position: relative;
    }

    /* Text Only Category Button States */
    .cat-btn {
      position: relative;
      border-left-width: 3px;
      border-left-color: transparent;
      transition: all 0.2s ease;
    }
    .cat-active {
      background-color: transparent;
      border-left-color: #111827;
    }
    .cat-active .cat-text {
      color: #111827;
      font-weight: 800;
    }
    .cat-inactive .cat-text {
      color: #556070;
      font-weight: 600;
    }
    .cat-text {
      word-break: keep-all;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    html.dark .cat-inactive .cat-text {
      color: #94a3b8;
    }
    .catalog-subtitle {
      margin-top: 0.2rem;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.35;
      color: #94a3b8;
    }
    .catalog-kicker {
      margin-bottom: 1.1rem;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.3;
      color: #8b929f;
      letter-spacing: -0.01em;
    }
    .product-tile img {
      filter: drop-shadow(0 8px 10px rgba(15, 23, 42, 0.10));
    }
    /* Tüm ürün görselleri aynı kutuda (kare, ortalanmış); kırpılmış kare PNG'ler aynı boyutta görünür */
    .product-tile img.catalog-img { width: 72px; height: 72px; max-width: none; max-height: none; }
    html.dark .product-tile img {
      background: transparent;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.35));
    }
    .catalog-group-title {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #5b6678;
      margin: 0.35rem 0 1rem;
      letter-spacing: -0.01em;
    }
    html.dark .catalog-group-title { color: #94a3b8; }
    .product-tile p {
      white-space: normal;
      text-wrap: balance;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 0.75rem;
      row-gap: 1.45rem;
    }
    @media (min-width: 390px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (min-width: 760px) {
      /* Sabit genişlikli sütunlar: Soket, Anahtar vb. tüm gruplar aynı sütun çizgilerinde hizalanır
         (auto-fit az ürünlü grupları geniş aralıkla yayıp hizayı bozuyordu). */
      .product-grid {
        grid-template-columns: repeat(auto-fill, 112px);
        justify-content: start;
      }
      .catalog-group-title { text-align: left; padding-left: 0.25rem; }
    }
    /* Tüm karolar üstten başlar; ad satırı sayısı farklı olsa da görseller ve adlar aynı hizada kalır */
    .product-tile { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; }
    .product-name { min-height: 42px; }
    .product-card {
      min-height: 112px;
      border: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }
    .product-image-stage {
      height: 78px;
      margin: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .product-name {
      display: block;
      min-height: 34px;
      overflow: visible;
      text-align: center;
      font-size: clamp(10.5px, 2.9vw, 12px);
      line-height: 1.14;
      font-weight: 650;
      letter-spacing: 0;
      color: #0f172a;
      overflow-wrap: break-word;
      word-break: normal;
      hyphens: auto;
    }
    .product-category-pill {
      display: none;
    }
    html.dark .product-card {
      background: transparent;
      border-color: transparent;
    }
    /* Koyu temada da karolar kutusuz: beyaz cihazlar koyu zeminde zaten net görünür; açık renkli kutu "kutu içinde kutu" yapıyordu. */
    html.dark .product-image-stage {
      background: transparent;
    }
    html.dark .product-name {
      color: #f8fafc;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .cat-chip {
      flex: 0 0 auto;
      padding: 0.5rem 0.95rem;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #64748b;
      background: #f1f5f9;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .cat-chip.active {
      color: #ffffff;
      background: #111827;
    }
    html.dark .cat-chip { background: #1e293b; color: #94a3b8; }
    html.dark .cat-chip.active { background: #f8fafc; color: #0f172a; }
    #catalog-empty p { color: #64748b; }
    html.dark body {
      background: #0f172a;
      color: #e2e8f0;
    }
    html.dark #int-header,
    html.dark .catalog-toolbar,
    html.dark #main-content,
    html.dark #sidebar-categories {
      background: #0f172a !important;
    }
    html.dark .manual-shell-divider {
      border-top-color: rgba(51, 65, 85, 0.95);
    }
    html.dark .catalog-search-pill {
      background: #111827;
      border-color: rgba(51, 65, 85, 0.95);
      box-shadow: none;
    }
    html.dark .cat-active {
      border-left-color: #f8fafc;
    }
    html.dark .cat-active .cat-text,
    html.dark .catalog-title,
    html.dark .catalog-heading {
      color: #f8fafc;
    }
    html.dark .catalog-kicker,
    html.dark .catalog-subtitle {
      color: #94a3b8;
    }
  </style>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="cloud-config.js"></script>
  <script src="cloud-sync.js"></script>
  <script src="supported-devices.js"></script>
  <script src="lan-connectors.js"></script>
</head>
<body class="bg-dashboard-gradient text-slate-900 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header id="int-header" class="pt-14 pb-4 px-5 flex items-center justify-between nx-hdr-blend z-50 relative">
    <div class="flex items-center gap-3">
      <a aria-label="Geri" class="p-1 -ml-1 text-slate-700 active:scale-95 transition-transform" href="#" onclick="event.preventDefault(); if (history.length > 1) history.back(); else location.href = 'nexus-home.html';">
        <i class="w-7 h-7" data-lucide="chevron-left"></i>
      </a>
    </div>
    <!-- Diğer alt sayfalarla aynı başlık ölçüsü: ortalanmış, 18px, kalın -->
    <h1 class="catalog-title absolute left-1/2 -translate-x-1/2 text-lg font-bold tracking-tight text-slate-900">Cihaz Ekle</h1>
    <div class="flex items-center gap-2">
      <a aria-label="QR ile ekle" class="p-1 text-slate-500 active:scale-95 transition-transform" href="nexus-scan.html">
        <i class="w-6 h-6" data-lucide="scan-search"></i>
      </a>
      <button aria-label="Aramaya odaklan" class="p-1 text-slate-500 active:scale-95 transition-transform" onclick="focusCatalogSearch()">
        <i class="w-6 h-6" data-lucide="search"></i>
      </button>
    </div>
  </header>

  <div class="manual-shell-divider mx-4"></div>

  <div class="catalog-toolbar px-4 pt-5 pb-4 bg-white z-40 relative">
    <div class="flex items-center gap-3">
      <div class="min-w-0 flex-1">
        <h2 class="text-lg leading-none font-semibold tracking-[-0.02em] text-slate-900 whitespace-nowrap">Manuel Olarak Ekle</h2>
      </div>
      <div class="relative w-[52%] max-w-[15rem]">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <i class="w-5 h-5 text-slate-400" data-lucide="search"></i>
        </div>
        <input id="catalog-search" type="text" class="catalog-search-pill w-full rounded-full py-3 pl-11 pr-4 text-sm font-medium text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-[#4C7DFF] transition-shadow" placeholder="Cihaz ara" />
      </div>
    </div>
  </div>

  <!-- Split Content Area -->
  <main class="flex-grow flex overflow-hidden" id="catalog-main">
    <aside class="w-[30%] max-w-[132px] overflow-y-auto no-scrollbar flex flex-col pb-10 pt-1 pr-1 bg-transparent dark:bg-slate-900" id="catalog-rail"></aside>
    <div class="flex-1 overflow-y-auto px-3 pt-2 pb-16 bg-transparent dark:bg-slate-900" id="catalog-content"></div>
  </main>

  <!-- Code Entry Modal -->
  <div id="code-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[90] hidden flex flex-col items-center justify-center px-6">
    <div class="bg-white rounded-[2rem] w-full max-w-sm p-6 shadow-2xl relative overflow-hidden transform scale-95 transition-transform" id="code-modal-content">
      <div class="text-center mb-6 mt-2">
        <div class="w-16 h-16 bg-slate-50 text-[#4C7DFF] rounded-full mx-auto flex items-center justify-center mb-4">
          <i class="w-8 h-8" data-lucide="hash"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">Kurulum Kodu</h2>
        <p class="text-sm text-slate-500 mt-2">Cihazınızın üzerindeki 8 haneli kodu girin.</p>
      </div>
      <div class="mb-6">
        <input type="text" id="setup-code-input" data-enter="submitCode" enterkeyhint="go" class="w-full text-center text-3xl tracking-[0.2em] font-bold text-slate-800 border-none bg-slate-50 rounded-2xl py-4 focus:ring-2 focus:ring-[#4C7DFF]" placeholder="00000000" maxlength="8" autocomplete="off" />
      </div>
      <div class="flex gap-3">
        <button class="flex-1 py-3.5 rounded-2xl font-bold text-slate-600 bg-slate-100 active:bg-slate-200 transition-colors" onclick="closeCodeModal()">İptal</button>
        <button class="flex-1 py-3.5 rounded-2xl font-bold text-white bg-[#4C7DFF] active:bg-[#3F6FFF] transition-colors shadow-md shadow-[#4C7DFF]/30" onclick="submitCode()">Bağlan</button>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[100] flex-col items-center justify-center">
    <div id="loading-spinner" class="flex flex-col items-center">
      <div class="w-16 h-16 rounded-full border-4 border-slate-100 border-t-[#4C7DFF] animate-spin mb-4"></div>
      <p id="loading-title" class="text-slate-800 font-bold text-lg text-center px-6">Cihaz Aranıyor...</p>
      <p id="loading-sub" class="text-slate-500 text-sm mt-1 text-center px-6">Lütfen cihazın açık ve aynı Wi-Fi ağında olduğundan emin olun.</p>
      <button type="button" class="mt-5 text-slate-500 font-medium py-2 px-4" onclick="cancelDeviceSearch()">Vazgeç</button>
    </div>
    <div id="loading-notfound" class="hidden flex-col items-center px-8 w-full max-w-sm">
      <div class="w-14 h-14 rounded-2xl bg-red-50 text-red-500 flex items-center justify-center mb-3">
        <i class="w-7 h-7" data-lucide="alert-triangle"></i>
      </div>
      <p class="text-slate-800 font-bold text-lg">Cihaz Bulunamadı</p>
      <p class="text-slate-500 text-sm mt-1 mb-5 text-center">Ağda bu cihaz bulunamadı. Cihazı Wi-Fi'a bağlayıp tekrar dene; bağlanmadan ana sayfaya eklenmez.</p>
      <button class="w-full bg-[#4C7DFF] text-white font-bold py-3.5 rounded-xl active:scale-[0.98] transition-transform" onclick="hideOverlay()">Tamam</button>
      <button class="w-full text-[#4C7DFF] font-semibold py-3 mt-1" onclick="hideOverlay(); window.location.href='nexus-setup-code.html';">Kurulum koduyla ekle</button>
      <button class="w-full text-slate-500 font-medium py-3 mt-1" onclick="hideOverlay()">Vazgeç</button>
    </div>
  </div>

  <script src="js/lucide.js"></script>
<script src="integrations-page.js"></script>
<script>
function showIntegrationsToast(msg) { window.nexusToast(msg, { type: 'info' }); }
</script>
<script data-purpose="product-image-transparency">
  // Beyaz arka planlı ürün görsellerini şeffaflaştırır. Eskiden bu kod, src niteliği
  // olan bir script etiketinin İÇİNDE duruyordu; tarayıcı src'li script gövdesini
  // çalıştırmadığı için hiç çalışmıyordu.
  function makeImagesTransparent() {
    document.querySelectorAll('.product-tile img').forEach(function (img) {
      if (img.complete) processProductImage(img);
      else img.addEventListener('load', function () { processProductImage(img); }, { once: true });
    });
  }

  // Eski sürümde burada görsellerin beyaza yakın pikselleri silinip src data: adresiyle değiştiriliyordu.
  // Ürün fotoğrafları artık şeffaf PNG; bu işlem beyaz cihazların (anahtar plakaları vb.) içini oyuyor ve
  // görselleri bozuyordu. Görseller olduğu gibi gösterilir.
  function processProductImage(img) {
    img.dataset.processed = 'true';
  }

  window.refreshProductImageTransparency = makeImagesTransparent;
  window.addEventListener('load', function () { setTimeout(makeImagesTransparent, 200); });
  makeImagesTransparent();
</script>
</body>
</html>
