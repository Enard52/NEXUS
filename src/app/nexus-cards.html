<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://js.whop.com https://*.whop.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' data: blob: https: http: ws: wss:; media-src 'self' data: blob: https: http:; frame-src 'self' https://*.whop.com https://js.whop.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.whop.com"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5fb">
<title>NEXUS - Kart Ekle</title>
<link href="css/tailwind.css" rel="stylesheet"/><link href="css/nexus-ui.css" rel="stylesheet"/>
<link href="fonts/inter/inter.css" rel="stylesheet"/>

<style>
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100dvh;
    background: linear-gradient(180deg, #f7f8fc 0%, #eef1f8 100%);
    color: #111827;
  }
  .picker-shell {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .picker-card {
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(226, 232, 240, 0.95);
    box-shadow: 0 18px 50px rgba(15, 23, 42, 0.06);
    backdrop-filter: blur(18px);
  }
  .picker-tab.active {
    color: #111827;
    font-weight: 700;
  }
  .picker-tab.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -10px;
    height: 2px;
    border-radius: 999px;
    background: #4C7DFF;
  }
  .picker-row + .picker-row {
    border-top: 1px solid rgba(226, 232, 240, 0.9);
  }
  .check-circle {
    width: 22px;
    height: 22px;
    border-radius: 999px;
    border: 1.5px solid #d1d5db;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 160ms ease;
  }
  .check-circle.selected {
    border-color: #3b82f6;
    background: #3b82f6;
    color: #fff;
  }
  .icon-wrap {
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
</style>
<script src="auth.js"></script>
  <script src="theme.js"></script>
<script src="data.js"></script>
<script src="nexus-dialog.js"></script>
</head>
<body>
  <div class="picker-shell px-4 pt-12 pb-6">
    <header class="flex items-center justify-between text-[15px] font-medium mb-5">
      <button class="text-slate-900 min-h-[44px] px-1" type="button" onclick="cancelPicker()">İptal</button>
      <h1 class="text-lg font-bold tracking-tight">Kart Ekle</h1>
      <button class="text-[#4C7DFF] font-semibold min-h-[44px] px-1" type="button" onclick="commitSelection()">Ekle</button>
    </header>

    <nav class="flex items-center justify-center gap-6 text-[15px] text-slate-500 mb-5">
      <button class="picker-tab nx-tap-b relative pb-2 active" data-tab="smartHome" type="button">Akıllı Ev</button>
      <button class="picker-tab nx-tap-b relative pb-2" data-tab="devices" type="button">Cihazlar</button>
      <button class="picker-tab nx-tap-b relative pb-2" data-tab="tapToRun" type="button">Dokun Çalıştır</button>
    </nav>

    <main class="picker-card rounded-[28px] px-4 py-3 flex-1 overflow-hidden">
      <div class="max-h-[72dvh] overflow-y-auto" id="picker-list"></div>
    </main>
  </div>

  <script src="js/lucide.js"></script>
<script>
    const pickerState = {
      activeTab: 'smartHome',
      smartHome: new Set((window.getSelectedSmartHomeCards ? window.getSelectedSmartHomeCards() : []).map(card => card.id)),
      tapToRun: new Set((window.getTapToRunCards ? window.getTapToRunCards() : []).map(card => card.id)),
      devices: new Set()
    };

    function getDeviceSource() {
      if (window.NEXUS_DATA && Array.isArray(window.NEXUS_DATA.devices)) return window.NEXUS_DATA.devices;
      return typeof window.getNexusLocalDevices === 'function' ? window.getNexusLocalDevices() : [];
    }

    function hydrateDeviceSelection() {
      pickerState.devices = new Set();
      getDeviceSource().forEach(device => {
        if (window.isDeviceCardSelected && window.isDeviceCardSelected(device.id)) {
          pickerState.devices.add(device.id);
        }
      });
    }

    function iconForCatalog(card) {
      if (!card) return '';
      const iconMap = {
        sun: '<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        shield: '<svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        bolt: '<svg class="w-5 h-5 text-[#4C7DFF]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 12-14h-7l1-6z" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        folder: '<svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 7h5l2 2h11v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        note: '<svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v9l-5 5H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" stroke-linecap="round" stroke-linejoin="round"></path><path d="M14 20v-5h5" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        checklist: '<svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 6h10M9 12h10M9 18h10M4 6h.01M4 12h.01M4 18h.01" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        spark: '<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8L12 3zM5 18l.9 2 .9-2 2-.9-2-.9-.9-2-.9 2-2 .9 2 .9z" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        leaf: '<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 21c6 0 12-6 12-12-6 0-12 6-12 12z"></path><path d="M9 15c2 0 6-2 10-8 0 8-4 12-10 12-2.5 0-4.5-1-6-3" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        'bell-off': '<svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10.73 5.08A6 6 0 0 1 18 11c0 3 1 5 2 6H8m5 4a2 2 0 0 1-4 0M3 3l18 18" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        calendar: '<svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 2v4M16 2v4M3 10h18M5 5h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        lock: '<svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 1 1 8 0v3" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        video: '<svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3z" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        'home-shield': '<svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"></path><path d="M5 10v9h5v-5h4v5h5v-9"></path><path d="M12 8l4 1.7v3.3c0 2.2-1.4 3.9-4 5-2.6-1.1-4-2.8-4-5V9.7L12 8z" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        chart: '<svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 19h16"></path><path d="M7 16V9M12 16V5M17 16v-3" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        play: '<svg class="w-5 h-5 text-[#4C7DFF]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 6l10 6-10 6V6z" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        rocket: '<svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 19c2-4 5-7 9-9 2-5 5-6 5-6s1 3-1 5c-2 4-5 7-9 9l-4 1 0-4z" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
        moon: '<svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" stroke-linecap="round" stroke-linejoin="round"></path></svg>'
      };
      return iconMap[card.icon] || iconMap.chart;
    }

    function checkCircle(selected) {
      return `<span class="check-circle${selected ? ' selected' : ''}">${selected ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 12.5l4 4 10-10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"></path></svg>' : ''}</span>`;
    }

    function smartHomeAccent(card) {
      const byId = {
        weather: 'bg-amber-50 text-amber-500',
        'ai-protect': 'bg-red-50 text-red-500',
        energy: 'bg-lime-50 text-lime-600',
        dnd: 'bg-rose-50 text-rose-500',
        'home-schedule': 'bg-sky-50 text-sky-500',
        'privacy-mode': 'bg-violet-50 text-violet-500',
        'multi-video': 'bg-blue-50 text-blue-500',
        'away-home': 'bg-orange-50 text-orange-500',
        'data-dashboard': 'bg-cyan-50 text-cyan-500',
        'air-quality': 'bg-emerald-50 text-emerald-500',
        'device-health': 'bg-teal-50 text-teal-500',
        'security-summary': 'bg-red-50 text-red-500',
        'room-scenes': 'bg-yellow-50 text-yellow-500',
        'cleaning-routine': 'bg-green-50 text-green-500',
        'guest-mode': 'bg-indigo-50 text-indigo-500',
        'leave-home-summary': 'bg-orange-50 text-orange-500',
        'sleep-prep': 'bg-indigo-50 text-indigo-500',
        'comfort-room': 'bg-pink-50 text-pink-500',
        'home-health': 'bg-cyan-50 text-cyan-500'
      };
      return { wrap: byId[card.id] || 'bg-blue-50 text-blue-500' };
    }

    function renderRow({ id, title, iconHtml, selected, subtitle, onEdit }) {
      return `
        <button class="picker-row w-full flex items-center gap-3 py-4 px-3 text-left active:bg-slate-50/80" type="button" onclick="toggleItem('${id}')">
          ${checkCircle(selected)}
          ${iconHtml}
          <span class="min-w-0 flex-1">
            <span class="block text-[16px] font-semibold text-slate-900">${title}</span>
            ${subtitle ? `<span class="block text-[12px] text-slate-500 mt-1">${subtitle}</span>` : ''}
          </span>
          ${onEdit ? `<div data-rename="${encodeURIComponent(onEdit)}" role="button" aria-label="Cihaz adını değiştir" class="p-2 text-slate-300 hover:text-blue-500 active:scale-95 transition-transform"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></div>` : ''}
        </button>
      `;
    }

    function renderPicker() {
      if (!window.NEXUS_CARD_CATALOG) {
        console.error('NEXUS_CARD_CATALOG tanımlı değil. data.js yüklendi mi?');
        return;
      }
      const list = document.getElementById('picker-list');
      const tabs = document.querySelectorAll('.picker-tab');
      tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === pickerState.activeTab));

      if (pickerState.activeTab === 'smartHome') {
        list.innerHTML = window.NEXUS_CARD_CATALOG.smartHome.map(card => {
          const accent = smartHomeAccent(card);
          const svg = window.getCardIconSvg ? window.getCardIconSvg(card.icon) : iconForCatalog(card);
          return renderRow({
            id: card.id,
            title: card.title,
            iconHtml: `<div class="w-11 h-11 rounded-full ${accent.wrap} flex items-center justify-center shrink-0">${svg}</div>`,
            selected: pickerState.smartHome.has(card.id)
          });
        }).join('');
        return;
      }

      if (pickerState.activeTab === 'devices') {
        const devices = getDeviceSource();
        if (devices.length === 0) {
          list.innerHTML = `<div class="nx-empty"><div class="nx-empty__icon" aria-hidden="true"><i data-lucide="cpu"></i></div><p class="nx-empty__title">Henüz eşleşmiş akıllı cihazı bulunmuyor</p><p class="nx-empty__text">Cihaz ekleyince kart olarak anasayfaya koyabilirsin.</p></div>`;
          if (typeof lucide !== 'undefined') lucide.createIcons();
          return;
        }
        list.innerHTML = devices.map(device => {
          const isOffline = device.state === 'Bağlantı Yok';
          const accent = isOffline ? { wrap: 'bg-slate-100 text-slate-400' } : (window.getDeviceAccent ? window.getDeviceAccent(device) : {wrap: 'bg-slate-100 text-slate-600'});
          const svg = window.getDeviceIconSvg ? window.getDeviceIconSvg(device.type, isOffline) : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 7h10v10H7z"></path></svg>';
          return renderRow({
            id: device.id,
            title: device.name || 'Cihaz',
            subtitle: device.room || device.state || 'Akıllı cihaz',
            iconHtml: `<div class="w-11 h-11 rounded-full ${accent.wrap} flex items-center justify-center shrink-0">${svg}</div>`,
            selected: pickerState.devices.has(device.id),
            onEdit: device.id
          });
        }).join('');
        return;
      }

      const customCards = window.getCustomClickRunCards ? window.getCustomClickRunCards() : window.NEXUS_CARD_CATALOG.tapToRun;
      if (customCards.length === 0) {
        list.innerHTML = `<div class="nx-empty"><div class="nx-empty__icon" aria-hidden="true"><i data-lucide="zap"></i></div><p class="nx-empty__title">Henüz eklenmiş bir senaryo bulunmuyor</p><p class="nx-empty__text">Önce 'Akıllı' sekmesinden bir senaryo oluşturun.</p></div>`;
        if (typeof lucide !== 'undefined') lucide.createIcons();
        return;
      }

      list.innerHTML = customCards.map(card => {
        const accent = window.getCardAccentClasses ? window.getCardAccentClasses(card.icon) : {wrap: 'bg-slate-100 text-slate-600'};
        const svg = window.getCardIconSvg ? window.getCardIconSvg(card.icon) : iconForCatalog(card);
        return renderRow({
          id: card.id,
          title: card.title,
          subtitle: card.desc || 'Hızlı senaryo kısayolu',
          iconHtml: `<div class="w-11 h-11 rounded-full ${accent.wrap} flex items-center justify-center shrink-0">${svg}</div>`,
          selected: pickerState.tapToRun.has(card.id)
        });
      }).join('');
    }

    function pairedDevices() {
      try {
        var raw = JSON.parse(nexusGetItem('nexusPairedDevices') || '[]');
        return Array.isArray(raw) ? raw : [];
      } catch (e) {
        return [];
      }
    }

    function listedName(id) {
      var row = getDeviceSource().find(function (d) { return d && d.id === id; });
      return row && row.name ? row.name : '';
    }

    function saveRename(id, name) {
      var paired = pairedDevices();
      var direct = paired.find(function (d) { return d && d.id === id; });
      if (direct) {
        direct.name = name;
        nexusSetItem('nexusPairedDevices', JSON.stringify(paired));
        return true;
      }
      var index = /^paired-(\d+)$/.exec(String(id || ''));
      if (index) {
        var want = Number(index[1]);
        var seen = 0;
        for (var i = 0; i < paired.length; i++) {
          var device = paired[i];
          if (!device || !device.name || !device.host) continue;
          if (seen === want) {
            paired[i].name = name;
            nexusSetItem('nexusPairedDevices', JSON.stringify(paired));
            return true;
          }
          seen++;
        }
        return false;
      }
      var cards = [];
      try { cards = JSON.parse(nexusGetItem('nexusDashboardCards') || '[]'); } catch (e) { cards = []; }
      if (!Array.isArray(cards)) return false;
      var card = cards.find(function (c) { return c && c.id === id; });
      if (!card) return false;
      card.title = name;
      nexusSetItem('nexusDashboardCards', JSON.stringify(cards));
      return true;
    }

    function showRenameModal(id) {
      var currentName = listedName(id);
      if (!currentName || typeof window.nexusDialog !== 'function') return;
      window.nexusDialog({
        title: 'Cihaz adı',
        message: 'Bu ad ana sayfa kartında ve cihaz listesinde görünür.',
        input: { value: currentName, placeholder: 'Cihaz adı', maxLength: 60 },
        primary: {
          label: 'Kaydet',
          onClick: function (value) {
            var name = String(value || '').trim().slice(0, 60);
            if (!name || !saveRename(id, name)) return;
            if (window.nexusCloud && window.nexusCloud.notifyLocalChange) window.nexusCloud.notifyLocalChange();
            if (window.NEXUS_DATA && Array.isArray(window.NEXUS_DATA.devices)) {
              var live = window.NEXUS_DATA.devices.find(function (d) { return d && d.id === id; });
              if (live) live.name = name;
            }
            renderPicker();
          }
        },
        secondary: { label: 'Vazgeç' }
      });
    }

    window.renameDevicePrompt = function(id) {
      showRenameModal(id);
    };

    function toggleItem(id) {
      const active = pickerState.activeTab;
      const target = pickerState[active];
      if (target.has(id)) target.delete(id);
      else target.add(id);
      renderPicker();
    }

    function commitSelection() {
      if (!window.NEXUS_CARD_CATALOG) {
        console.error('NEXUS_CARD_CATALOG tanımlı değil. data.js yüklendi mi?');
        return;
      }
      if (typeof window.setSmartHomeCardSelected === 'function') {
        window.NEXUS_CARD_CATALOG.smartHome.forEach(card => {
          window.setSmartHomeCardSelected(card.id, pickerState.smartHome.has(card.id));
        });
      }

      if (typeof window.setTapToRunCardSelected === 'function') {
        const customCards = window.getCustomClickRunCards ? window.getCustomClickRunCards() : window.NEXUS_CARD_CATALOG.tapToRun;
        customCards.forEach(card => {
          window.setTapToRunCardSelected(card.id, pickerState.tapToRun.has(card.id));
        });
      }

      if (typeof window.setDeviceCardSelected === 'function') {
        getDeviceSource().forEach(device => {
          window.setDeviceCardSelected(device.id, pickerState.devices.has(device.id));
        });
      }

      location.href = 'nexus-home.html';
    }

    function cancelPicker() {
      location.href = 'nexus-home.html';
    }

    var pickerList = document.getElementById('picker-list');
    if (pickerList) {
      pickerList.addEventListener('click', function (e) {
        var pen = e.target.closest('[data-rename]');
        if (!pen) return;
        e.preventDefault();
        e.stopPropagation();
        renameDevicePrompt(decodeURIComponent(pen.getAttribute('data-rename') || ''));
      }, true);
    }

    document.querySelectorAll('.picker-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        pickerState.activeTab = tab.dataset.tab;
        renderPicker();
      });
    });

    hydrateDeviceSelection();
    document.addEventListener('nexusDataReady', () => {
      hydrateDeviceSelection();
      renderPicker();
    });
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderPicker);
    } else {
      renderPicker();
    }
    window.commitSelection = commitSelection;
    window.cancelPicker = cancelPicker;
    window.toggleItem = toggleItem;
  </script>
</body>
</html>
