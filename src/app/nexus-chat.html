<script>
  /* ---------- Gerçek sohbet geçmişi + günlük AI puan sayacı ---------- */
  var CHAT_KEY = 'nexusChatHistory';
  var POINTS_KEY = 'nexusAiPoints';
  var currentChatId = null;

  function loadChats() {
    try { return JSON.parse(nexusGetItem(CHAT_KEY) || '[]') || []; } catch (e) { return []; }
  }
  function saveChats(list) {
    try { nexusSetItem(CHAT_KEY, JSON.stringify(list)); } catch (e) { /* kota */ }
  }
  function persistMessage(role, text) {
    var list = loadChats();
    var chat = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === currentChatId) { chat = list[i]; break; }
    if (!chat) {
      chat = { id: currentChatId, title: '', createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
      list.push(chat);
    }
    chat.messages.push({ role: role, text: text, ts: Date.now() });
    if (role === 'user' && !chat.title) chat.title = text.slice(0, 40);
    chat.updatedAt = Date.now();
    saveChats(list);
  }

  /* Puan: ücretsizde günlük 30, NEXUS+ aboneliğinde aylık 2000 (theme.js nexusPoints) */
  function pointsLeft() { return window.nexusPoints.left(); }
  function usePoint() { window.nexusPoints.use(); }
  function updateInputLock() {
    var input = document.getElementById('chat-input');
    var send = document.getElementById('chat-send');
    if (!input || !send) return;
    // Yerel komutlar (cihaz kontrolü, senaryo, durum) krediden etkilenmez; kredi yalnızca yapay zekâ sohbet yanıtlarını sınırlar.
    var out = pointsLeft() === 0;
    input.disabled = false;
    send.disabled = false;
    send.classList.remove('opacity-40');
    if (out) {
      input.placeholder = window.nexusPoints.exhaustedText() + ' · ' + (window.nexusT ? nexusT('Cihaz komutları yine çalışır', 'Device commands still work') : 'Cihaz komutları yine çalışır');
    } else {
      input.placeholder = window.nexusAssistant && window.nexusAssistant.modes ? window.nexusAssistant.modes.hint() : 'Nasıl yardımcı olabilirim?';
    }
  }
  function renderModes() {
    var M = window.nexusAssistant && window.nexusAssistant.modes, host = document.getElementById('assistant-modes');
    if (!M || !host) return;
    host.innerHTML = M.list().map(function (m) {
      return '<button type="button" role="radio" aria-checked="' + (M.get() === m.id) + '" class="nx-mode' + (M.get() === m.id ? ' is-on' : '') + '" data-mode="' + m.id + '">' + escapeHtml(m.label) + '</button>';
    }).join('');
    var on = host.querySelector('.is-on');
    if (on) host.scrollLeft = Math.max(0, on.offsetLeft - 16);
  }
  document.getElementById('assistant-modes').addEventListener('click', function (e) {
    var b = e.target.closest('[data-mode]');
    if (!b) return;
    window.nexusAssistant.modes.set(b.getAttribute('data-mode'));
    renderModes(); updateInputLock(); document.getElementById('chat-input').focus();
  });

  /* Kullanıcının gerçekten eşleştirdiği cihazı sayısı */
  function realDeviceCount() {
    var n = 0;
    try { n += (JSON.parse(nexusGetItem('nexusPairedDevices') || '[]') || []).length; } catch (e) {}
    try {
      var cards = JSON.parse(nexusGetItem('nexusDashboardCards') || '[]') || [];
      n += cards.filter(function (c) { return c.id && c.id.indexOf('device-') === 0 && c.visible; }).length;
    } catch (e) {}
    return n;
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  }

  function sendQuickMessage(text) {
    const input = document.getElementById('chat-input');
    input.value = window.nexusTr ? nexusTr(text) : text;
    sendMessage();
  }

  function openAiSettings() {
    window.location.href = 'nexus-settings.html#ai-settings';
  }

  function hideGreeting() {
    const greeting = document.getElementById('hero-greeting');
    if (greeting) greeting.style.display = 'none';
  }

  /* Kullanıcı kimliği: profil ile aynı gerçek veri (nexusUserName / nexusAvatar) */
  var DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23cbd5e1'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E";
  function userFirstName() {
    var n = '';
    try { n = (nexusGetItem('nexusUserName') || '').trim(); } catch (e) {}
    if (!n || n === 'Misafir') return '';
    return n.split(' ')[0];
  }

  function appendUserBubble(text) {
    const messages = document.getElementById('chat-messages');
    const userMsg = document.createElement('div');
    userMsg.className = 'flex justify-end mb-4 w-full';

    var avatar = '';
    try {
      // Profil ile aynı anahtar: nexusAvatar (user-info kaydeder, home/profil okur)
      avatar = nexusGetItem('nexusAvatar') || DEFAULT_AVATAR;
    } catch(e) { avatar = DEFAULT_AVATAR; }

    userMsg.innerHTML = '<div class="flex items-end gap-2.5 max-w-[92%] justify-end">' +
      '<div data-no-i18n class="user-bubble px-5 py-3.5 rounded-3xl rounded-br-sm text-[15px] font-medium leading-relaxed">' + escapeHtml(text) + '</div>' +
      '<img src="' + avatar + '" class="w-7 h-7 shrink-0 mb-1 shadow-sm rounded-xl object-cover border border-slate-100 dark:border-slate-700" alt="User" />' +
      '</div>';
    messages.appendChild(userMsg);
  }

  function appendAiBubble(reply, widgetHtml) {
    const messages = document.getElementById('chat-messages');
    const aiResponse = document.createElement('div');
    aiResponse.className = 'flex justify-start mb-4 w-full';
    aiResponse.innerHTML = '<div class="flex items-end gap-2.5 max-w-[92%]"><div class="w-7 h-7 shrink-0 mb-1 shadow-sm rounded-xl overflow-hidden"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full"><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#nxlogo)"/><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#nxsheen)"/><path d="M10.5 22.5V10.5L21.5 22.5V10.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="ai-bubble px-5 py-3.5 rounded-3xl rounded-bl-sm text-[15px] font-medium tracking-tight">' + escapeHtml(reply) + (widgetHtml || '') + '</div></div>';
    messages.appendChild(aiResponse);
    return aiResponse;
  }

  function normalizeIntentText(text) {
    // Buyuk harf eslemesi toLowerCase() ONCESINE alindi: eskiden zincir zaten kucuk
    // harfe cevrilmis metinde calisiyordu, bu yuzden hicbir dal eslesmiyordu (ol kod).
    // Ustelik Ğ ve Ş kaliplari kaynakta bir kez daha bozuk kodlanmis halde duruyordu.
    return (text || '')
      .replace(/İ/g, 'i').replace(/I/g, 'i').replace(/Ğ/g, 'g').replace(/Ü/g, 'u').replace(/Ş/g, 's').replace(/Ö/g, 'o').replace(/Ç/g, 'c')
      .toLowerCase()
      .replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ö/g, 'o').replace(/ç/g, 'c')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function currentAiCreateType() {
    if (window.__nexusAiCreateType === 'automation') return 'automation';
    try {
      return new URLSearchParams(window.location.search).get('type') === 'automation' ? 'automation' : 'clickrun';
    } catch (e) {
      return 'clickrun';
    }
  }

  function inferScenarioMeta(text) {
    var clean = normalizeIntentText(text);
    var isEn = window.nexusLang === 'en';
    var meta = {
      title: isEn ? 'Smart Home Routine' : 'Akıllı Ev Rutini',
      desc: isEn ? 'Actionable routine built around your conditions.' : 'İstediğin koşullara göre hazırlanan uygulanabilir ev rutini.',
      icon: 'zap',
      bgClass: 'bg-[#4C7DFF]/10',
      colorClass: 'text-[#4C7DFF]'
    };
    if (/sabah|gunaydin|uyan|morning|wake/.test(clean)) {
      return { title: isEn ? 'Morning Routine' : 'Sabah Rutini', desc: isEn ? 'Prepares selected devices in order at the start of your day.' : 'Güne başlarken seçili cihazları sırayla hazırlar.', icon: 'sun', bgClass: 'bg-amber-500/10', colorClass: 'text-amber-500' };
    }
    if (/film|sinema|tv|dizi|movie|cinema|series/.test(clean)) {
      return { title: isEn ? 'Movie Mode' : 'Sinema Modu', desc: isEn ? 'Prepares lights, blinds and media for your viewing ambiance.' : 'İzleme ortamı için ışık, perde ve medya adımlarını hazırlar.', icon: 'film', bgClass: 'bg-rose-500/10', colorClass: 'text-rose-500' };
    }
    if (/gece|uyku|iyi geceler|night|sleep|bed/.test(clean)) {
      return { title: isEn ? 'Good Night' : 'İyi Geceler', desc: isEn ? 'Adjusts lights, notifications and security for the night.' : 'Gece için ışıkları, bildirimleri ve güvenlik adımlarını düzenler.', icon: 'moon', bgClass: 'bg-indigo-500/10', colorClass: 'text-indigo-500' };
    }
    if (/kahve|mutfak|coffee|kitchen/.test(clean)) {
      return { title: isEn ? 'Coffee Time' : 'Kahve Saati', desc: isEn ? 'Prepares kitchen devices with one tap.' : 'Mutfak rutini için uygun cihazları tek dokunuşla hazırlar.', icon: 'coffee', bgClass: 'bg-orange-500/10', colorClass: 'text-orange-500' };
    }
    if (/disari|cikis|evden cik|tatil|leave|leaving|away|holiday|vacation/.test(clean)) {
      return { title: isEn ? 'Leaving Home' : 'Evden Çıkış', desc: isEn ? 'Bundles energy and security checks when you depart.' : 'Evden ayrılırken enerji ve güvenlik kontrollerini toparlar.', icon: 'door-open', bgClass: 'bg-sky-500/10', colorClass: 'text-sky-500' };
    }
    if (/guven|kilit|alarm|kamera|security|lock|camera/.test(clean)) {
      return { title: isEn ? 'Security Check' : 'Güvenlik Kontrolü', desc: isEn ? 'Reviews locks, alarms and camera states together.' : 'Kilit, alarm ve kamera durumlarını birlikte kontrol eder.', icon: 'shield-check', bgClass: 'bg-red-500/10', colorClass: 'text-red-500' };
    }
    if (/enerji|tasarruf|priz|energy|saving|plug/.test(clean)) {
      return { title: isEn ? 'Energy Saving' : 'Enerji Tasarrufu', desc: isEn ? 'Runs energy steps to reduce unnecessary consumption.' : 'Gereksiz tüketimi azaltmak için enerji adımlarını çalıştırır.', icon: 'bolt', bgClass: 'bg-lime-500/10', colorClass: 'text-lime-600' };
    }
    if (/temiz|robot|supurge|clean|vacuum/.test(clean)) {
      return { title: isEn ? 'Start Cleaning' : 'Temizlik Başlat', desc: isEn ? 'Launches cleaning devices in sequence and mode.' : 'Temizlik cihazlarını uygun sıra ve modla başlatır.', icon: 'leaf', bgClass: 'bg-emerald-500/10', colorClass: 'text-emerald-500' };
    }
    return meta;
  }

  /* Yerel komut asistanı (nexus-assistant.js): komutları eşleşmiş cihazlara gerçekten uygular */
  var ACTION_TAGS = { dark: 'ENABLE_DARK_MODE', light: 'ENABLE_LIGHT_MODE', 'dnd-on': 'ENABLE_DND', 'dnd-off': 'DISABLE_DND', create: 'CREATE_SCENARIO' };
  function buildReply(text) {
    if (!window.nexusAssistant) return { reply: nexusT('Asistan yüklenemedi.', 'The assistant could not be loaded.'), widgetHtml: '' };
    var r = window.nexusAssistant.reply(text);
    var tag = r.action && ACTION_TAGS[r.action] ? ' [ACTION: ' + ACTION_TAGS[r.action] + ']' : '';
    return {
      reply: r.reply + tag,
      widgetHtml: r.widget || '',
      unknown: !!r.unknown,
      lanItems: window.nexusAssistant.lanPending ? window.nexusAssistant.lanPending() : []
    };
  }

  /* Yerel ağ komutunun gerçek sonucunu bekle: cihaza ulaşmadıysa balonun altına uyarı ekle.
     ("komut gitti" demek yeterli değil; kullanıcı cihazın gerçekten değişip değişmediğini bilmeli.) */
  function watchLanResult(items, bubbleEl) {
    if (!items || !items.length || !window.nexusAssistant || !window.nexusAssistant.lanFailureNote || !window.nexusAssistant.lanSettled) return;
    var waited = 0, step = 300, limit = 7000;
    var timer = setInterval(function () {
      waited += step;
      var settled = window.nexusAssistant.lanSettled(items);
      if (!settled && waited < limit) return;
      clearInterval(timer);
      var note = window.nexusAssistant.lanFailureNote(items);
      if (!note || !bubbleEl || !bubbleEl.parentNode) return;
      var bubble = bubbleEl.querySelector('.ai-bubble');
      if (!bubble || bubble.querySelector('[data-lan-note]')) return;
      var line = document.createElement('p');
      line.setAttribute('data-lan-note', '1');
      line.setAttribute('data-no-i18n', '');
      line.className = 'nx-lan-note';
      line.textContent = note;
      bubble.appendChild(line);
      // Komut cihaza ulaşamadı: kısa boğuk uyarı sesi
      if (window.nexusFeedback) window.nexusFeedback.play('error');
      scrollToBottom();
    }, step);
  }

  function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    hideGreeting();

    const messages = document.getElementById('chat-messages');

    appendUserBubble(text);
    persistMessage('user', text);
    input.value = '';
    // "Gönderildi" kısa tık sesi (nexus-feedback.js; anahtar kapalıysa sessiz)
    if (window.nexusFeedback) window.nexusFeedback.play('copy');
    scrollToBottom();

    // Show processing
    const aiProcessing = document.createElement('div');
    aiProcessing.className = 'flex justify-start mb-4 w-full ai-msg';
    aiProcessing.innerHTML = '<div class="flex items-end gap-2.5 max-w-[92%]"><div class="w-7 h-7 shrink-0 mb-1 shadow-sm rounded-xl overflow-hidden"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full"><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#nxlogo)"/><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#nxsheen)"/><path d="M10.5 22.5V10.5L21.5 22.5V10.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="ai-bubble px-5 py-3.5 rounded-3xl rounded-bl-sm text-[14px] flex gap-1 items-center"><span class="w-2 h-2 bg-purple-300 rounded-full animate-bounce"></span><span class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></span><span class="w-2 h-2 bg-[#4C7DFF] rounded-full animate-bounce" style="animation-delay: 0.2s"></span></div></div>';
    messages.appendChild(aiProcessing);
    scrollToBottom();

    function finishReply(r) {
      if (aiProcessing.parentNode) aiProcessing.parentNode.removeChild(aiProcessing);
      var aiText = r.reply;

      // Parse Action Tags
      const actionRegex = /\[ACTION:\s*([A-Z0-9_]+)\]/g;
      const actions = [];
      let match;
      while ((match = actionRegex.exec(aiText)) !== null) {
          actions.push(match[1]);
      }

      // Clean text
      const cleanText = aiText.replace(actionRegex, '').trim();

      // Execute actions
      var additionalWidget = '';
      var sysSetting = (window.nexusT ? nexusT('Sistem Ayarı', 'System Setting') : 'Sistem Ayarı');
      var viewLabel = (window.nexusT ? nexusT('Görüntüle', 'View') : 'Görüntüle');
      actions.forEach(action => {
          if (action === 'ENABLE_DARK_MODE') {
              document.documentElement.classList.add('dark');
              nexusSetItem('nexusDarkMode', 'true');
              window.dispatchEvent(new Event('themeChanged'));
              var darkMsg = (window.nexusT ? nexusT('Karanlık tema aktif edildi', 'Dark theme enabled') : 'Karanlık tema aktif edildi');
              additionalWidget += '<div class="mt-3 bg-[#F1F7FF] dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl p-3 flex items-center gap-3"><div class="p-2 bg-white dark:bg-slate-800 rounded-lg text-slate-800 dark:text-white"><i data-lucide="moon" class="w-5 h-5"></i></div><div><p class="text-sm font-semibold text-gray-800 dark:text-white">' + sysSetting + '</p><p class="text-xs text-gray-500 dark:text-slate-400">' + darkMsg + '</p></div></div>';
          } else if (action === 'ENABLE_LIGHT_MODE') {
              document.documentElement.classList.remove('dark');
              nexusSetItem('nexusDarkMode', 'false');
              window.dispatchEvent(new Event('themeChanged'));
              var lightMsg = (window.nexusT ? nexusT('Açık tema aktif edildi', 'Light theme enabled') : 'Açık tema aktif edildi');
              additionalWidget += '<div class="mt-3 bg-[#F1F7FF] border border-slate-200 rounded-xl p-3 flex items-center gap-3"><div class="p-2 bg-white rounded-lg text-amber-500"><i data-lucide="sun" class="w-5 h-5"></i></div><div><p class="text-sm font-semibold text-gray-800">' + sysSetting + '</p><p class="text-xs text-gray-500">' + lightMsg + '</p></div></div>';
          } else if (action === 'ENABLE_DND') {
              nexusSetItem('nexusDndState', 'Açık');
              // notify.js dndActive() nexusDndActive/nexusDndEndTime okur; yalnız
              // nexusDndState yazılıyorsa asistan "sessize aldım" derken dış
              // kanallar (ntfy/Telegram/sistem) susturulmamış oluyordu.
              nexusSetItem('nexusDndActive', 'true');
              var dndOnMsg = (window.nexusT ? nexusT('Rahatsız etme modu açıldı', 'Do not disturb enabled') : 'Rahatsız etme modu açıldı');
              additionalWidget += '<div class="mt-3 bg-[#F1F7FF] dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl p-3 flex items-center gap-3"><div class="p-2 bg-white dark:bg-slate-800 rounded-lg text-[#FF3B5C]"><i data-lucide="bell-off" class="w-5 h-5"></i></div><div><p class="text-sm font-semibold text-gray-800 dark:text-white">' + sysSetting + '</p><p class="text-xs text-gray-500 dark:text-slate-400">' + dndOnMsg + '</p></div></div>';
          } else if (action === 'DISABLE_DND') {
              nexusSetItem('nexusDndState', 'Kapalı');
              nexusSetItem('nexusDndActive', 'false');
              var dndOffMsg = (window.nexusT ? nexusT('Rahatsız etme modu kapatıldı', 'Do not disturb disabled') : 'Rahatsız etme modu kapatıldı');
              additionalWidget += '<div class="mt-3 bg-[#F1F7FF] dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl p-3 flex items-center gap-3"><div class="p-2 bg-white dark:bg-slate-800 rounded-lg text-[#4C7DFF]"><i data-lucide="bell" class="w-5 h-5"></i></div><div><p class="text-sm font-semibold text-gray-800 dark:text-white">' + sysSetting + '</p><p class="text-xs text-gray-500 dark:text-slate-400">' + dndOffMsg + '</p></div></div>';
          } else if (action === 'CREATE_SCENARIO') {
              var targetType = currentAiCreateType();
              var targetKey = targetType === 'automation' ? 'nexusCustomAutomations' : 'nexusCustomClickRun';
              var targetTab = targetType === 'automation' ? 'tab-automation' : 'tab-clickrun';
              var targetLabel = targetType === 'automation' ? (window.nexusT ? nexusT('Otomasyonlar listesine eklendi', 'Added to Automations') : 'Otomasyonlar listesine eklendi') : (window.nexusT ? nexusT('Tıkla ve Çalıştır listesine eklendi', 'Added to Tap to Run') : 'Tıkla ve Çalıştır listesine eklendi');
              var items = [];
              try {
                items = typeof readAndNormalizeItems === 'function'
                  ? readAndNormalizeItems(targetKey, targetType)
                  : (JSON.parse(nexusGetItem(targetKey) || '[]') || []);
              } catch(e) {}
              var newId = 'ai-scene-' + Date.now();
              var meta = inferScenarioMeta(text);

              items.push({
                id: newId,
                title: meta.title,
                desc: meta.desc,
                icon: meta.icon,
                bgClass: meta.bgClass,
                colorClass: meta.colorClass,
                room: (window.nexusT ? nexusT('Tüm Ev', 'Whole Home') : 'Tüm Ev'),
                enabled: true,
                source: 'ai-offline'
              });
              if (typeof writeNormalizedItems === 'function') {
                writeNormalizedItems(targetKey, items, targetType);
              } else {
                nexusSetItem(targetKey, JSON.stringify(items));
              }

              additionalWidget += '<div class="mt-3 bg-[#F1F7FF] dark:bg-slate-700/50 border border-blue-200 dark:border-blue-500/30 rounded-xl p-3 flex items-center justify-between gap-3"><div class="flex items-center gap-3 min-w-0"><div class="p-2 ' + meta.bgClass + ' rounded-lg ' + meta.colorClass + '"><i data-lucide="' + meta.icon + '" class="w-5 h-5"></i></div><div class="min-w-0"><p class="text-sm font-semibold text-gray-800 dark:text-white truncate">' + escapeHtml(meta.title) + '</p><p class="text-xs text-gray-500 dark:text-slate-400">' + targetLabel + '</p></div></div><a href="nexus-smart.html?tab=' + targetTab + '" class="shrink-0 text-xs font-bold text-[#4C7DFF] bg-white dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-blue-100 dark:border-slate-600 shadow-sm active:scale-95 transition-all">' + viewLabel + '</a></div>';
          }
      });

      var finalWidget = (r.widgetHtml || '') + additionalWidget;

      var bubbleEl = appendAiBubble(cleanText, finalWidget);
      persistMessage('ai', cleanText); // Save clean text to history
      // Yanıt geldi: kısa iki nota onay (hata notu ayrıca 'error' çalar)
      if (window.nexusFeedback) window.nexusFeedback.play('success');
      scrollToBottom();

      if (additionalWidget && typeof lucide !== 'undefined') {
          lucide.createIcons(); // re-init icons for the new widgets
      }

      watchLanResult(r.lanItems, bubbleEl);
    }
    setTimeout(function () {
      var M = window.nexusAssistant && window.nexusAssistant.modes;
      var r = buildReply(M ? M.query(text) : text);
      if (r.unknown && M && M.local()) { r.reply = M.notUnderstood(); finishReply(r); return; }
      if (r.unknown && window.nexusAssistant && window.nexusAssistant.ask) {
        if (pointsLeft() === 0) { r.reply = window.nexusPoints.exhaustedText() + '. ' + r.reply; finishReply(r); return; }
        window.nexusAssistant.ask(text).then(function (ai) { if (ai) { r.reply = ai; usePoint(); updateInputLock(); } finishReply(r); });
      } else { finishReply(r); }
    }, 700);
  }

  function syncAttachMenuLang() {
    var isEn = window.nexusLang === 'en';
    var menu = document.getElementById('attach-menu');
    if (!menu) return;
    if (isEn) {
      menu.setAttribute('aria-label', 'Attachment options');
      var labels = menu.querySelectorAll('.attach-label');
      if (labels[0]) labels[0].textContent = 'Photo from gallery';
      if (labels[1]) labels[1].textContent = 'Take photo';
      if (labels[2]) labels[2].textContent = 'Ask my devices';
    }
  }

  function toggleAttachMenu(forceState) {
    var menu = document.getElementById('attach-menu');
    var backdrop = document.getElementById('attach-backdrop');
    var btn = menu.parentElement.querySelector('button[aria-label="Ek ekle"]');
    var show = typeof forceState === 'boolean' ? forceState : menu.classList.contains('hidden');
    if (show) syncAttachMenuLang();
    menu.classList.toggle('hidden', !show);
    backdrop.classList.toggle('hidden', !show);
    if (btn) btn.setAttribute('aria-expanded', String(show));
  }

  function attachChoice(kind) {
    toggleAttachMenu(false);
    if (kind === 'ask') {
      var input = document.getElementById('chat-input');
      input.value = (window.nexusT ? nexusT('Evimdeki cihazların durumu nedir?', 'What is the status of my devices?') : 'Evimdeki cihazların durumu nedir?');
      input.focus();
      return;
    }
    var picker = document.getElementById(kind === 'camera' ? 'chat-camera' : 'chat-file');
    if (picker) picker.click();

  function appendUserImage(dataUrl, name) {
    var messages = document.getElementById('chat-messages');
    var wrap = document.createElement('div');
    wrap.className = 'flex justify-end mb-4 w-full';
    wrap.innerHTML = '<div class="max-w-[70%]"><img src="' + dataUrl + '" alt="' + escapeHtml(name) + '" class="rounded-2xl rounded-tr-sm shadow-sm border border-gray-100 w-full object-cover"/></div>';
    messages.appendChild(wrap);
  }

  function handleAttachment(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)) { e.target.value = ''; return; }
    hideGreeting();
    var reader = new FileReader();
    reader.onload = function (ev) {
      appendUserImage(ev.target.result, file.name);
      persistMessage('user', (window.nexusT ? nexusT('[Görsel: ', '[Image: ') : '[Görsel: ') + file.name + ']');
      scrollToBottom();
      setTimeout(function () {
        var reply = nexusT('Görselini aldım ama şu an görselleri analiz edemiyorum. Cihazların ve uygulama hakkında yazarak yardım isteyebilirsin.', 'I received your image but I can not analyse images yet. You can ask me about your devices and the app in text.');
        appendAiBubble(reply, '');
        persistMessage('ai', reply);
        scrollToBottom();
      }, 1200);
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function escapeHtml(unsafe) {
    return unsafe
         .replace(/&/g, "&amp;")
         .replace(/</g, "&lt;")
         .replace(/>/g, "&gt;")
         .replace(/"/g, "&quot;")
         .replace(/'/g, "&#039;");
  }

  function scrollToBottom() {
    const messages = document.getElementById('chat-messages');
    messages.scrollTop = messages.scrollHeight;
  }

  function autoSendIncomingPrompt() {
    var params = new URLSearchParams(window.location.search);
    var promptText = (params.get('promptText') || '').trim();
    var promptId = (params.get('promptId') || '').trim();
    // Hiçbir bağlantı kullanıcı adına mesaj göndermez: metin varsa yalnızca input'a yazılır, göndermek kullanıcıda.
    // Asistan çubuğu/simgesi (helper=ready) ya da boş çubuk: input boş açılır.
    if (!promptText && promptId && typeof window.getSmartPromptById === 'function') {
      var promptItem = window.getSmartPromptById(promptId);
      if (promptItem && promptItem.prompt) {
        promptText = promptItem.prompt;
      }
    }
    if (!promptText) return false;
    if (typeof window.nexusTr === 'function') promptText = window.nexusTr(promptText);
    setTimeout(function () {
      var input = document.getElementById('chat-input');
      if (!input || input.disabled) return;
      input.value = promptText;
      try { input.focus(); input.setSelectionRange(promptText.length, promptText.length); } catch (e) {}
      if (window.history && window.history.replaceState) {
        var cleanUrl = window.location.pathname + (currentChatId ? ('?chat=' + encodeURIComponent(currentChatId)) : '');
        window.history.replaceState({}, document.title, cleanUrl);
      }
    }, 250);
    return true;
  }

  /* Sayfa açılışı: ?chat=<id> varsa geçmişi geri yükle, yoksa yeni konuşma */
  (function initChat() {
    // Karşılamayı kullanıcının adıyla kişiselleştir (gerçek veri: nexusUserName)
    var fn = userFirstName();
    var greetH1 = document.querySelector('#hero-greeting h1');
    if (greetH1) {
      var howHelp = window.nexusT ? nexusT('Nasıl yardımcı olabilirim?', 'How can I help you?') : 'Nasıl yardımcı olabilirim?';
      greetH1.innerHTML = fn
        ? ((window.nexusT ? nexusT('Tekrar hoş geldin, ', 'Welcome back, ') : 'Tekrar hoş geldin, ') + escapeHtml(fn) + '!<br/>' + howHelp)
        : ((window.nexusT ? nexusT('Tekrar görüşmek güzel!', 'Great to see you again!') : 'Tekrar görüşmek güzel!') + '<br/>' + howHelp);
    }
    var params = new URLSearchParams(window.location.search);
    window.__nexusAiCreateType = params.get('type') === 'automation' ? 'automation' : 'clickrun';
    // Akıllı sayfasındaki asistan çubuğundan gelindiyse ilgili oluşturma modu seçili açılır.
    if (params.get('type') && window.nexusAssistant && window.nexusAssistant.modes) window.nexusAssistant.modes.set(params.get('type') === 'automation' ? 'automation' : 'scenario');
    var requested = params.get('chat');
    if (requested) {
      var list = loadChats();
      var chat = null;
      for (var i = 0; i < list.length; i++) if (list[i].id === requested) { chat = list[i]; break; }
      if (chat && chat.messages.length) {
        currentChatId = chat.id;
        hideGreeting();
        chat.messages.forEach(function (m) {
          if (m.role === 'user') appendUserBubble(m.text);
          else appendAiBubble(m.text, '');
        });
        setTimeout(scrollToBottom, 0);
      } else {
        currentChatId = requested;
      }
    } else {
      currentChatId = 'c' + Date.now() + Math.random().toString(36).slice(2, 7);
    }
    function run() {
      syncAttachMenuLang();
      renderModes();
      updateInputLock();
      var autoSent = autoSendIncomingPrompt();
      // Ana sayfadaki/Akıllı'daki asistan çubuğuna tıklayıp gelince yazma imleci hazır
      // olsun: input odaklı başlar, caret yanıp söner — kullanıcı direkt yazar.
      // Dokunmatikte odaklanmıyoruz: ekran klavyesi istemsiz açılmasın; orada
      // kullanıcı inputa dokununca odak kazanır. Otomatik gönderim varsa sendMessage
      // kendi akışında zaten odağı geri alır.
      try {
        var fine = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        var ci = document.getElementById('chat-input');
        if (!autoSent && fine && ci && !ci.disabled) {
          ci.focus();
          if (typeof ci.setSelectionRange === 'function') { var L = ci.value.length; ci.setSelectionRange(L, L); }
        }
      } catch (e) {}
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', run);
    } else {
      run();
    }
  })();
</script>
