<style data-purpose="custom-styles">
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* Gradient for the main subscription card */
    .bg-billing-hero {
      background: linear-gradient(135deg, var(--nx-accent,#4C7DFF) 0%, #22D3EE 100%);
    }
  </style>
<style>
    body {
      min-height: 100dvh;
    }
  </style>
</head>
<body class="bg-dashboard-gradient dark:bg-slate-950 min-h-screen text-slate-800 dark:text-slate-100 antialiased transition-colors duration-300" style="overflow-x:clip">
<!-- BEGIN: NavigationHeader -->
<header class="sticky top-0 z-50 nx-hdr-blend px-4 py-4 pt-12 flex items-center transition-colors duration-300">
<button onclick="window.history.length > 1 ? history.back() : window.location.href='nexus-home.html'" aria-label="Geri" class="p-1 -ml-1 flex items-center text-slate-800 dark:text-white active:opacity-70 transition-opacity">
<!-- Chevron Left Icon -->
<svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<div class="flex-1 pr-8">
<h1 class="text-lg font-bold tracking-tight text-center text-slate-900 dark:text-white">Faturalandırma</h1>
</div>
</header>
<!-- END: NavigationHeader -->

<main class="px-5 py-4 space-y-6">
<!-- BEGIN: SubscriptionCard -->
<section data-purpose="subscription-status">
<div class="bg-billing-hero rounded-3xl p-6 flex items-center shadow-lg text-white w-full relative overflow-hidden">
<!-- Background decor -->
<div class="absolute -right-8 -top-8 w-32 h-32 bg-white/10 rounded-full blur-2xl pointer-events-none z-0"></div>

<!-- LOGO (NEXUS ICON) -->
<div class="relative z-10 bg-white/15 backdrop-blur-md rounded-2xl p-3 mr-4 flex items-center justify-center w-[68px] h-[68px] shadow-inner flex-shrink-0 border border-white/20">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-10 h-10 drop-shadow-md">
    <rect width="512" height="512" rx="144" fill="transparent"/>
    <rect x="24" y="24" width="464" height="464" rx="136" fill="none" stroke="#ffffff" stroke-opacity="1" stroke-width="24"/>
    <path d="M168 360V168L344 360V168" fill="none" stroke="#ffffff" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

<!-- TEXT SIDE-BY-SIDE -->
<div class="relative z-10 flex-1 min-w-0">
<h2 class="text-[20px] font-bold mb-1 leading-tight" id="sub-title">NEXUS+</h2>
<p class="text-white/85 text-[13px] font-medium truncate hidden" id="sub-since"></p>
<p class="text-white/85 text-[13px] font-medium mt-0.5 leading-snug" id="sub-renewal"></p>
</div>

</div>
</section>
<!-- END: SubscriptionCard -->

<!-- BEGIN: NavigationList (zero-dead-UI: yalnızca gerçek hedefi olan eylemler) -->
<nav class="space-y-4" data-purpose="billing-menu">
<!-- Abonelik Yönetimi -->
<button class="w-full flex items-center justify-between bg-white dark:bg-slate-900 p-5 rounded-3xl shadow-sm active:scale-[0.98] transition-transform" onclick="openSubscriptionManagement()">
<div class="flex items-center space-x-4">
<div class="text-[#4C7DFF] bg-[#4C7DFF]/10 p-3.5 rounded-2xl">
<svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[17px] font-semibold text-slate-800 dark:text-slate-100">Abonelik Yönetimi</span>
</div>
<svg class="h-6 w-6 text-slate-300 dark:text-slate-600" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Aboneliği İptal Et (yalnızca aktif abonelikte görünür) -->
<button class="hidden w-full flex items-center justify-between bg-white dark:bg-slate-900 p-5 rounded-3xl shadow-sm active:scale-[0.98] transition-transform" id="cancel-sub-btn" onclick="openCancelConfirm()">
<div class="flex items-center space-x-4">
<div class="text-red-500 bg-red-500/10 p-3.5 rounded-2xl">
<svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[17px] font-semibold text-red-500">Dönem sonunda iptal et</span>
</div>
<svg class="h-6 w-6 text-slate-300 dark:text-slate-600" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
<!-- END: NavigationList -->

<!-- BEGIN: InfoFooter -->
<footer class="pt-6" data-purpose="payment-notice">
<div class="bg-white dark:bg-slate-900 rounded-3xl py-4 px-4 text-center shadow-sm border-2 border-[#4C7DFF]/20">
<p class="text-[#4C7DFF] font-medium text-[15px]">
    Sonraki ödeme <span class="font-bold" id="sub-price">₺0,00</span> tutarında <span class="font-bold" id="sub-date-footer">-</span> tarihinde alınacak.
</p>
</div>
</footer>
<!-- END: InfoFooter -->
<a class="mt-4 w-full flex items-center justify-between bg-white dark:bg-slate-900 p-5 rounded-3xl shadow-sm active:scale-[0.98] transition-transform" data-purpose="payment-history" href="nexus-orders.html">
<div class="flex items-center space-x-4">
<div class="text-emerald-600 bg-emerald-500/10 p-3.5 rounded-2xl">
<svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"></path><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><path d="M12 17.5v-11"></path></svg>
</div>
<span class="text-[17px] font-semibold text-slate-800 dark:text-slate-100">Ödeme geçmişi (Siparişlerim)</span>
</div>
<svg class="h-6 w-6 text-slate-300 dark:text-slate-600" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- BEGIN: Cancel Confirmation Sheet -->
<div class="hidden fixed inset-0 bg-black/60 z-50 flex items-end" id="cancel-sheet" onclick="closeCancelConfirm()">
<div class="bg-white dark:bg-slate-900 w-full rounded-t-3xl p-6 pb-10" onclick="event.stopPropagation()">
<div class="w-10 h-1 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-5"></div>
<h2 class="font-bold text-lg mb-1 text-slate-900 dark:text-white">Dönem sonunda iptal et</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm mb-5" id="cancel-note">İptal bu hesapta yapılır. Mevcut dönemin sonuna kadar NEXUS+ kullanmaya devam edersin; bir sonraki ödeme alınmaz.</p>
<button class="w-full bg-red-500 text-white font-bold py-3.5 rounded-xl active:scale-[0.98] transition-transform mb-2" onclick="cancelSubscription()">Dönem sonunda iptal et</button>
<button class="w-full py-3 font-semibold text-slate-500 dark:text-slate-400" onclick="closeCancelConfirm()">Vazgeç</button>
</div>
</div>
<!-- END: Cancel Confirmation Sheet -->
</main>

<script>
  // Abonelik Yönetimi: Whop portalı AÇILMAZ — iptal ve durum zaten whop-account
  // Edge Function'ıyla uygulama içinde yapılıyor (billingAccount('cancel'/'status')).
  // Kayıt VARSA uygulama içi yönetim diyaloğu: taze durum + dönem sonunda iptal.
  // Kayıt YOKSA yönlendirme yapmadan uyarır.
  function openSubscriptionManagement() {
    const plan = nexusGetItem("nexusPlusPlan");
    if (plan !== "Yıllık" && plan !== "Aylık") {
      window.nexusDialog({
        icon: 'info',
        title: nexusT('Aktif abonelik yok', 'No active subscription'),
        message: nexusT('Bu hesapta yönetilecek bir abonelik bulunamadı. NEXUS+ planına katılmak istersen Plus sayfasını kullanabilirsin.', 'There is no subscription to manage on this account. If you want to join NEXUS+, you can do it from the Plus page.'),
        primary: {
          label: nexusT('Tamam', 'OK'),
          onClick: function () { /* yalnızca kapat — yönlendirme yok */ }
        }
      });
      return;
    }
    // Diyaloğu yerel kayıtla anında aç; sunucudan taze durum arka planda gelir.
    if (window.nexusCloud && window.nexusCloud.billingAccount) {
      window.nexusCloud.billingAccount("status").then(function () {
        renderBilling();
      }).catch(function () { /* çevrimdışı: yerel kayıt yeterli */ });
    }
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    const endIso = nexusGetItem("nexusPlusEnd");
    const endDate = endIso ? new Date(endIso) : null;
    const hasEnd = endDate && !isNaN(endDate.getTime());
    const dateStr = hasEnd ? endDate.toLocaleDateString((window.nexusLocale || 'tr-TR'), options) : "-";
    const cancelling = nexusGetItem("nexusPlusCancel") === "1";
    if (cancelling) {
      window.nexusDialog({
        icon: 'info',
        title: 'NEXUS+ ' + plan,
        message: hasEnd
          ? (window.nexusT ? nexusT('Aboneliğin dönem sonunda ({0}) sonlanacak. O tarihe kadar NEXUS+ kullanmaya devam edebilirsin.', 'Your subscription ends on {0}. You can keep using NEXUS+ until then.') : 'Aboneliğin dönem sonunda ({0}) sonlanacak. O tarihe kadar NEXUS+ kullanmaya devam edebilirsin.').replace('{0}', dateStr)
          : (window.nexusT ? nexusT('Aboneliğin dönem sonunda sonlanacak; NEXUS+ kullanmaya devam edebilirsin.', 'Your subscription ends at the close of the current period; you can keep using NEXUS+ until then.') : 'Aboneliğin dönem sonunda sonlanacak; NEXUS+ kullanmaya devam edebilirsin.'),
        primary: { label: window.nexusT ? nexusT('Tamam', 'OK') : 'Tamam', onClick: function () {} }
      });
      return;
    }
    window.nexusDialog({
      icon: 'info',
      title: 'NEXUS+ ' + plan,
      message: hasEnd
        ? (window.nexusT ? nexusT('Sonraki yenileme: {0}. İptal edersen bu dönemin sonuna kadar kullanmaya devam edersin; sonraki ödeme alınmaz.', 'Next renewal: {0}. If you cancel, you keep access until the end of this period; no further payment is taken.') : 'Sonraki yenileme: {0}. İptal edersen bu dönemin sonuna kadar kullanmaya devam edersin; sonraki ödeme alınmaz.').replace('{0}', dateStr)
        : (window.nexusT ? nexusT('Aboneliğin aktif. İptal edersen dönemin sonuna kadar kullanmaya devam edersin; sonraki ödeme alınmaz.', 'Your subscription is active. If you cancel, you keep access until the end of the period; no further payment is taken.') : 'Aboneliğin aktif. İptal edersen dönemin sonuna kadar kullanmaya devam edersin; sonraki ödeme alınmaz.'),
      primary: {
        label: nexusT('Dönem sonunda iptal et', 'Cancel at period end'),
        onClick: function () { openCancelConfirm(); }
      },
      secondary: { label: nexusT('Kapat', 'Close'), onClick: function () {} }
    });
  }

  // Dinamik Abonelik Yönetimi (gerçek veri: nexusPlusPlan + nexusPlusSince)
  function renderBilling() {
    const plan = nexusGetItem("nexusPlusPlan"); // 'Yıllık' veya 'Aylık' (sunucudan: Whop webhook'u)
    const title = document.getElementById("sub-title");
    const renewal = document.getElementById("sub-renewal");
    const price = document.getElementById("sub-price");
    const dateFooter = document.getElementById("sub-date-footer");
    const since = document.getElementById("sub-since");
    const options = { year: 'numeric', month: 'long', day: 'numeric' };

    // Gerçek satın Çalışma tarihi (nexus-plus.html yazar); kayıt yoksa satır gizli kalır
    const sinceIso = nexusGetItem("nexusPlusSince");
    const sinceDate = sinceIso ? new Date(sinceIso) : null;
    if (plan && sinceDate && !isNaN(sinceDate.getTime())) {
      var sinceStr = sinceDate.toLocaleDateString((window.nexusLocale || 'tr-TR'), options);
      since.textContent = (window.nexusT ? nexusT("{0} tarihinden beri aktif", "Active since {0}") : "{0} tarihinden beri aktif").replace("{0}", sinceStr);
      since.classList.remove("hidden");
    }

    // Dönem sonu sunucudan gelir (Whop); yoksa plana göre tahmin edilmez, tarih gösterilmez.
    const endIso = nexusGetItem("nexusPlusEnd");
    const endDate = endIso ? new Date(endIso) : null;
    const hasEnd = endDate && !isNaN(endDate.getTime());
    const dateStr = hasEnd ? endDate.toLocaleDateString((window.nexusLocale || 'tr-TR'), options) : "-";
    const cancelling = nexusGetItem("nexusPlusCancel") === "1";

    if (plan === "Yıllık" || plan === "Aylık") {
      title.textContent = "NEXUS+ " + plan;
      const cur = nexusGetItem("nexusPlusCurrency") || "TRY";
      const pm = (window.nexusCloud && window.nexusCloud.prices) ? window.nexusCloud.prices(cur) : null;
      price.textContent = pm ? pm[plan] : (plan === "Yıllık" ? "₺3.999,99" : "₺499,99");
      renewal.textContent = cancelling
        ? (hasEnd ? "İptal edildi — " + dateStr + " tarihine kadar geçerli" : "İptal edildi — dönem sonuna kadar geçerli")
        : (hasEnd ? "Sonraki Yenileme: " + dateStr : "Aboneliğin aktif");
      dateFooter.textContent = dateStr;
      document.querySelector('[data-purpose="payment-notice"]').style.display = (cancelling || !hasEnd) ? 'none' : '';
    } else {
      // Aktif abonelik yoksa
      title.textContent = "NEXUS+";
      price.textContent = "₺0,00";
      renewal.textContent = "Aboneliğin yok. NEXUS+ için Plus sayfasından ücretsiz deneyebilirsin.";
      dateFooter.textContent = "-";
      document.querySelector('[data-purpose="payment-notice"]').style.display = 'none';
    }

    // Yönetim butonu yalnızca aktif abonelikte ve henüz iptal edilmemişse görünür
    document.getElementById("cancel-sub-btn").classList.toggle("hidden", !plan || cancelling);
  }

  // Ödeme geçmişi artık Siparişlerim sayfasında (nexus-orders.html).
  document.addEventListener("DOMContentLoaded", () => {
    renderBilling();
    if (window.nexusCloud && window.nexusCloud.billingAccount) {
      window.nexusCloud.billingAccount("status").then(function () {
        renderBilling();
      }).catch(function () {
        if (window.nexusCloud.pullEntitlement) window.nexusCloud.pullEntitlement().then(renderBilling).catch(function () {});
      });
    } else if (window.nexusCloud && window.nexusCloud.enabled()) {
      window.nexusCloud.pullEntitlement().then(renderBilling).catch(function () {});
    }
  });

  function openCancelConfirm() {
    document.getElementById("cancel-sheet").classList.remove("hidden");
  }
  function closeCancelConfirm() {
    document.getElementById("cancel-sheet").classList.add("hidden");
  }
  function cancelSubscription() {
    closeCancelConfirm();
    if (!window.nexusCloud || !window.nexusCloud.billingAccount) {
      document.getElementById("sub-renewal").textContent = "İptal için önce hesabınla giriş yapmalısın.";
      return;
    }
    window.nexusCloud.billingAccount("cancel").then(function () {
      renderBilling();
    }).catch(function () {
      document.getElementById("sub-renewal").textContent = "İptal şu an tamamlanamadı. Biraz sonra yeniden dene.";
    });
  }
</script>
</body>
</html>
