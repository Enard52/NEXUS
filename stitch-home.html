<script>
            lucide.createIcons();

    function syncCards() {
      var selectedSmartHome = null;
      try {
        selectedSmartHome = JSON.parse(nexusGetItem('nexusSelectedSmartHomeCards') || 'null');
      } catch(e) {}
      var selectedIds = Array.isArray(selectedSmartHome) ? selectedSmartHome : ['weather', 'energy', 'dnd'];

      ['weather', 'dnd', 'energy'].forEach(function(id) {
        var el = document.getElementById('card-' + id);
        if (el) {
          el.style.display = selectedIds.indexOf(id) !== -1 ? 'flex' : 'none';
        }
      });

      // Harita sayfasında kaydedilen hava durumu konumuyla senkron.
      // Öncelik: kayıtlı koordinatlar (nexusWeatherCoords) — sokak/mahalle adları
      // şehir geokodlamasında bulunamayabilir; koordinat her zaman çalışır.
      var loc = nexusGetItem('nexusWeatherLocation');
      var weatherEl = document.getElementById('weather-location');
      function describeWeather(code) {
        var desc = 'Açık';
        if (code >= 1 && code <= 3) desc = 'Bulutlu';
        if (code >= 45 && code <= 48) desc = 'Sisli';
        if (code >= 51 && code <= 67) desc = 'Yağmurlu';
        if (code >= 71 && code <= 77) desc = 'Karlı';
        if (code >= 80 && code <= 82) desc = 'Sağanak Yağışlı';
        if (code >= 95) desc = 'Fırtınalı';
        return desc;
      }
      function showForecast(lat, lon) {
        return fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current_weather=true')
          .then(function(res2) { return res2.json(); })
          .then(function(data2) {
            if (data2.current_weather) {
              var tF = (typeof nexusGetItem === 'function' && nexusGetItem('nexusTempUnit') === 'F');
              var temp = Math.round(tF ? data2.current_weather.temperature * 9 / 5 + 32 : data2.current_weather.temperature);
              var desc = describeWeather(data2.current_weather.weathercode);
              // Seçilen konumun adını da göster (kısaltılmış)
              var shortLoc = (loc || '').split(',')[0].trim();
              weatherEl.textContent = temp + (tF ? '°F ' : '°C ') + desc + (shortLoc ? ' · ' + shortLoc : '');
            } else {
              weatherEl.textContent = 'Veri alınamadı';
            }
          });
      }
      if (loc && weatherEl) {
        weatherEl.textContent = "Yükleniyor...";
        var coords = null;
        try { coords = JSON.parse(nexusGetItem('nexusWeatherCoords') || 'null'); } catch(e) {}
        if (coords && isFinite(coords.lat) && isFinite(coords.lon)) {
          showForecast(coords.lat, coords.lon)
            .catch(function(err) { weatherEl.textContent = "Bağlantı Hatası"; });
        } else {
          fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(loc) + '&count=1&language=tr&format=json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (data.results && data.results.length > 0) {
                return showForecast(data.results[0].latitude, data.results[0].longitude);
              }
              weatherEl.textContent = "Konum Bulunamadı";
            })
            .catch(function(err) {
              weatherEl.textContent = "Bağlantı Hatası";
            });
        }
      }

      // Enerji kartı: gerçek durum. Tüketim sayacı entegrasyonu olmadığı için
      // uydurma kWh değeri GÖSTERİLMEZ. Bunun yerine etkin tasarruf
      // stratejisi sayısı (nexusEnergyEnabledMap) gösterilir; yoksa dürüst boş durum.
      var energyEl = document.getElementById('energy-today');
      if (energyEl) {
        var enabledMap = {};
        try { enabledMap = JSON.parse(nexusGetItem('nexusEnergyEnabledMap') || '{}'); } catch(e) { enabledMap = {}; }
        var activeCount = 0;
        if (enabledMap && typeof enabledMap === 'object') {
          Object.keys(enabledMap).forEach(function(k) { if (enabledMap[k]) activeCount++; });
        }
        if (activeCount > 0) {
          energyEl.textContent = activeCount + ' strateji etkin';
        } else {
          energyEl.textContent = 'Strateji yok';
        }
      }

      // Rahatsız Etme (DND) Senkronizasyonu
      var dndEl = document.getElementById('dnd-state');
      function renderDndCard() {
        if (!dndEl) return;
        var state = nexusGetItem('nexusDndState');
        var scheduleRaw = nexusGetItem('nexusDndSchedule');
        var endTime = parseInt(nexusGetItem('nexusDndEndTime') || '0', 10);
        var displayText = 'Kapalı';
        var isActive = false;

        if (state && state !== 'Kapalı') {
          if (endTime) {
            var remainMs = endTime - Date.now();
            if (remainMs <= 0) {
              // Süre doldu: durumu gerçekten kapat
              nexusSetItem('nexusDndState', 'Kapalı');
              nexusRemoveItem('nexusDndEndTime');
            } else {
              // Kalan süre geri sayımı: "3 saatlik" yerine örn. 23:45 kaldı
              var totalMin = Math.ceil(remainMs / 60000);
              var h = Math.floor(totalMin / 60);
              var m = totalMin % 60;
              displayText = h + ':' + String(m).padStart(2, '0') + ' kaldı';
              isActive = true;
            }
          } else {
            // Eski kayıt (bitiş zamanı yok): etiketi olduğu gibi göster
            displayText = state;
            isActive = true;
          }
        }

        if (!isActive && scheduleRaw) {
          try {
            var s = JSON.parse(scheduleRaw);
            if (s.start && s.end) {
              displayText = s.start + ' - ' + s.end + ' Planlı';
              isActive = true;
            }
          } catch(e){}
        }

        dndEl.textContent = displayText;
        if (isActive) {
          dndEl.classList.remove('text-slate-400');
          dndEl.classList.add('text-[#FF3B5C]', 'font-semibold');
        } else {
          dndEl.classList.remove('text-[#FF3B5C]', 'font-semibold');
          dndEl.classList.add('text-slate-400');
        }
      }
      renderDndCard();
      // Geri sayımı güncel tut (dakika hassasiyeti yeterli)
      setInterval(renderDndCard, 30000);

      // Gerçek hane adıyla senkron (nexusHousehold)
      var householdName = typeof window.getPrimaryHouseholdName === 'function'
        ? window.getPrimaryHouseholdName()
        : (nexusGetItem('nexusHouseholdName') || 'Evim');
      document.querySelectorAll('[data-bind="householdName"]').forEach(function (el) { el.textContent = householdName; });

      // Kullanıcı Bilgileri sayfasında değiştirilen fotoğrafla senkron
      var avatar = nexusGetItem('nexusAvatar');
      if (avatar) {
        var avatarEl = document.getElementById('home-avatar');
        if (avatarEl) avatarEl.src = avatar;
      }

      // Extra smart home kartları ve tap-to-run bölümünü doldur
      if (typeof window.renderExtraSmartHomeCards === 'function') window.renderExtraSmartHomeCards();
      if (typeof window.renderTapToRunCards === 'function') window.renderTapToRunCards();
      if (typeof window.renderDevices === 'function') window.renderDevices();
      if (typeof window.renderNexusDevices === 'function') {
        window.renderNexusDevices();
      }
    }

    // Call on load
    syncCards();

    // Favoriler collapse durumunu restore et
    (function() {
      var grid = document.getElementById('favorites-grid');
      var toggleBtn = document.getElementById('favorites-toggle-btn');
      if (grid && nexusGetItem('nexusFavoritesCollapsed') === 'true') {
        grid.classList.add('hidden');
        if (toggleBtn) toggleBtn.classList.add('-rotate-90');
      }
    })();

    // Call when page is restored from bfcache
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        syncCards();
      }
    });

    // Also call on visibilitychange just to be absolutely sure for mobile web views
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        syncCards();
      }
    });

    // renderNexusDevices alias — data.js'teki renderDevices ile aynı
    if (typeof window.renderDevices === 'function' && typeof window.renderNexusDevices === 'undefined') {
      window.renderNexusDevices = window.renderDevices;
    }

    // Quick add menu open/close
    function toggleQuickAdd() {
      document.getElementById('quick-add-menu').classList.toggle('open');
      document.getElementById('quick-add-backdrop').classList.toggle('hidden');
    }
  </script>

<!-- Home Selector Modal -->
<div id="home-selector-backdrop" class="fixed inset-0 z-[60] bg-slate-900/40 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none" onclick="toggleHomeSelector()"></div>
<div id="home-selector-modal" class="fixed inset-x-0 top-0 z-[70] bg-white rounded-b-[2rem] shadow-2xl border-b border-slate-100 flex flex-col transform transition-transform duration-300 -translate-y-full">
  <div class="px-5 pt-12 pb-4 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center">
    <div id="home-selector-handle" class="absolute left-1/2 top-3 h-1.5 w-14 -translate-x-1/2 rounded-full bg-slate-200"></div>

    <button onclick="toggleHomeSelector()" class="p-2 -mr-2 text-slate-400 hover:text-slate-600 rounded-full">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </div>
  <div class="p-4 flex flex-col gap-2">
    <!-- Active Home -->
    <button onclick="toggleHomeSelector()" class="flex items-center gap-3 p-4 rounded-2xl bg-[#4C7DFF]/10 text-[#4C7DFF] text-left w-full transition-transform active:scale-[0.98]">
      <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="font-bold text-base flex-grow" data-bind="householdName">Evim</span>
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
    </button>
  </div>
  <div class="p-4 pt-2 border-t border-slate-100 bg-slate-50 rounded-b-[2rem]">
    <a href="stitch-household.html" class="flex items-center justify-center gap-2 w-full py-3.5 rounded-xl bg-white text-slate-700 font-bold text-sm transition-transform active:scale-[0.98] border border-slate-200 shadow-sm">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      Ev Yönetimi
    </a>
  </div>
</div>

<script>
function toggleHomeSelector() {
  const modal = document.getElementById('home-selector-modal');
  const backdrop = document.getElementById('home-selector-backdrop');

  // If it's currently hidden (-translate-y-full)
  if (modal.classList.contains('-translate-y-full')) {
    // Show it
    modal.classList.remove('-translate-y-full');
    modal.classList.add('translate-y-0');

    backdrop.classList.remove('opacity-0', 'pointer-events-none');
    backdrop.classList.add('opacity-100', 'pointer-events-auto');
  } else {
    // Hide it
    modal.classList.remove('translate-y-0');
    modal.classList.add('-translate-y-full');

    backdrop.classList.remove('opacity-100', 'pointer-events-auto');
    backdrop.classList.add('opacity-0', 'pointer-events-none');
  }
}

if (window.NexusSheetGestures) {
  window.NexusSheetGestures.bindBottomSheet({
    sheetId: 'quick-add-menu',
    handleId: 'quick-add-handle',
    backdropId: 'quick-add-backdrop',
    isOpen: function () { return document.getElementById('quick-add-menu').classList.contains('open'); },
    close: toggleQuickAdd
  });

  window.NexusSheetGestures.bindTopSheet({
    sheetId: 'home-selector-modal',
    handleId: 'home-selector-handle',
    backdropId: 'home-selector-backdrop',
    isOpen: function () { return document.getElementById('home-selector-modal').classList.contains('translate-y-0'); },
    close: toggleHomeSelector
  });
}
</script>
