<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>NEXUS ” Cihaz Eşleştirme</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(to bottom, #ECE9FD 0%, #F5F3FF 40%, #ffffff 100%);
      min-height: 100dvh;
    }
    
    /* Subtle pulsing for the radar rings */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(0.95); opacity: 0.6; }
    }
    .radar-ring {
      animation: pulse-ring 3s ease-in-out infinite;
    }
    
    /* Rotating radar sweep */
    @keyframes sweep-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .radar-sweep {
      background: conic-gradient(from 0deg, transparent, rgba(124, 92, 255, 0.28) 40%, transparent 41%);
      animation: sweep-spin 3s linear infinite;
    }
  </style>
<script src="theme.js"></script>
<script src="data.js"></script>
<script src="ai-fab.js"></script>
</head>
<body class="text-slate-900 flex flex-col">
  <!-- Header -->
  <header class="pt-14 pb-4 px-5 flex items-center justify-between relative" data-purpose="page-header">
    <a aria-label="Geri" class="p-1 -ml-1" href="javascript:void(0)" onclick="window.history.length > 1 ? history.back() : window.location.href='stitch-home.html'">
      <i class="w-7 h-7 text-slate-700" data-lucide="chevron-left"></i>
    </a>
    <h1 class="whitespace-nowrap text-lg font-bold absolute left-1/2 -translate-x-1/2">Cihaz Aranıyor</h1>
    <!-- Alternatif eşleştirme: QR tarama akışı -->
    <a aria-label="QR ile tara" class="p-1 text-[#7C5CFF]" href="stitch-scan.html">
      <i class="w-6 h-6" data-lucide="scan-line"></i>
    </a>
  </header>

  <main class="flex-grow flex flex-col items-center pt-10">
    <!-- Scanning Area -->
    <section class="flex flex-col items-center justify-center w-full max-w-sm px-6">
      
      <!-- Radar -->
      <div class="relative w-72 h-72 flex items-center justify-center mb-8">
        <div class="absolute inset-0 rounded-full bg-white/30 border border-white/60 radar-ring"></div>
        <div class="absolute inset-4 rounded-full bg-white/40 border border-white/60 radar-ring" style="animation-delay: 0.5s;"></div>
        <div class="absolute inset-8 rounded-full bg-white/50 border border-white/60 radar-ring" style="animation-delay: 1s;"></div>
        <div class="absolute inset-12 rounded-full bg-white/60 border border-white/70 radar-ring" style="animation-delay: 1.5s;"></div>
        <div class="absolute inset-0 rounded-full radar-sweep" id="radar-sweep"></div>
        
        <!-- NEXUS N Logo -->
        <div class="z-10 flex flex-col items-center">
          <svg class="w-14 h-14 mb-1" fill="none" viewBox="0 0 100 100">
            <defs>
              <linearGradient id="n-grad" x1="0" x2="100" y1="0" y2="100" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6f9bff"></stop>
                <stop offset="0.55" stop-color="#5b8dff"></stop>
                <stop offset="1" stop-color="#8b7bff"></stop>
              </linearGradient>
            </defs>
            <path d="M25 80 V20 L75 80 V20" stroke="url(#n-grad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
          </svg>
          <span class="text-slate-900 text-2xl font-extrabold tracking-wider">NEXUS</span>
        </div>
      </div>
      
      <!-- Status Text -->
      <h2 class="text-slate-700 text-xl font-medium text-center" id="scan-status">Cihaz aranıyor...</h2>
      <p class="text-sm text-slate-500 mt-2 font-medium text-center" id="device-name-display"></p>

      <!-- Not found state (hidden initially) -->
      <div id="not-found-state" class="hidden flex flex-col items-center justify-center text-center mt-12 bg-white p-6 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] border border-white/50 w-full">
        <div class="w-16 h-16 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center mb-4">
          <i class="w-8 h-8" data-lucide="alert-triangle"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-800 mb-1">Cihaz Bulunamadı</h3>
        <p class="text-sm text-slate-500 mb-6">Yakınınızda eşleştirilmeye hazır bir cihaz bulunamadı. Cihazın açık ve eşleştirme modunda olduğundan emin olun.</p>
        
        <button class="bg-[#7C5CFF] text-white w-full py-3.5 rounded-2xl text-sm font-bold shadow-md active:scale-95 transition-transform" onclick="startScan()">
          Tekrar Dene
        </button>
        <!-- Kurulum kodu: ayrı sayfaya gitmez, kod yazma modülünü (modal) açar -->
        <button type="button" class="flex items-center justify-center gap-2 text-sm font-medium text-slate-400 mt-4 w-full" data-purpose="setup-code-trigger" onclick="openCodeModal()">
          <i class="w-4 h-4" data-lucide="keyboard"></i>Kurulum koduyla ekle
        </button>
      </div>

    </section>
  </main>

  <!-- BEGIN: CodeModal (kod yazma modülü) -->
  <div id="code-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[90] hidden flex flex-col items-center justify-center px-6">
    <div class="bg-white rounded-[2rem] w-full max-w-sm p-6 shadow-2xl relative overflow-hidden transform scale-95 transition-transform" id="code-modal-content">
      <div class="text-center mb-6 mt-2">
        <div class="w-16 h-16 bg-slate-50 text-[#7C5CFF] rounded-full mx-auto flex items-center justify-center mb-4">
          <i class="w-8 h-8" data-lucide="hash"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">Kurulum Kodu</h2>
        <p class="text-sm text-slate-500 mt-2">Cihazınızın üzerindeki 8 haneli kodu girin.</p>
      </div>
      <input type="text" id="setup-code-input" class="w-full text-center text-3xl tracking-[0.2em] font-bold text-slate-800 border-none bg-slate-50 rounded-2xl py-4 focus:ring-2 focus:ring-[#7C5CFF]" placeholder="00000000" maxlength="11" autocomplete="off" />
      <p class="hidden text-sm text-red-500 mt-2 text-center" id="setup-code-error">Kod 8-11 haneli olmalı. Lütfen kontrol edin.</p>
      <div class="flex gap-3 mt-4">
        <button class="flex-1 py-3.5 rounded-2xl font-bold text-slate-600 bg-slate-100 active:bg-slate-200 transition-colors" onclick="closeCodeModal()">İptal</button>
        <button class="flex-1 py-3.5 rounded-2xl font-bold text-white bg-[#7C5CFF] active:bg-[#6b4ae8] transition-colors shadow-md shadow-[#7C5CFF]/30" onclick="confirmSetupCode()">Bağlan</button>
      </div>
    </div>
  </div>
  <!-- END: CodeModal -->

  <script>
    lucide.createIcons();

    /* ---------- Kod yazma modülü (kurulum kodu modalı) ---------- */
    function openCodeModal() {
      var modal = document.getElementById('code-modal');
      var content = document.getElementById('code-modal-content');
      document.getElementById('setup-code-error').classList.add('hidden');
      modal.classList.remove('hidden');
      setTimeout(function () {
        content.classList.remove('scale-95');
        content.classList.add('scale-100');
        document.getElementById('setup-code-input').focus();
      }, 10);
    }
    function closeCodeModal() {
      var modal = document.getElementById('code-modal');
      var content = document.getElementById('code-modal-content');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
      setTimeout(function () {
        modal.classList.add('hidden');
        document.getElementById('setup-code-input').value = '';
      }, 200);
    }
    // Girilen kurulum kodunu doğrula ve cihazı gerçekten eşleştir (nexusPairedDevices)
    function confirmSetupCode() {
      var input = document.getElementById('setup-code-input');
      var err = document.getElementById('setup-code-error');
      var digits = (input.value || '').replace(/\D/g, '');
      if (digits.length < 8 || digits.length > 11) {
        err.classList.remove('hidden');
        return;
      }
      err.classList.add('hidden');
      var paired = [];
      try { paired = JSON.parse(localStorage.getItem('nexusPairedDevices') || '[]'); } catch (e) {}
      if (!Array.isArray(paired)) paired = [];
      var name = 'Cihaz ·' + digits.slice(-4);
      if (!paired.some(function (d) { return d && d.name === name; })) {
        paired.push({ name: name, icon: 'cpu' });
        localStorage.setItem('nexusPairedDevices', JSON.stringify(paired));
      }
      input.value = '';
      closeCodeModal();
      setTimeout(function () { window.location.href = 'stitch-home.html'; }, 250);
    }

    // URL'den cihaz adını ve resmini al
    function getDeviceNameFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('device') ? decodeURIComponent(urlParams.get('device')) : '';
    }
    
    function getDeviceImgFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('img') ? decodeURIComponent(urlParams.get('img')) : '';
    }

    function startScan() {
      var scanStatus = document.getElementById('scan-status');
      var deviceDisplay = document.getElementById('device-name-display');
      var radarSweep = document.getElementById('radar-sweep');
      var notFoundState = document.getElementById('not-found-state');
      
      const deviceName = getDeviceNameFromUrl();
      const deviceImg = getDeviceImgFromUrl();
      
      if(deviceName) {
        scanStatus.textContent = deviceName + ' aranıyor...';
        deviceDisplay.textContent = 'Lütfen cihazınızı cihaza yaklaştırın.';
      } else {
        scanStatus.textContent = 'Cihaz aranıyor...';
        deviceDisplay.textContent = 'Otomatik eşleştirme için yakındaki cihazlar taranıyor.';
      }
      
      scanStatus.className = 'text-slate-700 text-xl font-bold text-center';
      radarSweep.style.display = 'block';
      notFoundState.classList.add('hidden');

      // 3 Saniye sonra tarama biter
      setTimeout(function () {
        if (deviceName) {
          // Başarılı Bulma (URL'den gelen gerçek cihaz adıyla eşleştirme)
          scanStatus.textContent = deviceName + ' Bulundu!';
          deviceDisplay.textContent = 'Eşleştiriliyor ve anasayfaya ekleniyor...';
          scanStatus.className = 'text-[#7C5CFF] text-xl font-bold text-center';
          radarSweep.style.display = 'none';

          // Yeni cihazı localStorage'a kaydet
          setTimeout(function() {
            var currentCards = [];
            try { currentCards = JSON.parse(localStorage.getItem('nexusDashboardCards')); } catch(e){}
            if (!currentCards || !Array.isArray(currentCards)) currentCards = [];

            let iconHtml = '<svg class="mb-2 w-8 h-8 text-[#7C5CFF]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
            if(deviceImg) {
               iconHtml = `<img src="${deviceImg}" class="mb-2 w-12 h-12 object-cover rounded-xl shadow-sm border border-slate-100" />`;
            }
            
            const newDevice = {
              id: 'dev-' + Date.now(),
              title: deviceName,
              url: '#',
              iconSvg: iconHtml,
              valId: 'val-' + Date.now(),
              valDefault: 'Bağlı',
              size: 1,
              visible: true,
              wattage: 0 // Gerçek ölçüm donanımı yok; tüketim 0'dan başlar
            };
            
            currentCards.push(newDevice);
            localStorage.setItem('nexusDashboardCards', JSON.stringify(currentCards));

            // Gerçek olay akışına kaydet (bildirim + günlük)
            try {
              var evs = JSON.parse(localStorage.getItem('nexusEvents') || '[]');
              if (!Array.isArray(evs)) evs = [];
              evs.push({ id: 'e' + Date.now(), type: 'device', title: 'Cihaz eşleştirildi', detail: deviceName + ' anasayfaya eklendi.', ts: Date.now() });
              localStorage.setItem('nexusEvents', JSON.stringify(evs));
            } catch(e){}
            
            // Anasayfaya yönlendir
            window.location.href = 'stitch-home.html';
          }, 1500);

        } else {
          // URL'de cihaz yoksa sahte cihaz üretilmez: dürüst "bulunamadı" durumu
          scanStatus.textContent = 'Cihaz Bulunamadı';
          scanStatus.className = 'text-slate-700 text-xl font-bold text-center';
          deviceDisplay.textContent = '';
          radarSweep.style.display = 'none';
          notFoundState.classList.remove('hidden');
          lucide.createIcons();
        }
      }, 3000);
    }

    window.onload = function() {
      startScan();
    };
  </script>
</body>
</html>
