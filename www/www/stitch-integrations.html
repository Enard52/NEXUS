    // Arka planı beyaz olan resimleri şeffaf yapan akıllı fonksiyon
    function makeImagesTransparent() {
      const images = document.querySelectorAll('.product-tile img');
      images.forEach(img => {
        if (img.complete) {
          processImage(img);
        } else {
          img.addEventListener('load', () => processImage(img), { once: true });
        }
      });
    }

    function processImage(img) {
      if (img.dataset.processed) return;
      img.dataset.processed = 'true';

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = img.naturalWidth || img.width;
      canvas.height = img.naturalHeight || img.height;

      if (canvas.width === 0 || canvas.height === 0) return;

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      try {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        // Beyaz ve beyaza çok yakın renkleri şeffaf yap
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          if (r > 240 && g > 240 && b > 240) {
            data[i + 3] = 0; // Alpha kanalını 0 yap (tam şeffaf)
          } else if (r > 230 && g > 230 && b > 230) {
            // Yumuşak geçiş için yarı şeffaf (Anti-aliasing kenarları)
            data[i + 3] = 100;
          }
        }

        ctx.putImageData(imageData, 0, 0);
        img.src = canvas.toDataURL('image/png');
      } catch (e) {
        console.warn('CORS or canvas error on image:', e);
      }
    }

    // Katalog render edildikten sonra çalıştır
    const originalRenderCatalogContent = renderCatalogContent;
    renderCatalogContent = function() {
      originalRenderCatalogContent();
      setTimeout(makeImagesTransparent, 100);
    };

    // Sayfa yüklendiğinde mevcut resimler için de çalıştır
    window.addEventListener('load', () => {
      setTimeout(makeImagesTransparent, 200);
    });

  </script>

    function escapeCatalogHtml(value) {
      return repairCatalogText(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function repairCatalogText(value) {
      return String(value || '')
        .replace(/İ/g, 'İ').replace(/ı/g, 'ı').replace(/ğ/g, 'ğ').replace(/Ğ/g, 'Ğ')
        .replace(/ü/g, 'ü').replace(/Ü/g, 'Ü').replace(/ş/g, 'ş').replace(/Å/g, 'Ş')
        .replace(/ö/g, 'ö').replace(/Ö/g, 'Ö').replace(/ç/g, 'ç').replace(/Ç/g, 'Ç')
        .replace(/â€™/g, "'").replace(/â€“/g, '-');
    }

    function normalizeCatalogText(value) {
      return repairCatalogText(value)
        .toLowerCase()
        .replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ö/g, 'o').replace(/ç/g, 'c')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function catalogDisplayName(value) {
      var name = repairCatalogText(value)
        .replace(/\s*\((Bluetooth|ZigBee|Zigbee|Wi-Fi|BLE|BLE\+Wi-Fi|NB-IoT|Gateway|Ağ Geçidi|2\.4GHz&5GHz|2\.4GHz|4G|GPRS|LTE Cat\.1|Cat\.1)\)/gi, '')
        .replace(/\s+/g, ' ')
        .trim();
      var switchTypeMatch = name.match(/^(.*?Anahtar(?:ı)?)\s*\(([1-6])\s*Çıkışlı\)$/i);
      if (switchTypeMatch) {
        var counts = { '1': 'Tekli', '2': 'İkili', '3': 'Üçlü', '4': 'Dörtlü', '5': 'Beşli', '6': 'Altılı' };
        return counts[switchTypeMatch[2]] + ' ' + switchTypeMatch[1];
      }
      return name;
    }

    function pickCatalogImage(text, candidates) {
      var hash = 0;
      for (var i = 0; i < text.length; i += 1) hash = (hash + text.charCodeAt(i) * (i + 3)) % 9973;
      return candidates[hash % candidates.length];
    }

    function pickVariantCatalogImage(text, candidates) {
      var variants = ['bluetooth', 'zigbee', 'gateway', 'ag gecidi', 'nb-iot', 'ble+wi-fi', '2.4ghz', '4g'];
      for (var i = 0; i < variants.length; i += 1) {
        if (text.indexOf(variants[i]) !== -1) return candidates[(i + 1) % candidates.length];
      }
      return pickCatalogImage(text, candidates);

    function catalogTileHtml(item, groupTitle) {
      var safe = escapeCatalogHtml(item.n);
      var display = escapeCatalogHtml(catalogDisplayName(item.n));
      var safeGroup = escapeCatalogHtml(groupTitle || 'Genel');
      // item.img spesifik bir dosya adı içeriyorsa onu kullan, aksi halde inferCatalogImage ile belirle
      var _genericImgs = ['smart_plug.jpg','switch.jpg','camera.jpg','bridge.png','smart_hub.jpg','smart_bulb.jpg','smart_speaker.jpg','smart_tv.jpg','smart_appliance.jpg'];
      var image = (item.img && _genericImgs.indexOf(item.img) === -1 && /\.(png|jpg|webp)$/i.test(item.img))
        ? item.img
        : inferCatalogImage(item, groupTitle);
      var imageVersion = '20260801-products-4';
      return '<button type="button" class="product-tile product-card text-left active:scale-[0.98] transition-transform cursor-pointer group" onclick="simulateConnection(this, \'' + safe + '\')">' +
        '<div class="product-image-stage">' +
        '<img src="assets/products/' + image + '?v=' + imageVersion + '" alt="' + safe + '" class="max-w-[84%] max-h-[62px] object-contain transition-transform duration-300 group-active:scale-95" loading="lazy" onerror="this.onerror=null;this.src=&quot;assets/products/generic-smart-hub.png?v=' + imageVersion + '&quot;;" />' +
        '</div>' +
        '<div class="px-1 pt-1 flex min-h-[30px] flex-col items-center justify-start">' +
        '<span class="product-name">' + display + '</span>' +
        '<span class="product-category-pill">' + safeGroup + '</span>' +
        '</div>' +
        '</button>';
    }

    function dedupeCatalogItems(items) {
      var seen = {};
      return (items || []).filter(function (item) {
        var key = normalizeCatalogText(catalogDisplayName(item.n || ''));
        if (!key) return false;
        if (seen[key]) return false;
        seen[key] = true;
        return true;
      });
    }

    function catalogGroupHtml(title, items) {
      var uniqueItems = dedupeCatalogItems(items);
      if (!uniqueItems.length) return '';
      return '<div class="mb-9">' +
        '<p class="catalog-group-title">' + escapeCatalogHtml(title) + '</p>' +
        '<div class="product-grid">' + uniqueItems.map(function (item) { return catalogTileHtml(item, title); }).join('') + '</div>' +
        '</div>';
    }

    function renderCatalogRail() {
      var rail = document.getElementById('catalog-rail');
      if (!rail) return;
      rail.innerHTML = CATALOG.map(function (c) {
        var cls = c.key === activeCatalogCategory ? 'cat-btn cat-active' : 'cat-btn cat-inactive';
        return '<button type="button" onclick="selectCatalogCategory(\'' + c.key + '\')" class="' + cls + ' w-full text-left py-3.5 px-3">' +
          '<span class="cat-text text-[13px] block">' + escapeCatalogHtml(c.label) + '</span></button>';
      }).join('');
    }

    function renderCatalogContent() {
      var content = document.getElementById('catalog-content');
      if (!content) return;
      var query = normalizeCatalogText(((document.getElementById('catalog-search') || {}).value || '').trim());

      if (query) {
        var matches = [];
        CATALOG.forEach(function (c) {
          c.groups.forEach(function (g) {
            g.items.forEach(function (it) {
              if (normalizeCatalogText(it.n).indexOf(query) !== -1) matches.push(it);
            });
          });
        });
        matches = dedupeCatalogItems(matches);
        content.innerHTML = matches.length
          ? catalogGroupHtml('Arama Sonuçları', matches)
          : '<div class="px-6 py-16 text-center"><p class="text-sm font-medium text-slate-500 dark:text-slate-300">Aramanla eşleşen cihazı bulunamadı.</p></div>';
        content.scrollTop = 0;
        return;
      }

      if (activeCatalogCategory === 'all') {
        content.innerHTML = CATALOG.map(function (c) {
          return '<section class="mb-10">' +
            '<h2 class="catalog-heading mb-4 text-lg font-black text-slate-900">' + escapeCatalogHtml(c.label) + '</h2>' +
            c.groups.map(function (g) { return catalogGroupHtml(g.title, g.items); }).join('') +
            '</section>';
        }).join('');
        content.scrollTop = 0;
        return;
      }

      var cat = CATALOG.filter(function (c) { return c.key === activeCatalogCategory; })[0] || CATALOG[0];
      content.innerHTML = cat.groups.map(function (g) { return catalogGroupHtml(g.title, g.items); }).join('');
      content.scrollTop = 0;
    }

    function selectCatalogCategory(key) {
      activeCatalogCategory = key;
      var searchEl = document.getElementById('catalog-search');
      if (searchEl) searchEl.value = '';
      renderCatalogRail();
      renderCatalogContent();
    }

    function openCodeModal() {
      window.location.href = 'stitch-setup-code.html';

    function closeCodeModal() {
      const modal = document.getElementById('code-modal');
      const content = document.getElementById('code-modal-content');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
        document.getElementById('setup-code-input').value = '';
      }, 200);
    }

    function submitCode() {
      const input = document.getElementById('setup-code-input').value;
      if (input.length < 4) {
        showIntegrationsToast('Lütfen geçerli bir kod girin.');
        return;
      }
      closeCodeModal();
      setTimeout(() => {
        window.location.href = 'stitch-setup-code.html';
      }, 150);
    }

    function simulateConnection(el, deviceName) {
      const overlay = document.getElementById('loading-overlay');
      overlay.style.display = 'flex';
      document.getElementById('loading-spinner').classList.remove('hidden');
      document.getElementById('loading-notfound').classList.add('hidden');
      document.getElementById('loading-notfound').classList.remove('flex');

      clearTimeout(simulateConnection._t);
      simulateConnection._t = setTimeout(() => {
        const paired = getPairedDevices();
        const safeName = (deviceName || 'Yeni cihazı').trim();
        if (!paired.some((device) => device && device.name === safeName)) {
          paired.push({ name: safeName, icon: 'cpu', room: 'Ana sayfaya bağlı' });
          nexusSetItem('nexusPairedDevices', JSON.stringify(paired));
        }
        navigateAfterPair();
      }, 900);
    }

    function hideOverlay() {
      clearTimeout(simulateConnection._t);
      document.getElementById('loading-overlay').style.display = 'none';
    }

    function getPairedDevices() {
      let devices = [];
      try { devices = JSON.parse(nexusGetItem('nexusPairedDevices') || '[]'); } catch (error) {}
      return Array.isArray(devices) ? devices : [];
    }

    function navigateAfterPair() {
      const target = 'stitch-home.html';
      if (window.top && window.top !== window) {
        window.top.location.href = target;
        return;
      }
      window.location.href = target;
    }

    var _catalogSearchEl = document.getElementById('catalog-search');
    if (_catalogSearchEl) {
      _catalogSearchEl.addEventListener('input', renderCatalogContent);
    }

    (function initManualCatalog() {
      var params = new URLSearchParams(window.location.search);
      var requested = params.get('category');
      var mapped = requested ? (CATALOG_ALIAS[requested] || requested) : null;
      var valid = CATALOG.some(function (c) { return c.key === mapped; });
      activeCatalogCategory = mapped === 'all' || valid ? mapped : CATALOG[0].key;
      renderCatalogRail();
      renderCatalogContent();
    })();
  </script>
<script>
function showIntegrationsToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;font-size:14px;font-weight:600;padding:10px 20px;border-radius:999px;z-index:9999;';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2500);
}
</script>
</body>
</html>
