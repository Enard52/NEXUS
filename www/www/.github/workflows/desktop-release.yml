name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            command: build:win
          - os: macos-latest
            platform: mac
            command: build:mac
          - os: ubuntu-latest
            platform: linux
            command: build:linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build static assets + server bundle
        run: pnpm build

      - name: Install desktop-app dependencies
        working-directory: desktop-app
        run: npm install

      - name: Build desktop installer (${{ matrix.platform }})
        working-directory: desktop-app
        env:
          # Code signing secrets (optional — unset = unsigned build).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_SUBJECT: ${{ secrets.WIN_CSC_SUBJECT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # electron-updater publish token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.command }}

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: desktop-app
        run: |
          mkdir -p dist/checksums
          find dist -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-desktop-${{ matrix.platform }}
          path: desktop-app/dist/*.{exe,dmg,AppImage,deb,sha256}
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-app/dist/*.exe
            desktop-app/dist/*.dmg
            desktop-app/dist/*.AppImage
            desktop-app/dist/*.deb
            desktop-app/dist/*.sha256
            desktop-app/dist/latest*.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
