  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .bg-comfort-gradient {
      background: linear-gradient(180deg, #ECE9FD 0%, #DDD8FB 100%);
    }
    .dark .bg-comfort-gradient {
      background: linear-gradient(180deg, #0F172A 0%, #020617 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .dark .glass-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);

    }

<body class="bg-comfort-gradient" data-scene-page="comfort-room" data-scene-title="Oda Konforu" data-back-href="stitch-home.html" data-complete-href="stitch-home.html">
  <div class="w-full h-screen flex flex-col" data-sd-id="1">
    <header class="shrink-0 pt-14 pb-4 px-5 flex items-center justify-between z-10" data-sd-id="2">
      <a href="#" id="nav-back-link" aria-label="Geri" class="p-1 -ml-1 text-slate-900 dark:text-white active:scale-95 transition-transform" data-sd-id="3" onclick="event.preventDefault(); if (history.length > 1) history.back(); else location.href = 'stitch-home.html';">
        <i data-lucide="chevron-left" class="text-[28px]"></i>
      </a>
      <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white" data-sd-id="4">Oda Konforu</h1>

      <div class="flex flex-col items-center mb-8" data-sd-id="7">
        <div class="relative w-48 h-48 flex items-center justify-center" data-sd-id="8">
          <svg class="absolute w-full h-full -rotate-90" data-sd-id="9">
            <circle cx="96" cy="96" r="88" stroke="currentColor" stroke-width="8" fill="transparent" class="text-slate-100 dark:text-slate-800"></circle>
            <circle cx="96" cy="96" r="88" stroke="#4C7DFF" stroke-width="8" fill="transparent" stroke-dasharray="552" stroke-dashoffset="180" stroke-linecap="round"></circle>
          </svg>
          <div class="flex flex-col items-center" data-sd-id="10">
            <span class="text-5xl font-extrabold text-slate-900 dark:text-white" data-sd-id="11">22.5°</span>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1" data-sd-id="12">Hedef Sıcaklık</span>
          </div>
          <div class="absolute -bottom-2 bg-[#4C7DFF] text-white px-3 py-1 rounded-full text-[10px] font-bold shadow-lg" data-sd-id="13">
            OTOMATİK MOD
          </div>
        </div>
      </div>

      <section class="grid grid-cols-2 gap-4 mb-8" data-sd-id="14">
        <div class="glass-card p-4 rounded-3xl" data-sd-id="15">
          <div class="flex items-center gap-2 mb-2" data-sd-id="16">
            <div class="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center" data-sd-id="17">
              <i data-lucide="wind" class="text-blue-500 text-lg"></i>
            </div>
            <span class="text-xs font-bold text-slate-500 dark:text-slate-400" data-sd-id="18">Hava Kalitesi</span>

          <div class="text-xl font-bold text-slate-900 dark:text-white" data-sd-id="19">Mükemmel</div>

            <span class="text-xs font-bold text-slate-500 dark:text-slate-400" data-sd-id="24">Nem Oranı</span>
          </div>
          <div class="text-xl font-bold text-slate-900 dark:text-white" data-sd-id="25">%48</div>

          <button class="shrink-0 w-28 h-32 rounded-3xl bg-white dark:bg-slate-800 border-2 border-[#4C7DFF] p-3 flex flex-col justify-between shadow-sm active:scale-95 transition-transform" data-sd-id="32">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-200 to-orange-400 flex items-center justify-center" data-sd-id="33">
              <i data-lucide="sunset" class="text-white text-xl"></i>
            </div>
            <span class="text-sm font-bold text-slate-900 dark:text-white leading-tight" data-sd-id="34">Sıcak Dinlenme</span>
          </button>
          <button class="shrink-0 w-28 h-32 rounded-3xl bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 p-3 flex flex-col justify-between shadow-sm active:scale-95 transition-transform" data-sd-id="35">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-blue-300 to-indigo-500 flex items-center justify-center" data-sd-id="36">

            <span class="text-sm font-bold text-slate-900 dark:text-white leading-tight" data-sd-id="37">Odaklanma</span>

            <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-200 to-teal-500 flex items-center justify-center" data-sd-id="39">

            </div>
            <span class="text-sm font-bold text-slate-900 dark:text-white leading-tight" data-sd-id="40">Doğal Esinti</span>
          </button>
        </div>
      </section>

      <section class="mb-4" data-sd-id="41">
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-4" data-sd-id="42">Akıllı Öneriler</h2>
        <div class="space-y-3" data-sd-id="43">
          <div class="glass-card p-4 rounded-[2rem] flex items-center gap-4" data-sd-id="44">
            <div class="w-12 h-12 rounded-2xl bg-[#4C7DFF]/10 flex items-center justify-center shrink-0" data-sd-id="45">
              <i data-lucide="sparkles" class="text-[#4C7DFF] text-2xl"></i>
            </div>
            <div class="flex-1" data-sd-id="46">

              <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5" data-sd-id="48">Uyku için sıcaklığı 20° seviyesine düşürün.</p>
            </div>
            <button class="nx-tap px-3 bg-[#4C7DFF] text-white text-[10px] font-bold rounded-full shadow-md active:scale-95 transition-transform" style="padding-top:9px;padding-bottom:9px" data-sd-id="49">UYGULA</button>
          </div>
          <div class="glass-card p-4 rounded-[2rem] flex items-center gap-4" data-sd-id="50">
            <div class="w-12 h-12 rounded-2xl bg-cyan-100 dark:bg-cyan-900/30 flex items-center justify-center shrink-0" data-sd-id="51">
              <i data-lucide="wind" class="text-cyan-500 text-2xl"></i>
            </div>
            <div class="flex-1" data-sd-id="52">
              <h4 class="text-sm font-bold text-slate-900 dark:text-white" data-sd-id="53">Hava Temizleme</h4>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5" data-sd-id="54">Hava kalitesini korumak için fanı artırın.</p>
            </div>
            <button class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-[10px] font-bold rounded-full active:scale-95 transition-transform" data-sd-id="55">GİZLE</button>
          </div>
        </div>

    <footer class="shrink-0 pb-[34px] px-5" data-sd-id="56">

        <i data-lucide="power" class="text-xl"></i>
        Tümünü Optimize Et
      </button>
    </footer>
  </div>
