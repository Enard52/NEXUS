</span>

<svg class="dnd-check w-5 h-5 text-nexus-purple hidden flex-shrink-0" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</li>

<div class="min-w-0">
<span class="text-[17px] font-medium text-nexus-purple block">Rahatsız Etme Takvimi</span>
<!-- Kaydedilen program stitch-program.html'den localStorage ile senkronize gelir -->
<span class="hidden text-sm text-slate-500 mt-0.5 block truncate" id="schedule-summary"></span>
</div>
<svg class="w-5 h-5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
</footer>
<!-- END: Footer Navigation Card -->
<script data-purpose="dnd-interactions">
    // Süresi dolmuş DnD seçimini temizle
    (function() {
      try {
        var endTime = nexusGetItem('nexusDndEndTime');
        if (endTime && Date.now() > parseInt(endTime, 10)) {
          nexusRemoveItem('nexusDndEndTime');
          nexusRemoveItem('nexusDndActive');
          nexusRemoveItem('nexusDndSelection');
        }
      } catch(e) {}
    })();
    // Move the checkmark to the tapped DND option and persist the choice
    function selectDnd(item) {
      document.querySelectorAll('#dnd-options .dnd-check').forEach(function (c) {
        c.classList.add('hidden');
      });
      item.querySelector('.dnd-check').classList.remove('hidden');

      var label = item.querySelector('span.text-\\[17px\\]').textContent;
      var stateLabel = label.indexOf('Kapat') !== -1 ? 'Kapalı' : label.replace(' Rahatsız Etme', '');
      nexusSetItem('nexusDndState', stateLabel);

      if (stateLabel === 'Kapalı') {
        nexusRemoveItem('nexusDndEndTime');
      } else {
        var hoursMatch = stateLabel.match(/(\d+)/);
        if (hoursMatch) {
          var hours = parseInt(hoursMatch[1]);
          var endTime = Date.now() + (hours * 60 * 60 * 1000);
          nexusSetItem('nexusDndEndTime', endTime);
        }
      }
    }
    // Restore the previously saved selection
    (function () {
      var state = nexusGetItem('nexusDndState');
      if (!state || state === 'Kapalı') return;
      document.querySelectorAll('#dnd-options li').forEach(function (li) {
        var label = li.querySelector('span.text-\\[17px\\]').textContent;
        var on = label.indexOf(state) === 0;
        li.querySelector('.dnd-check').classList.toggle('hidden', !on);
      });
    })();
    // Show the saved schedule from the Program Ekle page (synced via localStorage)
    (function () {
      var raw = nexusGetItem('nexusDndSchedule');
      if (!raw) return;
      try {
        var s = JSON.parse(raw);
        var el = document.getElementById('schedule-summary');
        el.textContent = s.start + ' – ' + s.end + ' · ' + s.repeat + ' · ' + s.devices;
        el.classList.remove('hidden');
      } catch (e) { /* bozuk kayıt varsa sessizce yok say */ }
    })();
  </script>
</body></html>
