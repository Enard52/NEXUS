<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>NEXUS — Ödemeler & Abonelik</title>
<!-- Tailwind CSS CDN -->
<link href="css/tailwind.css" rel="stylesheet"/><link href="css/nexus-ui.css" rel="stylesheet"/>
<!-- Google Fonts: Inter -->
<link href="fonts/inter/inter.css" rel="stylesheet"/>
  <!-- NEXUS Global Theme Manager -->
<script src="auth.js"></script>
  <script src="theme.js"></script>
<script src="data.js"></script>
<!-- AI Asistan Yüzen Buton -->
<script src="ai-fab.js"></script>
<style data-purpose="custom-styles">
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* Gradient for the main subscription card */
    .bg-nexus-gradient {
      background: linear-gradient(135deg, #4C7DFF 0%, #22D3EE 100%);
    }
  </style>
<style>
    body {
      min-height: 100dvh;
    }
  </style>
</head>
<body class="bg-[#F3F2F9] dark:bg-slate-950 min-h-screen text-slate-800 dark:text-slate-100 antialiased transition-colors duration-300">
<!-- BEGIN: NavigationHeader -->
<header class="sticky top-0 z-50 bg-[#F3F2F9]/80 dark:bg-slate-950/80 backdrop-blur-md px-4 py-4 pt-12 flex items-center transition-colors duration-300">
<button onclick="window.history.length > 1 ? history.back() : window.location.href='stitch-home.html'" aria-label="Geri" class="p-1 -ml-1 flex items-center text-slate-800 dark:text-white active:opacity-70 transition-opacity">
<!-- Chevron Left Icon -->
<svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<div class="flex-1 pr-8">
<h1 class="text-lg font-bold tracking-tight text-center text-slate-900 dark:text-white">Faturalandırma</h1>
</div>
</header>
<!-- END: NavigationHeader -->

<main class="px-5 py-4 space-y-6">
<!-- BEGIN: SubscriptionCard -->
<section data-purpose="subscription-status">
<div class="bg-nexus-gradient rounded-3xl p-6 flex items-center shadow-lg text-white w-full relative overflow-hidden">
<!-- Background decor -->
<div class="absolute -right-8 -top-8 w-32 h-32 bg-white/10 rounded-full blur-2xl pointer-events-none z-0"></div>

<!-- LOGO (NEXUS ICON) -->
<div class="relative z-10 bg-white/15 backdrop-blur-md rounded-2xl p-3 mr-4 flex items-center justify-center w-[68px] h-[68px] shadow-inner flex-shrink-0 border border-white/20">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-10 h-10 drop-shadow-md">
    <rect width="512" height="512" rx="144" fill="transparent"/>
    <rect x="24" y="24" width="464" height="464" rx="136" fill="none" stroke="#ffffff" stroke-opacity="1" stroke-width="24"/>
    <path d="M168 360V168L344 360V168" fill="none" stroke="#ffffff" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

<!-- TEXT SIDE-BY-SIDE -->
<div class="relative z-10 flex-1 min-w-0">
<h2 class="text-[20px] font-bold mb-1 leading-tight" id="sub-title">NEXUS+</h2>
<p class="text-white/85 text-[13px] font-medium truncate hidden" id="sub-since"></p>
<p class="text-white/85 text-[13px] font-medium mt-0.5 leading-snug" id="sub-renewal"></p>
</div>

</div>
</section>
<!-- END: SubscriptionCard -->

<!-- BEGIN: NavigationList (zero-dead-UI: yalnızca gerçek hedefi olan eylemler) -->
<nav class="space-y-4" data-purpose="billing-menu">
<!-- Abonelik Yönetimi -->
<button class="w-full flex items-center justify-between bg-white dark:bg-slate-900 p-5 rounded-3xl shadow-sm active:scale-[0.98] transition-transform" onclick="window.location.href='stitch-plus.html'">
<div class="flex items-center space-x-4">
<div class="text-[#4C7DFF] bg-[#4C7DFF]/10 p-3.5 rounded-2xl">
<svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[17px] font-semibold text-slate-800 dark:text-slate-100">Abonelik Yönetimi</span>
</div>
<svg class="h-6 w-6 text-slate-300 dark:text-slate-600" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Aboneliği İptal Et (yalnızca aktif abonelikte görünür) -->
<button class="hidden w-full flex items-center justify-between bg-white dark:bg-slate-900 p-5 rounded-3xl shadow-sm active:scale-[0.98] transition-transform" id="cancel-sub-btn" onclick="openCancelConfirm()">
<div class="flex items-center space-x-4">
<div class="text-red-500 bg-red-500/10 p-3.5 rounded-2xl">
<svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[17px] font-semibold text-red-500">Aboneliği Yönet / İptal Et</span>
</div>
<svg class="h-6 w-6 text-slate-300 dark:text-slate-600" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
<!-- END: NavigationList -->

<!-- BEGIN: InfoFooter -->
<footer class="pt-6" data-purpose="payment-notice">
<div class="bg-white dark:bg-slate-900 rounded-3xl py-4 px-4 text-center shadow-sm border-2 border-[#4C7DFF]/20">
<p class="text-[#4C7DFF] font-medium text-[15px]">
    Sonraki ödeme <span class="font-bold" id="sub-price">₺0,00</span> tutarında <span class="font-bold" id="sub-date-footer">-</span> tarihinde alınacak.
</p>
</div>
</footer>
<!-- END: InfoFooter -->
<!-- BEGIN: Cancel Confirmation Sheet -->
<div class="hidden fixed inset-0 bg-black/60 z-50 flex items-end" id="cancel-sheet" onclick="closeCancelConfirm()">
<div class="bg-white dark:bg-slate-900 w-full rounded-t-3xl p-6 pb-10" onclick="event.stopPropagation()">
<div class="w-10 h-1 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-5"></div>
<h2 class="font-bold text-lg mb-1 text-slate-900 dark:text-white">Aboneliği Whop'ta yönet</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm mb-5" id="cancel-note">İptal ve ödeme yöntemi değişikliği güvenli ödeme sayfamız Whop üzerinden yapılır. İptal edersen mevcut dönemin sonuna kadar kullanmaya devam edersin ve bir sonraki ödeme alınmaz.</p>
<button class="w-full bg-red-500 text-white font-bold py-3.5 rounded-xl active:scale-[0.98] transition-transform mb-2" onclick="cancelSubscription()">Whop'a Git</button>
<button class="w-full py-3 font-semibold text-slate-500 dark:text-slate-400" onclick="closeCancelConfirm()">Vazgeç</button>
</div>
</div>
<!-- END: Cancel Confirmation Sheet -->
</main>

<script>
  // Dinamik Abonelik Yönetimi (gerçek veri: nexusPlusPlan + nexusPlusSince)
  function renderBilling() {
    const plan = nexusGetItem("nexusPlusPlan"); // 'Yıllık' veya 'Aylık' (sunucudan: Whop webhook'u)
    const title = document.getElementById("sub-title");
    const renewal = document.getElementById("sub-renewal");
    const price = document.getElementById("sub-price");
    const dateFooter = document.getElementById("sub-date-footer");
    const since = document.getElementById("sub-since");
    const options = { year: 'numeric', month: 'long', day: 'numeric' };

    // Gerçek satın Çalışma tarihi (stitch-plus.html yazar); kayıt yoksa satır gizli kalır
    const sinceIso = nexusGetItem("nexusPlusSince");
    const sinceDate = sinceIso ? new Date(sinceIso) : null;
    if (plan && sinceDate && !isNaN(sinceDate.getTime())) {
      var sinceStr = sinceDate.toLocaleDateString((window.nexusLocale || 'tr-TR'), options);
      since.textContent = nexusT(sinceStr + " tarihinden beri aktif", "Active since " + sinceStr);
      since.classList.remove("hidden");
    }

    // Dönem sonu sunucudan gelir (Whop); yoksa plana göre tahmin edilmez, tarih gösterilmez.
    const endIso = nexusGetItem("nexusPlusEnd");
    const endDate = endIso ? new Date(endIso) : null;
    const hasEnd = endDate && !isNaN(endDate.getTime());
    const dateStr = hasEnd ? endDate.toLocaleDateString((window.nexusLocale || 'tr-TR'), options) : "-";
    const cancelling = nexusGetItem("nexusPlusCancel") === "1";

    if (plan === "Yıllık" || plan === "Aylık") {
      title.textContent = "NEXUS+ " + plan;
      const cur = nexusGetItem("nexusPlusCurrency") || "TRY";
      const pm = (window.nexusCloud && window.nexusCloud.prices) ? window.nexusCloud.prices(cur) : null;
      price.textContent = pm ? pm[plan] : (plan === "Yıllık" ? "₺3.999,99" : "₺499,99");
      renewal.textContent = cancelling
        ? (hasEnd ? "İptal edildi — " + dateStr + " tarihine kadar geçerli" : "İptal edildi — dönem sonuna kadar geçerli")
        : (hasEnd ? "Sonraki Yenileme: " + dateStr : "Aboneliğin aktif");
      dateFooter.textContent = dateStr;
      document.querySelector('[data-purpose="payment-notice"]').style.display = (cancelling || !hasEnd) ? 'none' : '';
    } else {
      // Aktif abonelik yoksa
      title.textContent = "NEXUS+";
      price.textContent = "₺0,00";
      renewal.textContent = "Aboneliğin yok. NEXUS+ için Plus sayfasından ücretsiz deneyebilirsin.";
      dateFooter.textContent = "-";
      document.querySelector('[data-purpose="payment-notice"]').style.display = 'none';
    }

    // Yönetim butonu yalnızca aktif abonelikte görünür
    document.getElementById("cancel-sub-btn").classList.toggle("hidden", !plan);
  }
  document.addEventListener("DOMContentLoaded", () => {
    renderBilling();
    // Güncel durumu sunucudan al (başka cihazdan veya Whop'tan yapılan değişiklikler).
    if (window.nexusCloud && window.nexusCloud.enabled()) {
      window.nexusCloud.pullEntitlement().then(renderBilling).catch(() => {});
    }
  });

  /* ---------- Abonelik yönetimi / iptal (Whop) ---------- */
  function openCancelConfirm() {
    document.getElementById("cancel-sheet").classList.remove("hidden");
  }
  function closeCancelConfirm() {
    document.getElementById("cancel-sheet").classList.add("hidden");
  }
  // İptal ve ödeme yöntemi Whop hesabında yapılır; iptal sonrası durum buraya otomatik yansır.
  function cancelSubscription() {
    closeCancelConfirm();
    const url = (window.nexusCloud && window.nexusCloud.manageUrl && window.nexusCloud.manageUrl()) || "https://whop.com/@me/settings/memberships/";
    window.open(url, "_blank", "noopener");
  }
</script>
</body>
</html>
