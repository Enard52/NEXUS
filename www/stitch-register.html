<script data-purpose="password-strength">
  // Basit dürüst güç göstergesi (uzunluk + çeşitlilik; zxcvbn gibi ağır bağımlılık yok)
  function pwStrength(v) {
    var el = document.getElementById('pw-strength');
    if (!el) return;
    var score = 0;
    if (v.length >= 8) score++;
    if (/[a-zçğıöşü]/.test(v) && /[A-ZÇĞİÖŞÜ]/.test(v)) score++;
    if (/\d/.test(v)) score++;
    if (/[^A-Za-z0-9çğıöşüÇĞİÖŞÜ]/.test(v)) score++;
    var map = [
      ['Çok zayıf — en az 8 karakter kullan.', 'text-slate-400'],
      ['Zayıf — harf + rakam ekle.', 'text-red-500'],
      ['Orta — büyük harf veya simge ekle.', 'text-amber-500'],
      ['İyi.', 'text-emerald-600'],
      ['Güçlü şifre.', 'text-emerald-600']
    ];
    el.textContent = map[score][0];
    el.className = 'mt-1.5 ml-1 text-[11px] font-semibold ' + map[score][1];
  }
</script>
<script data-purpose="register-interactions">
  function doRegister() {
    var name = (document.getElementById('register-name').value || '').trim();
    var email = (document.getElementById('register-email').value || '').trim();
    var pw = (document.getElementById('register-password').value || '').trim();
    var pwConfirm = (document.getElementById('register-confirm-password').value || '').trim();
    var errorBox = document.getElementById('error-message');

    if (!name || !email || !pw || !pwConfirm) {
      errorBox.textContent = 'Lütfen tüm alanları doldurun.';
      errorBox.classList.remove('hidden');
      return;
    }

    if (pw !== pwConfirm) {
      errorBox.textContent = 'Şifreler eşleşmiyor.';
      errorBox.classList.remove('hidden');
      return;
    }

    var minLen = (window.nexusCloud && window.nexusCloud.enabled()) ? 6 : 4;
    if (pw.length < minLen) {
      errorBox.textContent = 'Şifre en az ' + minLen + ' karakter olmalıdır.';
      errorBox.classList.remove('hidden');
      return;
    }

    // Basit E-posta regex kontrolü
    var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      errorBox.textContent = 'Lütfen geçerli bir e-posta girin.';
      errorBox.classList.remove('hidden');
      return;
    }

    if (window.nexusLocalPassword.exists(email) && !(window.nexusCloud && window.nexusCloud.enabled())) {
      errorBox.textContent = 'Bu e-posta ile zaten bir hesap var. Lütfen giriş yapın.';
      errorBox.classList.remove('hidden');
      return;
    }

    function completeRegistration() {
      // Başarılı kayıt: şifrenin yalnızca tuzlu özeti saklanır
      var saved = window.nexusLocalPassword.set(email, pw).catch(function () {});

      // Otomatik giriş — önce currentUser'ı set et, sonra nexusSetItem çalışır
      localStorage.setItem('nexusEverLoggedIn', '1');
      localStorage.setItem('nexusCurrentUser', email);

      // Auth prefix sistemiyle uyumlu şekilde kullanıcı bilgilerini kaydet
      try {
        nexusSetItem('nexusUserName', name);
        nexusSetItem('nexusUserEmail', email);
        // Fallback: eski key şemasına da yaz (login sayfası okuyor)
        localStorage.setItem(email + '_userName', name);
      } catch (e) {
        localStorage.setItem(email + '_userName', name);
      }

      saved.then(function () { window.location.replace('stitch-home.html'); });
    }

    // Bulut yapılandırılmışsa hesap Supabase'te açılır; cihaz listesi sonraki
    // senkronlarda bu hesabın altına yazılır. Yapılandırma yoksa yerel akış aynen sürer.
    if (window.nexusCloud && window.nexusCloud.enabled()) {
      var submit = document.querySelector('button[onclick="doRegister()"]');
      if (submit) submit.disabled = true;
      window.nexusCloud.signUp(email, pw, name).then(function (result) {
        if (!result.session) {
          // E-posta doğrulaması açık: hesap, bağlantıya tıklanınca sitede doğrulanır.
          // Doğrulanmamış hesapla uygulamaya girilmez.
          errorBox.className = 'mb-4 p-4 rounded-xl bg-green-100 text-green-700 text-sm font-semibold text-center shadow-sm';
          errorBox.textContent = 'Doğrulama bağlantısını ' + email + ' adresine gönderdik. Bağlantıya tıkladıktan sonra giriş yapabilirsin.';
          errorBox.classList.remove('hidden');
          if (submit) submit.disabled = false;
          return;
        }
        // Oturum açıldı: profil yazılır, hesaba gönderilir, sonra ana sayfa.
        localStorage.setItem('nexusEverLoggedIn', '1');
        localStorage.setItem('nexusCurrentUser', result.session.email || email);
        nexusSetItem('nexusUserName', name);
        nexusSetItem('nexusUserEmail', result.session.email || email);
        return window.nexusCloud.syncAll().catch(function () {}).then(function () {
          window.location.replace('stitch-home.html');
        });
      }).catch(function (error) {
        if (submit) submit.disabled = false;
        errorBox.className = 'mb-4 p-4 rounded-xl bg-red-100 text-red-600 text-sm font-semibold text-center shadow-sm';
        var text = String((error && error.message) || '');
        if (/already registered|already exists/i.test(text)) text = 'Bu e-posta ile zaten bir hesap var. Lütfen giriş yapın.';
        else if (/Password should be/i.test(text)) text = 'Şifre en az 6 karakter olmalı.';
        else if (/NetworkError|Failed to fetch/i.test(text)) text = 'Buluta ulaşılamadı. İnternet bağlantını kontrol et.';
        errorBox.textContent = text || 'Hesap oluşturulamadı.';
        errorBox.classList.remove('hidden');
      });
      return;
    }

    completeRegistration();
  }
</script>
