<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://js.whop.com https://*.whop.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' data: blob: https: http: ws: wss:; media-src 'self' data: blob: https: http:; frame-src 'self' https://*.whop.com https://js.whop.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.whop.com"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="theme-color" content="#ffffff"/>
  <title>NEXUS - Aile Sohbeti</title>
  <link href="css/tailwind.css" rel="stylesheet"/><link href="css/nexus-ui.css" rel="stylesheet"/>
  <link href="fonts/inter/inter.css" rel="stylesheet"/>

  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="data.js"></script>
  <script src="nexus-dialog.js"></script>
  <style>
    body {
      font-family: "Inter", sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(to bottom, #ece9fd 0%, #f5f3ff 40%, #ffffff 100%);
      -webkit-font-smoothing: antialiased;
    }
    html.dark body {
      background: linear-gradient(180deg, #020617 0%, #0f172a 35%, #111827 100%);
      color: #f8fafc;
    }
    /* "anywhere"/"break-word" en küçük içerik genişliğini 1 harfe indirir: kısa mesajlar ("Merhaba") iki satıra bölünürdü.
       Genişlik sınırı baloncukta değil, belirli genişlikteki mesaj sütunundadır. */
    .msg-col { max-width: 82%; }
    /* Derlenmiş Tailwind'de olmayan sınıflar (sayfada kullanılıyor): kaydırma, özet paneli, sayaç, ev seçici */
    #messages { min-height: 0; }
    #summary-overlay { z-index: 80; background: rgba(15, 23, 42, 0.5); }
    #summary-overlay > div { border-radius: 2rem 2rem 0 0; }
    #composer-count { top: -1.25rem; }
    #home-select { max-width: 9rem; }
    .msg-quote { border-left: 4px solid rgba(127, 127, 127, 0.45) !important; }
    .bubble { max-width: 100%; white-space: pre-wrap; overflow-wrap: break-word; }
    .bubble-me { background: var(--nx-accent,#4C7DFF); color: #fff; border-radius: 20px 20px 6px 20px; }
    .bubble-other { background: #fff; color: #0f172a; border-radius: 20px 20px 20px 6px; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06); }
    html.dark .bubble-other { background: #1e293b; color: #f1f5f9; box-shadow: none; }
    .composer-field { resize: none; max-height: 7.5rem; }
    .notice { background: #f5f3ff; border: 1px solid #e9e4ff; color: #475569; }
    html.dark .notice { background: #1f173f; border-color: #3b2b76; color: #cbd5e1; }
    .warn { background: #fffbeb; border: 1px solid #fde68a; color: #78350f; }
    html.dark .warn { background: rgba(120, 53, 15, 0.25); border-color: #92400e; color: #fde68a; }
  </style>
</head>
<body class="text-slate-900 dark:text-slate-50">
  <header class="shrink-0 pt-14 pb-4 px-5 flex items-center gap-3">
    <a aria-label="Geri" class="p-1 -ml-1 text-slate-700 dark:text-slate-200" href="nexus-household.html">
      <i class="w-7 h-7" data-lucide="chevron-left"></i>
    </a>
    <div class="min-w-0 flex-1">
      <h1 id="chat-title" class="truncate text-lg font-bold tracking-tight">Aile Sohbeti</h1>
      <p id="chat-sub" class="truncate text-xs font-medium text-slate-400"></p>
    </div>
    <button id="summary-btn" type="button" aria-label="Haftalık özet" title="Haftalık Özet" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-white text-[#4C7DFF] shadow-sm active:scale-95 transition-transform dark:bg-slate-800">
      <i class="w-5 h-5" data-lucide="chart-column"></i>
    </button>
    <a href="nexus-board.html" aria-label="Ev Panosu" title="Ev Panosu" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-white text-[#4C7DFF] shadow-sm active:scale-95 transition-transform dark:bg-slate-800">
      <i class="w-5 h-5" data-lucide="clipboard-list"></i>
    </a>
    <select id="home-select" aria-label="Ev seç" class="hidden max-w-[9rem] rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold dark:border-slate-700 dark:bg-slate-900 dark:text-slate-50"></select>
  </header>

  <div class="shrink-0 px-5 pb-2">
    <div class="notice rounded-2xl px-4 py-2.5 text-xs font-medium leading-relaxed">
      Mesajlar şifreli olarak gönderilir ve saklanır. Bu evin üyeleri dışında kimse okuyamaz; ev silinirse mesajlar da silinir.
    </div>
    <div id="state-banner" class="warn mt-2 hidden rounded-2xl px-4 py-2.5 text-sm font-medium" aria-live="polite"></div>
  </div>

  <main id="messages" class="min-h-0 flex-1 overflow-y-auto px-5 py-3" aria-live="polite"></main>

  <!-- Yanıtlanan mesaj önizlemesi: mesaja dokununca "Yanıtla" ile burada belirir -->
  <div id="reply-bar" class="hidden shrink-0 items-center gap-2 px-5 pt-2">
    <div class="flex min-w-0 flex-1 items-center gap-2 rounded-xl border-l-4 border-[#4C7DFF] bg-white px-3 py-2 dark:bg-slate-800">
      <div class="min-w-0">
        <p class="text-[11px] font-bold text-[#4C7DFF]" id="reply-name"></p>
        <p id="reply-quote" class="truncate text-xs text-slate-500 dark:text-slate-300"></p>
      </div>
    </div>
    <button id="reply-cancel" type="button" aria-label="Yanıttan vazgeç" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-slate-400 active:scale-95 transition-transform">
      <i class="w-5 h-5" data-lucide="x"></i>
    </button>
  </div>

  <!-- Haftalık Özet katmanı: son 7 günün etkinlik özeti (etkinlik akışından hesaplanır) -->
  <div id="summary-overlay" class="fixed inset-0 z-[80] hidden flex-col bg-slate-900/50 backdrop-blur-sm" onclick="if(event.target===this)closeSummary()">
    <div class="mx-auto mt-auto w-full max-w-md rounded-t-[2rem] bg-white p-6 pb-10 dark:bg-slate-900" style="padding-bottom:max(2.5rem, env(safe-area-inset-bottom));">
      <div class="mx-auto mb-4 h-1.5 w-14 rounded-full bg-slate-200"></div>
      <h2 class="text-lg font-bold">Haftalık Özet</h2>
      <p id="summary-sub" class="mt-0.5 text-xs font-medium text-slate-400"></p>
      <div id="summary-body" class="mt-4 space-y-2"></div>
      <button type="button" onclick="closeSummary()" class="mt-5 w-full py-3.5 rounded-xl bg-[#4C7DFF]/10 text-[#4C7DFF] font-bold text-sm active:scale-[0.98] transition-transform">Kapat</button>
    </div>
  </div>

  <form id="composer" class="shrink-0 hidden items-end gap-2 px-5 pt-2" style="padding-bottom: max(1rem, env(safe-area-inset-bottom));" autocomplete="off">
    <div class="relative flex-1">
      <textarea id="composer-input" rows="1" maxlength="1000" enterkeyhint="send" placeholder="Mesaj yaz…" class="composer-field w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 font-medium focus:border-[#4C7DFF] focus:ring-[#4C7DFF] dark:border-slate-700 dark:bg-slate-900 dark:text-slate-50"></textarea>
      <span id="composer-count" class="pointer-events-none absolute -top-5 right-1 hidden text-xs font-semibold text-slate-400"></span>
    </div>
    <button id="send-btn" type="submit" aria-label="Gönder" class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-[#4C7DFF] text-white transition-transform active:scale-95 disabled:opacity-40">
      <i class="w-5 h-5" data-lucide="send"></i>
    </button>
  </form>

  <script src="js/lucide.js"></script>
  <script src="household-cloud.js"></script>
  <script src="family-chat-page.js"></script>
</body>
</html>
