<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://js.whop.com https://*.whop.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' data: blob: https: http: ws: wss:; media-src 'self' data: blob: https: http:; frame-src 'self' https://*.whop.com https://js.whop.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.whop.com"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=3.0" name="viewport"/>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>NEXUS — Akıllı Senaryolar</title>

  <link href="css/tailwind.css" rel="stylesheet"/><link href="css/nexus-ui.css" rel="stylesheet"/>
  <link href="fonts/inter/inter.css" rel="stylesheet"/>
  <link href="css/quick-scenes.css" rel="stylesheet"/>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      background: linear-gradient(to bottom, #ECE9FD 0%, #F5F3FF 40%, #ffffff 100%);
      min-height: 100dvh;
    }
    html.dark body { background: linear-gradient(to bottom, #0f172a 0%, #111827 100%); color: #f1f5f9; }
    .qs-page { max-width: 640px; margin: 0 auto; padding: 8px 20px 180px; }
    .qs-title-block { text-align: center; margin: 4px 0 22px; }
    .qs-title-block h2 { margin: 0 0 4px; font-size: 24px; font-weight: 800; letter-spacing: -.02em; color: var(--qs-text); }
    .qs-title-block p { margin: 0; font-size: 13.5px; color: var(--qs-muted); }
    .qs-detail { margin-top: 12px; padding: 14px; border-radius: 18px; background: var(--qs-soft); border: 1px solid var(--qs-line); }
    .qs-detail h5 { margin: 0 0 4px; font-size: 13px; font-weight: 800; color: var(--qs-text); }
    .qs-detail p.qs-sub { margin: 0 0 10px; }
    .qs-detail .qs-chips + h5 { margin-top: 14px; }
    .qs-row2 { display: flex; gap: 8px; margin-top: 10px; }
    .qs-row2 .qs-input { min-width: 0; }
  </style>
<script src="ai-fab.js"></script>
<script src="auth.js"></script>
  <script src="theme.js"></script>
<script src="supported-devices.js"></script>
<script src="lan-connectors.js"></script>
<script src="device-controls.js"></script>
<script src="data.js"></script>
<script src="quick-scenes.js"></script>
</head>
<body class="text-slate-900 flex flex-col relative">

  <header class="pt-14 pb-4 px-5 flex items-center justify-between relative" data-purpose="page-header">
    <a aria-label="Geri" class="p-1 -ml-1" href="#" onclick="event.preventDefault(); if (history.length > 1) history.back(); else location.href = 'nexus-smart.html';">
      <i class="w-7 h-7 text-slate-700" data-lucide="chevron-left"></i>
    </a>
    <h1 id="page-title" class="text-lg font-bold tracking-tight whitespace-nowrap absolute left-1/2 -translate-x-1/2">Akıllı Senaryolar</h1>
    <span class="w-7"></span>
  </header>

  <main class="qs-page qs-wrap w-full" id="qs-root"></main>

  <div class="qs-savebar" id="qs-savebar">
    <button type="button" class="qs-save" id="qs-save" disabled><i data-lucide="check" class="w-5 h-5"></i><span id="qs-save-text">Kaydet</span></button>
    <p class="qs-hint" id="qs-hint"></p>
  </div>

  <script src="js/lucide.js"></script>
  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var TYPE = params.get('type') === 'clickrun' ? 'clickrun' : 'automation';
    var EDIT_ID = TYPE === 'clickrun' ? params.get('edit') : null;
    var QS = window.nexusQuickScenes;
    var root = document.getElementById('qs-root');
    var saveBtn = document.getElementById('qs-save');
    var hintEl = document.getElementById('qs-hint');

    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function toast(m, t) { if (window.nexusToast) window.nexusToast(m, { type: t || 'info' }); }
    function icons() { if (typeof lucide !== 'undefined') lucide.createIcons(); }

    var editing = null;
    if (EDIT_ID) {
      try { editing = readAndNormalizeItems('nexusCustomClickRun', 'clickrun').filter(function (i) { return i.id === EDIT_ID; })[0] || null; } catch (e) {}
    }

    var devices = [];
    try { devices = NX.readDevices(); } catch (e) {}
    function sensorKey(d) { return String(d.id || (d.host + '|' + d.name)); }
    var SENSOR_KINDS = { motion: 1, contact: 1, alarm: 1 };
    var switchable = devices.filter(function (d) { return NX.isLan(d) && NX.hasCap(d, 'switch'); });
    var sensors = devices.filter(function (d) { return NX.isLan(d) && SENSOR_KINDS[NX.kindOf(d)]; });
    var coords = null;
    try { coords = JSON.parse(nexusGetItem('nexusWeatherCoords') || 'null'); } catch (e) {}
    var hasLoc = !!(coords && isFinite(coords.lat) && isFinite(coords.lon));

    var scenes = QS ? QS.list() : [];

    var S = {
      scene: editing && editing.sceneId ? editing.sceneId : null, // null = seçilmedi; notify = yalnızca bildirim
      name: editing ? editing.title : '',
      nameTouched: !!editing,
      trig: 'time',
      time: '07:00', customTime: '07:00', timeMode: 'preset', repeat: 'daily',
      device: null, event: 'any', sensor: null,
      weather: { metric: 'temp', op: 'above', value: '' },
    };

    var TIME_PRESETS = [['sunrise', 'Gündoğumu'], ['07:00', 'Sabah 07:00'], ['sunset', 'Gün batımı'], ['19:00', 'Akşam 19:00'], ['23:00', 'Gece 23:00']];
    var REPEATS = [['daily', 'Her gün'], ['weekdays', 'Hafta içi'], ['weekends', 'Hafta sonu']];
    var TRIGGERS = [
      { id: 'time', icon: 'clock', hex: '#4C7DFF', title: 'Zamanlayıcı', desc: 'Belirli bir saatte, gündoğumu ya da gün batımında' },
      { id: 'device', icon: 'power', hex: '#10b981', title: 'Cihaz durumu', desc: 'Bir cihaz açıldığında ya da kapandığında' },
      { id: 'sensor', icon: 'radar', hex: '#ef4444', title: 'Sensör algıladığında', desc: 'Hareket, kapı/pencere ya da duman/su sensörü' },
      { id: 'weather', icon: 'cloud-sun', hex: '#f59e0b', title: 'Hava durumu', desc: 'Sıcaklık, rüzgâr ya da yağış eşiği aşılınca' },
    ];

    function timeValue() { return S.timeMode === 'custom' ? S.customTime : S.time; }
    function timeLabel() {
      var v = timeValue();
      var base = v === 'sunrise' ? 'Gündoğumu' : v === 'sunset' ? 'Gün batımı' : v;
      var rep = REPEATS.filter(function (r) { return r[0] === S.repeat; })[0][1].toLowerCase();
      return rep + ' ' + base;
    }
    function triggerSummary() {
      if (S.trig === 'time') return timeLabel();
      if (S.trig === 'device') return S.device ? S.device.name + ({ on: ' açılınca', off: ' kapanınca', any: ' değişince' }[S.event]) : '';
      if (S.trig === 'sensor') return S.sensor ? S.sensor.name + ' algılayınca' : '';
      var w = S.weather;
      return ({ temp: 'Sıcaklık', wind: 'Rüzgâr', rain: 'Yağış' }[w.metric]) + (w.op === 'above' ? ' üstüne çıkınca' : ' altına inince');
    }

    // ---------- Parçalar ----------
    function sceneCard(s) {
      var on = S.scene === s.id;
      var disabled = s.affected === 0;
      var meta = disabled ? 'Uygun cihazın yok' : s.affected + ' cihaz · ' + deviceText(s.devices);
      var h = '<button type="button" class="qs-choice' + (on ? ' is-on' : '') + '" data-scene="' + esc(s.id) + '"' + (disabled ? ' disabled' : '') + '>' +
        '<span class="qs-ico" style="background:' + s.hex + '1f;color:' + s.hex + '"><i data-lucide="' + esc(s.icon) + '"></i></span>' +
        '<span class="qs-body"><span class="qs-title">' + esc(s.title) + '</span><span class="qs-meta">' + esc(s.desc) + '</span><span class="qs-meta" style="font-weight:700">' + esc(meta) + '</span></span>' +
        '<span class="qs-radio"></span></button>';
      if (on) h += previewBlock(s);
      return h;
    }
    function deviceText(devs) {
      var n = devs.map(function (d) { return d.name; });
      return n.slice(0, 2).join(', ') + (n.length > 2 ? ' +' + (n.length - 2) : '');
    }
    function previewBlock(s) {
      return '<div class="qs-preview"><h5>Çalışınca ne olur</h5><ul>' + s.devices.map(function (d) {
        return '<li><span>' + esc(d.name) + '</span><span>' + esc(d.text) + '</span></li>';
      }).join('') + '</ul></div>';
    }
    function chip(attr, val, label, on) {
      return '<button type="button" class="qs-chip' + (on ? ' is-on' : '') + '" ' + attr + '="' + esc(val) + '">' + label + '</button>';
    }
    // Cihaz yokken önceki "Öneri hazır değil" kartı aynen korunur.
    function noDevicesNote() {
      return '<div class="rounded-3xl border border-slate-100 bg-white p-6 text-center shadow-sm"><div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#4C7DFF]/10 text-[#4C7DFF]"><i class="w-7 h-7" data-lucide="sparkles"></i></div><h4 class="text-base font-extrabold text-slate-900">Öneri hazır değil</h4><p class="mt-2 text-sm text-slate-500">Cihaz eklenince hızlı oluşturma önerileri burada görünecek.</p></div>';
    }

    function sceneSection(step, withNotify) {
      if (!QS || !QS.hasDevices()) return '<section class="qs-section"><div class="qs-label"><span class="qs-step">' + step + '</span>Ne yapsın?</div>' + (TYPE === 'clickrun' ? noDevicesNote() : '<div class="qs-note">Senaryolar eşleştirdiğin cihazlarda çalışır. <a href="nexus-pair.html">Cihaz ekle</a></div>') + '</section>';
      var h = '<section class="qs-section"><div class="qs-label"><span class="qs-step">' + step + '</span>Ne yapsın?</div>';
      h += scenes.map(sceneCard).join('');
      if (withNotify) {
        var on = S.scene === 'notify';
        h += '<button type="button" class="qs-choice' + (on ? ' is-on' : '') + '" data-scene="notify">' +
          '<span class="qs-ico" style="background:#64748b1f;color:#64748b"><i data-lucide="bell-ring"></i></span>' +
          '<span class="qs-body"><span class="qs-title">Yalnızca bildirim</span><span class="qs-meta">Cihazlara dokunmaz, sadece haber verir.</span></span><span class="qs-radio"></span></button>';
      }
      return h + '</section>';
    }
    function nameSection(step) {
      var def = suggestedName();
      return '<section class="qs-section"><div class="qs-label"><span class="qs-step">' + step + '</span>Adı</div>' +
        '<input class="qs-input" id="qs-name" maxlength="40" placeholder="' + esc(def) + '" value="' + esc(S.name) + '"></section>';
    }
    function suggestedName() {
      if (S.scene && S.scene !== 'notify' && window.NX && NX.SCENES[S.scene]) return NX.SCENES[S.scene].title;
      return TYPE === 'clickrun' ? 'Yeni senaryo' : 'Yeni otomasyon';
    }

    // Tetikleyici seçimi ve ayrıntısı
    function triggerDetail() {
      if (S.trig === 'time') {
        var v = timeValue();
        var h = '<div class="qs-detail"><h5>Saat</h5><div class="qs-chips">' +
          TIME_PRESETS.map(function (p) { return chip('data-time', p[0], p[1], S.timeMode === 'preset' && S.time === p[0]); }).join('') +
          chip('data-time', 'custom', 'Saat seç', S.timeMode === 'custom') + '</div>';
        if (S.timeMode === 'custom') h += '<div class="qs-row2"><input type="time" class="qs-input" id="qs-time" value="' + esc(S.customTime) + '"></div>';
        h += '<h5>Tekrar</h5><div class="qs-chips">' + REPEATS.map(function (r) { return chip('data-repeat', r[0], r[1], S.repeat === r[0]); }).join('') + '</div>' +
          '<p class="qs-sub" style="margin:12px 0 0">Zamanlamalar uygulama açıkken (masaüstünde tepsideyken de) çalışır.</p></div>';
        return h;
      }
      if (S.trig === 'device') {
        if (!switchable.length) return '<div class="qs-detail"><p class="qs-sub" style="margin:0">Yerel ağda açılıp kapanabilen eşleşmiş cihazın yok. <a href="nexus-pair.html" style="color:var(--qs-accent);font-weight:800">Cihaz ekle</a></p></div>';
        return '<div class="qs-detail"><h5>İzlenecek cihaz</h5><p class="qs-sub">Durumu uygulama açıkken yaklaşık 30 sn\'de bir okunur; değişince çalışır.</p><div class="qs-chips">' +
          switchable.map(function (d) { var k = sensorKey(d); return '<button type="button" class="qs-chip' + (S.device && S.device.key === k ? ' is-on' : '') + '" data-device="' + esc(k) + '" data-name="' + esc(d.name || 'Cihaz') + '">' + NX.thumbHtml(d) + esc(d.name || 'Cihaz') + '</button>'; }).join('') +
          '</div><h5>Ne zaman</h5><div class="qs-chips">' +
          [['on', 'Açıldığında'], ['off', 'Kapandığında'], ['any', 'Durumu değişince']].map(function (o) { return chip('data-event', o[0], o[1], S.event === o[0]); }).join('') + '</div></div>';
      }
      if (S.trig === 'sensor') {
        if (!sensors.length) return '<div class="qs-detail"><p class="qs-sub" style="margin:0">Yerel ağa eşli hareket, kapı/pencere ya da duman/su sensörün yok. <a href="nexus-pair.html" style="color:var(--qs-accent);font-weight:800">Sensör ekle</a></p></div>';
        return '<div class="qs-detail"><h5>Tetikleyen sensör</h5><p class="qs-sub">Sensör kapalıdan açığa geçince çalışır (uygulama açıkken, yaklaşık 30 sn\'de bir okunur).</p><div class="qs-chips">' +
          sensors.map(function (d) { var k = sensorKey(d); return '<button type="button" class="qs-chip' + (S.sensor && S.sensor.key === k ? ' is-on' : '') + '" data-sensor="' + esc(k) + '" data-name="' + esc(d.name || 'Sensör') + '">' + NX.thumbHtml(d) + esc(d.name || 'Sensör') + '</button>'; }).join('') + '</div></div>';
      }
      // weather
      if (!hasLoc) return '<div class="qs-detail"><p class="qs-sub" style="margin:0">Ev konumu seçilmedi, hava verisi okunamaz. Önce <a href="nexus-map.html" style="color:var(--qs-accent);font-weight:800">konum seç</a>.</p></div>';
      return '<div class="qs-detail"><h5>Hava koşulu</h5><p class="qs-sub">Ev konumunun gerçek hava verisi yaklaşık 10 dk\'da bir okunur; koşul sağlanır hale gelince senaryo bir kez çalışır.</p><div class="qs-chips">' +
        [['temp', 'Sıcaklık (°C)'], ['wind', 'Rüzgâr (km/sa)'], ['rain', 'Yağış (mm)']].map(function (m) { return chip('data-metric', m[0], m[1], S.weather.metric === m[0]); }).join('') +
        '</div><div class="qs-chips" style="margin-top:10px">' +
        [['above', 'Üstüne çıkınca'], ['below', 'Altına inince']].map(function (o) { return chip('data-op', o[0], o[1], S.weather.op === o[0]); }).join('') +
        '</div><div class="qs-row2"><input class="qs-input" id="qs-wval" type="number" step="any" inputmode="decimal" placeholder="Eşik değer" value="' + esc(S.weather.value) + '"></div></div>';
    }
    function triggerSection() {
      var h = '<section class="qs-section"><div class="qs-label"><span class="qs-step">1</span>Ne zaman çalışsın?</div>';
      TRIGGERS.forEach(function (t) {
        var on = S.trig === t.id;
        h += '<button type="button" class="qs-choice' + (on ? ' is-on' : '') + '" data-trig="' + t.id + '">' +
          '<span class="qs-ico" style="background:' + t.hex + '1f;color:' + t.hex + '"><i data-lucide="' + t.icon + '"></i></span>' +
          '<span class="qs-body"><span class="qs-title">' + t.title + '</span><span class="qs-meta">' + t.desc + '</span></span><span class="qs-radio"></span></button>';
        if (on) h += triggerDetail();
      });
      h += '<p class="qs-sub" style="margin:12px 0 0">Konum (eve varınca / çıkınca) ve güvenlik modu tetikleyicileri henüz yok.</p></section>';
      return h;
    }

    // Hızlı öneriler (yalnız otomasyon): eşleşmiş cihazlarda gerçekten çalışan senaryo + gerçek zaman tetikleyicisi
    function suggestionSection() {
      if (!QS || !QS.hasDevices()) return '<section class="qs-section"><div class="qs-label">Hızlı öneriler</div>' + noDevicesNote() + '</section>';
      var sug = QS.available().filter(function (s) { return s.time; });
      if (!sug.length) return '';
      var h = '<section class="qs-section"><div class="qs-label">Hızlı öneriler</div><p class="qs-sub">Cihazlarına göre hazır; tek dokunuşla eklenir.</p>';
      sug.forEach(function (s) {
        h += '<div class="qs-sugg"><span class="qs-ico" style="background:' + s.hex + '1f;color:' + s.hex + '"><i data-lucide="' + esc(s.icon) + '"></i></span>' +
          '<span class="qs-body"><span class="qs-title">' + esc(s.title) + '</span><span class="qs-meta">' + esc(s.time.label) + ' · ' + s.affected + ' cihaz</span></span>' +
          '<button type="button" class="qs-link-btn" data-sugg="' + esc(s.id) + '"><i data-lucide="plus"></i> Ekle</button></div>';
      });
      return h + '</section>';
    }

    // ---------- Doğrulama ve kayıt ----------
    function problem() {
      if (!S.scene) return TYPE === 'clickrun' ? 'Önce bir senaryo seç.' : 'Ne yapacağını seç.';
      if (TYPE === 'clickrun') return '';
      if (S.trig === 'time') return '';
      if (S.trig === 'device') return !switchable.length ? 'Bu tetikleyici için eşleşmiş cihaz yok.' : S.device ? '' : 'İzlenecek cihazı seç.';
      if (S.trig === 'sensor') return !sensors.length ? 'Bu tetikleyici için eşleşmiş sensör yok.' : S.sensor ? '' : 'Tetikleyen sensörü seç.';
      if (!hasLoc) return 'Önce ev konumunu seç.';
      var v = S.weather.value;
      return v === '' || !isFinite(Number(v)) ? 'Bir eşik değer gir.' : '';
    }
    function buildTrigger() {
      if (TYPE === 'clickrun') return { type: 'manual' };
      if (S.trig === 'time') return { type: 'time', value: timeValue(), repeat: S.repeat };
      if (S.trig === 'device') return { type: 'device', value: S.device.key, label: S.device.name, event: S.event };
      if (S.trig === 'sensor') return { type: 'sensor', value: S.sensor.key, label: S.sensor.name, event: 'active' };
      return { type: 'weather', metric: S.weather.metric, op: S.weather.op, value: Number(S.weather.value), label: 'weather' };
    }
    function finish() {
      location.href = 'nexus-smart.html?tab=' + (TYPE === 'clickrun' ? 'tab-clickrun' : 'tab-automation');
    }
    function save() {
      var p = problem();
      if (p) { toast(p, 'error'); return; }
      var sceneId = S.scene === 'notify' ? null : S.scene;
      var title = (S.name || '').trim() || suggestedName();
      var m = sceneId ? QS.metaFor(sceneId) : null;
      if (editing) {
        updateItemById('nexusCustomClickRun', editing.id, {
          title: title, sceneId: sceneId || undefined, desc: m ? m.desc : editing.desc,
          icon: m ? m.icon : editing.icon, bgClass: m ? m.bg : editing.bgClass, colorClass: m ? m.color : editing.colorClass,
        });
        return finish();
      }
      var desc = TYPE === 'automation' ? (triggerSummary() + (sceneId ? ' · ' + NX.SCENES[sceneId].title : ' · bildirim')) : (m ? m.desc : '');
      QS.save(TYPE, sceneId, {
        title: title, desc: desc, trigger: buildTrigger(),
        icon: sceneId ? undefined : 'bell-ring',
      });
      finish();
    }

    // ---------- Çizim ----------
    function render() {
      var h = '';
      var title = document.getElementById('page-title');
      if (TYPE === 'clickrun') {
        title.textContent = editing ? 'Eylem seç' : 'Yeni senaryo';
        h += '<div class="qs-title-block"><h2>' + (editing ? esc(editing.title) : 'Tıkla ve çalıştır') + '</h2><p>Tek dokunuşla eşleşmiş cihazlarında çalışacak bir senaryo seç.</p></div>';
        h += sceneSection(1, false) + nameSection(2);
      } else {
        title.textContent = 'Yeni otomasyon';
        h += '<div class="qs-title-block"><h2>Yeni otomasyon</h2><p>Bir tetikleyici ve cihazlarında çalışacak senaryoyu seç.</p></div>';
        h += suggestionSection() + triggerSection() + sceneSection(2, true) + nameSection(3);
      }
      var scrollY = window.scrollY;
      root.innerHTML = h;
      window.scrollTo(0, scrollY);
      icons();
      refreshSave();
    }
    function refreshSave() {
      var p = problem();
      saveBtn.disabled = !!p;
      hintEl.textContent = p;
      document.getElementById('qs-save-text').textContent = editing ? 'Eylemi kaydet' : (TYPE === 'clickrun' ? 'Senaryoyu kaydet' : 'Otomasyonu kaydet');
      var nm = document.getElementById('qs-name');
      if (nm && !S.nameTouched) nm.placeholder = suggestedName();
    }

    root.addEventListener('click', function (ev) {
      var t = ev.target.closest('button');
      if (!t || t.disabled) return;
      if (t.hasAttribute('data-scene')) { S.scene = t.getAttribute('data-scene'); if (!S.nameTouched) S.name = ''; return render(); }
      if (t.hasAttribute('data-trig')) { S.trig = t.getAttribute('data-trig'); return render(); }
      if (t.hasAttribute('data-time')) {
        var v = t.getAttribute('data-time');
        if (v === 'custom') S.timeMode = 'custom'; else { S.timeMode = 'preset'; S.time = v; }
        return render();
      }
      if (t.hasAttribute('data-repeat')) { S.repeat = t.getAttribute('data-repeat'); return render(); }
      if (t.hasAttribute('data-device')) { S.device = { key: t.getAttribute('data-device'), name: t.getAttribute('data-name') }; return render(); }
      if (t.hasAttribute('data-event')) { S.event = t.getAttribute('data-event'); return render(); }
      if (t.hasAttribute('data-sensor')) { S.sensor = { key: t.getAttribute('data-sensor'), name: t.getAttribute('data-name') }; return render(); }
      if (t.hasAttribute('data-metric')) { S.weather.metric = t.getAttribute('data-metric'); return render(); }
      if (t.hasAttribute('data-op')) { S.weather.op = t.getAttribute('data-op'); return render(); }
      if (t.hasAttribute('data-sugg')) {
        var s = QS.available().filter(function (x) { return x.id === t.getAttribute('data-sugg'); })[0];
        if (!s || !s.time) return;
        QS.save('automation', s.id, { title: s.title, desc: s.time.label + ' · ' + s.title, trigger: { type: 'time', value: s.time.value, repeat: s.time.repeat } });
        return finish();
      }
    });
    root.addEventListener('input', function (ev) {
      var el = ev.target;
      if (el.id === 'qs-name') { S.name = el.value; S.nameTouched = true; }
      else if (el.id === 'qs-time') { S.customTime = el.value || S.customTime; }
      else if (el.id === 'qs-wval') { S.weather.value = el.value; }
      refreshSave();
    });
    saveBtn.addEventListener('click', save);

    if (!QS || !window.NX) { root.innerHTML = '<div class="qs-note">Senaryolar yüklenemedi. Sayfayı yenile.</div>'; return; }
    render();
  })();
  </script>
</body>

</html>
