<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://js.whop.com https://*.whop.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' data: blob: https: http: ws: wss:; media-src 'self' data: blob: https: http:; frame-src 'self' https://*.whop.com https://js.whop.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.whop.com"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" />
    <title>NEXUS - Cihaz</title>
    <link href="css/tailwind.css" rel="stylesheet" />
    <link href="css/nexus-ui.css" rel="stylesheet" />
    <link href="css/nexus-controls.css" rel="stylesheet" />
    <link href="fonts/inter/inter.css" rel="stylesheet" />

    <script src="auth.js"></script>
    <script src="theme.js"></script>
    <script src="cloud-config.js"></script>
    <script src="cloud-sync.js"></script>
    <script src="supported-devices.js"></script>
    <script src="lan-connectors.js"></script>
    <script src="device-controls.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        min-height: 100dvh;
        background: linear-gradient(180deg, #ece9fd 0%, #ddd8fb 100%);
        color: #111827;
        -webkit-tap-highlight-color: transparent;
      }
      html.dark body {
        background: linear-gradient(180deg, #0f172a 0%, #111827 55%, #020617 100%);
        color: #f8fafc;
      }
      .nx-pick {
        width: 100%;
        margin-top: 8px;
        padding: 12px 14px;
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        background: #ffffff;
        color: #111827;
        font: inherit;
        font-weight: 600;
      }
      html.dark .nx-pick {
        background: #1e293b;
        color: #f8fafc;
        border-color: rgba(148, 163, 184, 0.3);
      }
      .nx-info { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
      .nx-info.hidden { display: none; }
      .nx-info-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.45); }
      .nx-info-panel {
        position: relative; width: 100%; max-width: 520px; max-height: 86vh; overflow-y: auto;
        border-radius: 28px 28px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
        background: #ffffff; color: #111827; box-shadow: 0 -18px 50px rgba(15, 23, 42, 0.25);
        animation: nx-info-in 0.22s ease both;
      }
      html.dark .nx-info-panel { background: #1e293b; color: #f8fafc; }
      @keyframes nx-info-in { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .nx-info-panel { animation: none; } }
      @media (min-width: 700px) { .nx-info { align-items: center; } .nx-info-panel { border-radius: 28px; } .nx-info-panel .nx-sheet-grab { display: none; } }
      .nx-info-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .nx-info-head .ico { display: inline-flex; width: 20px; height: 20px; color: var(--nx-accent,#4C7DFF); }
      html.dark .nx-info-head .ico { color: #8fb0ff; }
      .nx-info-head .ico svg { width: 20px; height: 20px; }
      .nx-info-head h2 { margin: 0; flex: 1; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
      .nx-info-head .close { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; color: #64748b; }
      .nx-info-head .close svg { width: 18px; height: 18px; }
      .nx-info-head .close:hover { background: rgba(148, 163, 184, 0.18); }
      .nx-hero-photo { cursor: pointer; }
      .nx-hero-photo:focus-visible { outline: 2px solid #4c7dff; outline-offset: 4px; border-radius: 12px; }
    </style>
  </head>
  <body>
    <div class="w-full min-h-screen flex flex-col overflow-x-hidden">
      <header class="shrink-0 pt-14 pb-4 px-5 flex items-center justify-between gap-3">
        <a
          href="javascript:void(0)"
          onclick="goBack()"
          aria-label="Geri"
          class="p-1 -ml-1 shrink-0"
        >
          <i data-lucide="chevron-left" class="text-[28px] text-slate-700 dark:text-slate-200"></i>
        </a>
        <h1 id="device-title" class="text-lg font-bold tracking-tight truncate text-center flex-1">
          Cihaz
        </h1>
        <button
          type="button"
          id="info-btn"
          onclick="openInfo()"
          aria-haspopup="dialog"
          aria-label="Cihaz bilgileri ve ayarlar"
          class="p-1 -mr-1 shrink-0"
        >
          <i data-lucide="settings" class="text-xl text-slate-700 dark:text-slate-200"></i>
        </button>
      </header>

      <main id="device-main" class="flex-1 px-5 pb-[128px] space-y-4"></main>
      <div id="device-actionbar" class="nx-actionbar hidden"></div>
    </div>

    <!-- Cihaz bilgileri: özelliklerin arasına karışmaz, dişli düğmesiyle açılan pencerede durur -->
    <div id="info-sheet" class="nx-info modal hidden" role="dialog" aria-modal="true" aria-labelledby="info-title">
      <div class="nx-info-backdrop" onclick="closeInfo()"></div>
      <div class="nx-info-panel" data-nx-sheet>
        <div class="nx-sheet-grab" style="width:44px;height:5px;border-radius:9999px;background:rgba(148,163,184,.55);margin:0 auto 12px"></div>
        <div class="nx-info-head">
          <span class="ico" aria-hidden="true"><i data-lucide="info"></i></span>
          <h2 id="info-title">Cihaz bilgileri</h2>
          <button type="button" class="close" onclick="closeInfo()" aria-label="Kapat"><i data-lucide="x"></i></button>
        </div>
        <div id="info-body"></div>
      </div>
    </div>

    <script src="js/lucide.js"></script>
    <script data-purpose="device-control-screen">
      var params = new URLSearchParams(location.search);
      var INDEX = parseInt(params.get("i"), 10);
      var esc = NX.escapeHtml;
      var confirmRemove = false;
      var renaming = false;

      function goBack() {
        // Önceki sayfaya dön (masaüstü uygulamasında referrer boş olduğundan referrer'a bakmıyoruz); geçmiş yoksa ana sayfa.
        if (history.length > 1) history.back();
        else location.href = "nexus-home.html";
      }

      function current() {
        var devices = NX.readDevices();
        return isFinite(INDEX) && devices[INDEX] ? devices[INDEX] : null;
      }

      function q(v) {
        return "'" + String(v).replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "'";
      }
      function icon(name, cls) {
        return '<i data-lucide="' + name + '" class="' + (cls || "w-5 h-5") + '"></i>';
      }

      // ---------- ortak parçalar ----------
      function card(title, inner, sub) {
        return (
          '<section class="nx-card">' +
          (title
            ? '<div class="flex items-baseline justify-between gap-3 mb-1"><h2 class="nx-h">' +
              esc(title) +
              "</h2>" +
              (sub ? '<span class="nx-sub">' + sub + "</span>" : "") +
              "</div>"
            : "") +
          inner +
          "</section>"
        );
      }

      function seg(field, options, current, label) {
        return (
          '<div class="nx-seg mt-2" role="group" aria-label="' +
          esc(label) +
          '">' +
          options
            .map(function (o) {
              return (
                '<button type="button" aria-pressed="' +
                (String(current) === String(o[0])) +
                '" onclick="set(' +
                q(field) +
                ", " +
                (typeof o[0] === "number" ? o[0] : q(o[0])) +
                ')">' +
                esc(o[1]) +
                "</button>"
              );
            })
            .join("") +
          "</div>"
        );
      }

      // Uzun listeler (efekt, sahne) için seçim kutusu; liste cihazın kendi bildirdiği adlardan gelir
      function pick(field, list, current, label) {
        return (
          '<select class="nx-pick" aria-label="' +
          esc(label) +
          '" onchange="if(this.value!==\'\')set(' +
          q(field) +
          ', this.value)"><option value="">Seç…</option>' +
          list
            .map(function (o) {
              return (
                '<option value="' +
                esc(String(o[0])) +
                '"' +
                (String(current) === String(o[0]) ? " selected" : "") +
                ">" +
                esc(String(o[1])) +
                "</option>"
              );
            })
            .join("") +
          "</select>"
        );
      }

      function toggleRow(field, on, title, desc) {
        return (
          '<div class="nx-row"><div class="min-w-0"><p class="t">' +
          esc(title) +
          "</p>" +
          (desc ? '<p class="d">' + esc(desc) + "</p>" : "") +
          "</div>" +
          '<button type="button" role="switch" aria-checked="' +
          on +
          '" aria-label="' +
          esc(title) +
          '" class="nx-switch" onclick="set(' +
          q(field) +
          ", " +
          !on +
          ')"><b></b></button></div>'
        );
      }

      function bigRange(field, value, title, iconName, unit) {
        return (
          '<div class="nx-big"><input type="range" min="0" max="100" step="1" value="' +
          value +
          '" style="--fill:' +
          value +
          '%" aria-label="' +
          esc(title) +
          '" ' +
          'oninput="previewBig(this)" onchange="set(' +
          q(field) +
          ', Number(this.value))">' +
          '<div class="lbl">' +
          icon(iconName) +
          '<span class="val' +
          (value > 86 ? " on-fill" : "") +
          '" data-unit="' +
          unit +
          '">' +
          value +
          unit +
          "</span></div></div>"
        );
      }

      function previewBig(input) {
        input.style.setProperty("--fill", input.value + "%");
        var val = input.parentNode.querySelector(".val");
        if (val) {
          val.textContent = input.value + val.getAttribute("data-unit");
          val.classList.toggle("on-fill", input.value > 86);
        }
      }

      function readings(list) {
        var any = list.some(function (r) {
          return typeof r[1] === "number" && isFinite(r[1]);
        });
        if (!any)
          return (
            '<p class="nx-wait">' +
            icon("activity", "w-4 h-4") +
            "Cihazdan ölçüm verisi bekleniyor</p>"
          );
        return (
          '<div class="grid grid-cols-' +
          Math.min(list.length, 3) +
          ' gap-2 mt-3">' +
          list
            .map(function (r) {
              var ok = typeof r[1] === "number" && isFinite(r[1]);
              return (
                '<div class="nx-tile"><p class="nx-label">' +
                esc(r[0]) +
                '</p><p class="v mt-0.5">' +
                (ok
                  ? r[2] === "°"
                    ? NX.fmtTemp(r[1])
                    : r[1].toLocaleString(window.nexusLocale || "tr-TR") + r[2]
                  : "—") +
                "</p></div>"
              );
            })
            .join("") +
          "</div>"
        );
      }

      function links(list) {
        return card(
          "Kısayollar",
          '<div class="nx-links mt-2">' +
            list
              .map(function (l) {
                return (
                  '<a class="nx-link" href="' +
                  l[0] +
                  '">' +
                  icon(l[2], "w-5 h-5") +
                  "<span>" +
                  esc(l[1]) +
                  "</span>" +
                  icon("chevron-right", "w-4 h-4 chev") +
                  "</a>"
                );
              })
              .join("") +
            "</div>",
        );
      }

      function dial(value, min, max, on, caption) {
        var r = 94,
          C = 2 * Math.PI * r,
          arc = C * 0.75;
        var frac = (value - min) / (max - min);
        return (
          '<div class="nx-dial' +
          (on ? "" : " is-off") +
          '"><svg viewBox="0 0 224 224" aria-hidden="true">' +
          '<circle class="track" cx="112" cy="112" r="' +
          r +
          '" fill="none" stroke-width="16" stroke-linecap="round" stroke-dasharray="' +
          arc +
          " " +
          C +
          '" transform="rotate(135 112 112)"/>' +
          '<circle class="value" cx="112" cy="112" r="' +
          r +
          '" fill="none" stroke-width="16" stroke-linecap="round" stroke-dasharray="' +
          Math.max(0.01, arc * frac) +
          " " +
          C +
          '" transform="rotate(135 112 112)"/>' +
          '</svg><div class="center"><p class="nx-sub font-semibold">' +
          esc(caption) +
          '</p><p class="temp mt-1" aria-live="polite">' +
          NX.fmtTemp(value) +
          "</p></div></div>" +
          '<div class="relative z-10 flex items-center justify-center gap-6 -mt-6">' +
          '<button type="button" class="nx-step" aria-label="Sıcaklığı azalt" ' +
          (value <= min ? "disabled " : "") +
          "onclick=\"set('target', " +
          (value - 0.5) +
          ')">' +
          icon("minus") +
          "</button>" +
          '<span class="nx-sub w-20 text-center">' +
          NX.tempNum(min) +
          "–" +
          NX.tempNum(max) +
          NX.tempSymbol() +
          "</span>" +
          '<button type="button" class="nx-step" aria-label="Sıcaklığı artır" ' +
          (value >= max ? "disabled " : "") +
          "onclick=\"set('target', " +
          (value + 0.5) +
          ')">' +
          icon("plus") +
          "</button></div>"
        );
      }

      function hero(device, extraClass, halo) {
        var status = NX.statusOf(device, INDEX);
        return (
          '<section class="nx-card">' +
          '<div class="flex items-center justify-between gap-2">' +
          '<span class="nx-badge ' +
          status.badge +
          '">' +
          esc(status.text) +
          "</span>" +
          (device.room
            ? '<span class="nx-sub truncate flex items-center gap-1">' +
              icon("map-pin", "w-3.5 h-3.5") +
              esc(device.room) +
              "</span>"
            : "") +
          "</div>" +
          '<div class="nx-hero ' +
          (extraClass || "") +
          '"' +
          (halo ? ' style="--halo:' + halo + '"' : "") +
          '><div class="halo"></div>' +
          '<img src="' +
          NX.imageUrl(device) +
          '" alt="' +
          esc(device.name) +
          '" decoding="async"' +
          (device.id == null
            ? ""
            : ' class="nx-hero-photo" role="button" tabindex="0" aria-label="' +
              (NX.photoOf(device) ? "Fotoğrafı değiştir" : "Fotoğraf ekle") +
              '" onclick="openPhotoFlow()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openPhotoFlow();}"') +
          "></div></section>"
        );
      }

      // Ürün görseline dokunma: bilgi sayfasındaki "Cihaz fotoğrafı" satırını açar (ekle / değiştir / kaldır)
      function openPhotoFlow() {
        openInfo();
        var b = document.querySelector("#info-body #photo-input + button");
        if (b) b.focus();
      }

      // ---------- şablonlar: aynı işlevi gören cihazlar aynı ekranı paylaşır ----------
      var COLORS = [
        ["#FFB45C", "Sıcak beyaz"],
        ["#FFFFFF", "Beyaz"],
        ["#4C7DFF", "Mavi"],
        ["#22C55E", "Yeşil"],
        ["#EF4444", "Kırmızı"],
        ["#A855F7", "Mor"],
      ];
      var TONE_HALO = {
        warm: "rgba(255,180,92,.45)",
        neutral: "rgba(255,236,200,.45)",
        cool: "rgba(186,214,255,.55)",
      };

      var T = {};
      var DEV = null;
      function F(name) {
        return NX.hasFeature(DEV, name);
      }
      function cards() {
        return Array.prototype.join.call(arguments, "");
      }
      function when(cond, html) {
        return cond ? html : "";
      }

      function presetsCard(st) {
        return card(
          "Hazır ayarlar",
          '<div class="nx-modes" style="grid-template-columns:repeat(3,minmax(0,1fr))">' +
            preset("Okuma", "book-open", { brightness: 100, tone: "cool", color: "#FFFFFF" }) +
            preset("Dinlenme", "sofa", { brightness: 45, tone: "warm", color: "#FFB45C" }) +
            preset("Gece", "moon", { brightness: 10, tone: "warm", color: "#FFB45C" }) +
            "</div>",
        );
      }

      T.light = function (d, st) {
        var on = st.switch === true;
        var halo = F("color") ? hexA(st.color || "#FFB45C", 0.45) : TONE_HALO[st.tone || "neutral"];
        return {
          html: cards(
            hero(d, on ? "is-on" : "is-off", halo),
            when(
              F("brightness"),
              card(
                "Parlaklık",
                bigRange(
                  "brightness",
                  NX.clamp(st.brightness, 0, 100, 60),
                  "Parlaklık",
                  "sun",
                  "%",
                ),
              ),
            ),
            when(
              F("color"),
              card(
                "Renk",
                '<div class="nx-swatches" role="group" aria-label="Renk">' +
                  COLORS.map(function (c) {
                    return (
                      '<button type="button" class="nx-swatch" style="background:' +
                      c[0] +
                      '" aria-pressed="' +
                      ((st.color || "#FFB45C").toUpperCase() === c[0]) +
                      '" aria-label="' +
                      c[1] +
                      "\" onclick=\"set('color', " +
                      q(c[0]) +
                      ')"></button>'
                    );
                  }).join("") +
                  "</div>",
              ),
            ),
            when(
              F("colorTemp"),
              card(
                "Işık tonu",
                seg(
                  "tone",
                  [
                    ["warm", "Sıcak"],
                    ["neutral", "Doğal"],
                    ["cool", "Soğuk"],
                  ],
                  st.tone || "neutral",
                  "Işık tonu",
                ),
              ),
            ),
            when(F("presets"), presetsCard(st)),
            when(
              F("lightScene"),
              card(
                "Sahne",
                pick(
                  "lightScene",
                  (DEV.options && DEV.options.scenes) || [],
                  st.lightScene || "",
                  "Sahne",
                ),
                DEV.protocol === "hue" ? "Sahnedeki tüm ışıklar değişir" : "",
              ),
            ),
            when(
              F("effect"),
              card(
                "Efekt",
                pick(
                  "effect",
                  ((DEV.options && DEV.options.effects) || []).map(function (e) {
                    return [e, e];
                  }),
                  st.effect || "",
                  "Efekt",
                ),
              ),
            ),
            links([
              ["nexus-lighting-master.html", "Aydınlatma Ustası", "lamp"],
              ["nexus-program.html", "Program ekle", "calendar-clock"],
            ]),
          ),
          action: F("power") ? powerAction(on) : null,
        };
      };

      function preset(name, ic, values) {
        return (
          '<button type="button" class="nx-mode" aria-pressed="false" onclick=\'set("preset", ' +
          JSON.stringify(values) +
          ")'>" +
          icon(ic) +
          name +
          "</button>"
        );
      }

      function hexA(hex, a) {
        var n = parseInt(String(hex).replace("#", ""), 16);
        if (!isFinite(n)) return "rgba(var(--nx-accent-rgbc,76,125,255)," + a + ")";
        return (
          "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"
        );
      }

      function round(label, ic, onclick, pressed) {
        return (
          '<button type="button" class="nx-round" aria-pressed="' +
          !!pressed +
          '" onclick="' +
          onclick +
          '"><span class="c">' +
          icon(ic, "w-6 h-6") +
          "</span>" +
          esc(label) +
          "</button>"
        );
      }

      T.cover = function (d, st) {
        var pos = NX.clamp(st.position, 0, 100, 0);
        var w = Math.max(7, (100 - pos) / 2);
        return {
          html: cards(
            hero(d),
            card(
              "Kontrol",
              when(
                F("position"),
                '<div class="nx-window" aria-hidden="true"><div class="rail"></div><div class="panel l" style="width:' +
                  w +
                  '%"></div><div class="panel r" style="width:' +
                  w +
                  '%"></div></div>',
              ) +
                '<div class="nx-round-row mt-4">' +
                round("Aç", "chevrons-up", "set('coverAction','open')", pos === 100) +
                when(F("coverStop"), round("Durdur", "pause", "set('coverAction','stop')", false)) +
                round("Kapat", "chevrons-down", "set('coverAction','close')", pos === 0) +
                "</div>" +
                when(
                  F("position"),
                  '<p class="nx-label mt-4">Açıklık</p>' +
                    bigRange("position", pos, "Açıklık", "blinds", "%"),
                ) +
                when(
                  F("tilt"),
                  '<p class="nx-label mt-4">Panjur eğimi</p>' +
                    bigRange("tilt", NX.clamp(st.tilt, 0, 100, 0), "Panjur eğimi", "blinds", "%"),
                ),
            ),
            links([
              ["nexus-program.html", "Program ekle", "calendar-clock"],
              ["nexus-good-morning.html", "Günaydın senaryosu", "sunrise"],
            ]),
          ),
        };
      };

      // İklim paneli: klima, kombi, ısıtıcı, termostat, vantilatör ve sıcaklık sensörleri aynı ekranı kullanır.
      // Hangi bölümün görüneceğini cihazın özellikleri belirler.
      T.climate = function (d, st) {
        var on = F("power") ? st.switch === true : true;
        var thermo = NX.kindOf(d) === "thermostat";
        var min = thermo ? 5 : 16,
          max = 30;
        var t = NX.clamp(st.target, min, max, thermo ? 21 : 22);
        var r = [];
        if (F("readTemp"))
          r.push([F("target") ? "Oda sıcaklığı" : "Sıcaklık", st.temperature, "°"]);
        if (F("readHumidity")) r.push(["Nem", st.humidity, "%"]);
        var toggles =
          when(
            F("swing"),
            toggleRow("swing", st.swing === true, "Salınım", "Yön kanatları / gövde hareket eder"),
          ) +
          when(
            F("sleep"),
            toggleRow(
              "sleep",
              st.sleep === true,
              "Uyku modu",
              "Gece boyunca sıcaklığı yavaşça ayarlar",
            ),
          );
        return {
          top: hero(d, F("power") ? (on ? "is-on" : "is-off") : ""),
          html: cards(
            when(F("target"), card("", dial(t, min, max, on, on ? "Hedef sıcaklık" : "Kapalı"))),
            when(r.length, card("Ölçümler", readings(r))),
            when(

          sonoff: "Sonoff (DIY mode)",
          wiz: "WiZ",
          lifx: "LIFX",
          govee: "Govee (LAN)",
          "tuya-local": "Tuya (local)",
          wol: "Wake-on-LAN",
        };
        function reportRow(d) {
          if (!lan) return "";
          var q = "template=device_report.yml";
          var brand = String(d.brand || d.protocol || "");
          if (brand) q += "&device=" + encodeURIComponent(brand + " ");
          if (CONNECTOR_LABELS[d.protocol])
            q += "&connector=" + encodeURIComponent(CONNECTOR_LABELS[d.protocol]);
          if (window.NEXUS_APP_VERSION) q += "&version=" + encodeURIComponent(window.NEXUS_APP_VERSION);
          return (
            '<a class="nx-row" href="https://github.com/Enard52/NEXUS/issues/new?' +
            q +
            '" target="_blank" rel="noopener noreferrer"><div class="min-w-0"><p class="t">Bu cihaz sende çalıştı mı? Rapor et</p>' +
            '<p class="d">GitHub\'da boş bir form açar; uygulamadan hiçbir bilgi kendiliğinden gönderilmez.</p></div>' +
            icon("external-link", "w-4 h-4 text-slate-400") +
            "</a>"
          );
        }

        var hasPhoto = !!NX.photoOf(d);
        var photoRow =
          d.id == null
            ? ""
            : '<div class="nx-row"><div class="min-w-0"><p class="d">Cihaz fotoğrafı</p>' +
              '<p class="t">Yalnızca bu cihazda saklanır; hiçbir yere yüklenmez.</p>' +
              (photoMsg
                ? '<p class="nx-danger text-sm mt-1" role="alert">' + esc(photoMsg) + "</p>"
                : "") +
              "</div>" +
              '<div class="flex gap-2 shrink-0">' +
              '<input id="photo-input" type="file" accept="image/*" class="hidden" onchange="onPhotoPicked(this)">' +
              '<button type="button" class="nx-btn" onclick="document.getElementById(\'photo-input\').click()">' +
              (hasPhoto ? "Fotoğrafı değiştir" : "Fotoğraf ekle") +
              "</button>" +
              (hasPhoto
                ? '<button type="button" class="nx-btn" onclick="removePhoto()">Fotoğrafı kaldır</button>'
                : "") +
              "</div></div>";
        return (
          nameRow +
          photoRow +
          '<div class="nx-row"><div><p class="d">Oda</p><p class="t">' +
          esc(d.room || "Seçilmedi") +
          "</p></div></div>" +
          '<div class="nx-row"><div><p class="d">Bağlantı</p><p class="t truncate">' +
          esc(conn) +
          "</p></div></div>" +
          '<div class="nx-row"><div class="min-w-0"><p class="d">Fabrika sıfırlama</p><p class="t">' +
          esc(resetHint(d)) +
          "</p></div></div>" +
          reportRow(d) +
          remove
        );
      }

      function infoOpen() {
        return !document.getElementById("info-sheet").classList.contains("hidden");
      }
      function fillInfo() {
        var d = current();
        if (!d) return;
        document.getElementById("info-body").innerHTML = infoRows(d);
        if (typeof lucide !== "undefined") lucide.createIcons();
      }
      function openInfo() {
        fillInfo();
        document.getElementById("info-sheet").classList.remove("hidden");
        var c = document.querySelector("#info-sheet .close");
        if (c) c.focus();
      }
      function closeInfo() {
        renaming = false;
        confirmRemove = false;
        photoMsg = "";
        document.getElementById("info-sheet").classList.add("hidden");
        var b = document.getElementById("info-btn");
        if (b) b.focus();
      }
      // Esc ve Android geri tuşu theme.js'te ".modal:not(.hidden)" içindeki ilk "close" düğmesini tıklar
      // (arka plan → closeInfo); burada ayrıca dinlemek geri gitmeyi tetikleyip sayfadan çıkarırdı.

      function startRename() {
        renaming = true;
        render();
        var i = document.getElementById("rename-input");
        if (i) {
          i.focus();
          i.select();
        }
      }
      function saveName() {
        var i = document.getElementById("rename-input");
        if (i) NX.renameDevice(INDEX, i.value);
        renaming = false;
        render();
      }
      var photoMsg = "";
      function onPhotoPicked(input) {
        var file = input.files && input.files[0];
        var d = current();
        if (!file || !d) return;
        NX.photoFromFile(file).then(
          function (dataUrl) {
            photoMsg = NX.setPhoto(d, dataUrl)
              ? ""
              : "Fotoğraf kaydedilemedi; cihaz depolaması dolu olabilir.";
            render();
          },
          function (err) {
            photoMsg =
              err && err.message === "type"
                ? "Seçilen dosya bir resim değil."
                : err && err.message === "size"
                  ? "Fotoğraf çok büyük kaldı; daha küçük bir resim dene."
                  : "Fotoğraf okunamadı; başka bir dosya dene.";
            fillInfo();
          },
        );
      }
      function removePhoto() {
        var d = current();
        photoMsg = d && NX.setPhoto(d, null) ? "" : "Fotoğraf kaldırılamadı.";
        render();
      }
      function askRemove() {
        confirmRemove = true;
        render();
      }
      function cancelRemove() {
        confirmRemove = false;
        render();
      }
      function doRemove() {
        NX.removeDevice(INDEX);
        location.replace("nexus-home.html");
      }

      function set(field, value) {
        NX.setField(INDEX, field, value);
        render();
      }
      function feed() {
        set(
          "lastFed",
          new Date().toLocaleTimeString(window.nexusLocale || "tr-TR", {
            hour: "2-digit",
            minute: "2-digit",
          }),
        );
      }

      function render() {
        var main = document.getElementById("device-main");
        var bar = document.getElementById("device-actionbar");
        var d = current();
        if (!d) {
          document.getElementById("device-title").textContent = "Cihaz";
          main.innerHTML =
            '<div class="nx-empty mt-10"><p class="text-base font-bold">Cihaz bulunamadı</p>' +
            '<p class="text-sm text-slate-500 mt-1 dark:text-slate-300">Kaldırılmış ya da başka bir hesapta olabilir.</p>' +
            '<a href="nexus-home.html" class="nx-empty__cta">Ana sayfaya dön</a></div>';
          bar.classList.add("hidden");
          if (typeof lucide !== "undefined") lucide.createIcons();
          return;
        }
        document.getElementById("device-title").textContent = d.name;
        document.title = "NEXUS - " + d.name;
        var kind = NX.screenOf(d);
        DEV = d;
        var view = (T[kind] || T.onoff)(d, NX.stateOf(d));
        main.setAttribute("data-features", NX.featuresOf(d).join(" "));
        main.setAttribute("data-kind", kind);
        var unlinked = !NX.isLan(d)
          ? '<p class="nx-wait">' +
            icon("info", "w-4 h-4") +
            "Bu cihaz yerel ağ üzerinden bağlı değil; komutlar cihaza gönderilmez, bu yüzden kontrol seçenekleri gösterilmiyor." +
            "</p>"
          : "";
        main.innerHTML =
          unlinked +
          (NX.LAN_ERRORS[INDEX]
            ? '<p class="nx-wait" style="color:#e11d48">' +
              icon("wifi-off", "w-4 h-4") +
              esc(NX.LAN_ERRORS[INDEX]) +
              "</p>"
            : "") +
          (view.top || "") +
          view.html;
        if (infoOpen()) fillInfo();
        // Masaüstünde ilk kart (cihaz görseli) sol sütunda sabit durur ve ana eylem onun altına taşınır
        var lead = main.querySelector(".nx-hero")
          ? main.querySelector(".nx-hero").closest("section")
          : null;
        if (lead) {
          lead.classList.add("nx-desk-lead");
          if (view.action) {
            lead.insertAdjacentHTML(
              "beforeend",
              '<button type="button" class="nx-lead-action' +
                (view.action.alt ? " alt" : "") +
                '" onclick="' +
                view.action.onclick +
                '">' +
                icon(view.action.icon) +
                esc(view.action.label) +
                "</button>",
            );
          }
        }
        if (view.action) {
          bar.innerHTML =
            '<button type="button" class="' +
            (view.action.alt ? "alt" : "") +
            '" onclick="' +
            view.action.onclick +
            '">' +
            icon(view.action.icon) +
            esc(view.action.label) +
            "</button>";
          bar.classList.remove("hidden");
        } else {
          bar.classList.add("hidden");
          bar.innerHTML = "";
        }
        if (typeof lucide !== "undefined") lucide.createIcons();
      }

      NX.onError(function (i) {
        if (i === INDEX) render();
      });
      // Yerel ağ cihazıysa gerçek durumu cihazdan oku
      if (isFinite(INDEX)) NX.refreshFromDevice(INDEX);
      if (typeof lucide !== "undefined") lucide.createIcons();
      render();
      window.addEventListener("pageshow", render);
    </script>
  </body>
</html>
