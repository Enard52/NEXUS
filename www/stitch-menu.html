<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>NEXUS — Menü</title>
<!-- Tailwind CSS CDN -->
<link href="css/tailwind.css" rel="stylesheet"/><link href="css/nexus-ui.css" rel="stylesheet"/>
<!-- Google Fonts for modern sans-serif look -->
<link href="fonts/inter/inter.css" rel="stylesheet"/>
  <style data-purpose="custom-typography">
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f9f9fb;
    }
  </style>
<style data-purpose="custom-colors-gradients">
    /* NEXUS brand gradients (purple -> cyan) */
    .gradient-progress {
      background: linear-gradient(90deg, #4C7DFF 0%, #22D3EE 100%);
    }
    .gradient-button {
      background: linear-gradient(135deg, #4C7DFF 0%, #22D3EE 100%);
    }
    .soft-shadow {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
  </style>
<script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'text-primary': '#111827',
            'text-secondary': '#6b7280',
            'bg-main': '#f9f9fb',
          }
        }
      }
    }
  </script>
<style>
    body {
      min-height: 100dvh;
    }
  </style>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
<script src="data.js"></script>
<script src="ai-fab.js"></script>
</head>
<body class="bg-bg-main min-h-screen">
<!-- BEGIN: MainContainer -->
<main class="max-w-md mx-auto px-6 flex flex-col gap-8 pt-12 pb-8">
<!-- BEGIN: TopNavigation -->
<nav class="relative flex items-center justify-center mb-2 h-11" aria-label="Üst gezinme">
<a href="javascript:void(0)" onclick="window.history.length > 1 ? history.back() : window.location.href='stitch-home.html'" aria-label="Geri" class="absolute left-0 top-1/2 -translate-y-1/2 p-2 -ml-2" id="back-button">
<svg aria-hidden="true" class="h-7 w-7 text-slate-700" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<h1 class="text-lg font-bold tracking-tight text-text-primary">NEXUS AI</h1>
</nav>
<!-- END: TopNavigation -->
<!-- BEGIN: BenefitPointsCard -->
<section class="bg-white rounded-[2rem] p-6 max-[359px]:p-4 soft-shadow border border-gray-50" data-purpose="nexus-points-card">
<div class="flex justify-between items-center gap-2 mb-6">
<div class="min-w-0">
<h2 class="text-[16px] max-[359px]:text-[14px] sm:text-xl text-text-primary mb-1 font-extrabold leading-tight whitespace-nowrap tracking-tight">NEXUS AI Puanları</h2>
<p class="text-[13px] max-[359px]:text-[12px] sm:text-base text-text-secondary font-medium whitespace-nowrap" id="points-label">Günlük sıfırlama 30/30</p>
</div>
<a href="stitch-plus.html" class="gradient-button text-white px-4 max-[359px]:px-3 py-2.5 rounded-full text-[13px] max-[359px]:text-xs sm:text-sm font-semibold shadow-md active:scale-95 transition-transform flex-shrink-0 whitespace-nowrap">
          Daha fazla al
        </a>
</div>
<!-- Progress Bar -->
<div class="w-full bg-gray-100 rounded-full overflow-hidden h-4">
<div class="gradient-progress h-full w-full rounded-full" id="points-bar"></div>
</div>
</section>
<!-- END: BenefitPointsCard -->
<!-- BEGIN: ChatHistorySection -->
<section data-purpose="chat-history">
<h2 class="text-xl text-text-primary mb-4 px-1 font-extrabold mt-4">Sohbet Geçmişi</h2>
<div class="flex flex-col gap-3" id="chat-history-list"></div>
</section>
<!-- END: ChatHistorySection -->
<!-- BEGIN: OtherSettingsSection -->
<section data-purpose="other-settings">
<h2 class="text-xl text-text-primary mb-4 px-1 font-extrabold mt-4">Diğer Ayarlar</h2>
<div class="flex flex-col gap-3">
<!-- Setting Item 1 -->
<a href="stitch-settings.html" class="bg-white p-5 rounded-2xl soft-shadow border border-gray-50 flex justify-between items-center cursor-pointer active:bg-gray-50 transition-colors">
<span class="text-lg font-medium text-text-primary">NEXUS AI Görünüm Modu</span>
<svg class="h-6 w-6 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Setting Item 2 -->
<a class="bg-white p-5 rounded-2xl soft-shadow border border-gray-50 flex justify-between items-center cursor-pointer active:bg-gray-50 transition-colors" href="stitch-feedback.html">
<span class="text-lg font-medium text-text-primary">Geri Bildirim ve Öneriler</span>
<svg class="h-6 w-6 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Setting Item 3 -->
<a class="hidden bg-white p-5 rounded-2xl soft-shadow border border-gray-50 flex justify-between items-center cursor-pointer active:bg-gray-50 transition-colors" href="stitch-web.html">
<span class="text-lg font-medium text-text-primary">NEXUS Web Sürümü</span>
<svg class="h-6 w-6 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
</div>
</section>
<!-- END: OtherSettingsSection -->
</main>
<!-- END: MainContainer -->
<script data-purpose="real-user-data">
  // Gerçek AI puan sayacı: nexusAiPoints {date, used} — gün değişince 30/30'a döner
  (function () {
    var LIMIT = 30;
    var raw = null;
    try { raw = JSON.parse(nexusGetItem('nexusAiPoints') || 'null'); } catch (e) {}
    var today = new Date().toISOString().slice(0, 10);
    var used = (raw && raw.date === today) ? raw.used : 0;
    var left = Math.max(0, LIMIT - used);
    document.getElementById('points-label').textContent = 'Günlük sıfırlama ' + left + '/' + LIMIT;
    document.getElementById('points-bar').style.width = Math.round((left / LIMIT) * 100) + '%';
  })();

  // Gerçek sohbet geçmişi: nexusChatHistory (son güncellenen üstte)
  (function () {
    var list = [];
    try { list = JSON.parse(nexusGetItem('nexusChatHistory') || '[]') || []; } catch (e) {}
    list = list.filter(function (c) { return c && c.messages && c.messages.length; });
    list.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
    var box = document.getElementById('chat-history-list');
    if (!list.length) {
      box.innerHTML = '<div class="bg-white p-6 rounded-2xl soft-shadow border border-gray-50 flex flex-col items-center text-center gap-2">' +
        '<svg class="h-8 w-8 text-gray-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M8 10h8M8 14h5M21 12a9 9 0 11-4.5-7.8L21 3l-1.2 4.5c.77 1.3 1.2 2.84 1.2 4.5z" stroke-linecap="round" stroke-linejoin="round"></path></svg>' +
        '<p class="text-base font-semibold text-text-primary">Henüz sohbet geçmişin yok</p>' +
        '<p class="text-sm text-text-secondary">Asistanla konuşmaya başladığında sohbetlerin burada listelenir.</p>' +
        '</div>';
      return;
    }
    var esc = function (s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    };
    box.innerHTML = list.map(function (c) {
      return '<a href="stitch-chat.html?chat=' + encodeURIComponent(c.id) + '" class="block bg-white p-5 rounded-2xl soft-shadow border border-gray-50 active:bg-gray-50 transition-colors">' +
        '<p class="text-lg font-medium text-text-primary truncate">' + esc(c.title || 'Sohbet') + '</p>' +
        '</a>';
    }).join('');
  })();
</script>
<script>
  (function () {
    var webLink = document.querySelector('a[href="stitch-web.html"]');
    if (webLink) {
      webLink.remove();
    }
  })();
</script>
</body></html>
