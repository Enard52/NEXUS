    // Arka planı beyaz olan resimleri şeffaf yapan akıllı fonksiyon
    function makeImagesTransparent() {
      const images = document.querySelectorAll('.product-tile img');
      images.forEach(img => {
        if (img.complete) {
          processImage(img);
        } else {
          img.addEventListener('load', () => processImage(img), { once: true });
        }
      });
    }

    function processImage(img) {
      if (img.dataset.processed) return;
      img.dataset.processed = 'true';

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = img.naturalWidth || img.width;
      canvas.height = img.naturalHeight || img.height;

      if (canvas.width === 0 || canvas.height === 0) return;

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      try {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        // Beyaz ve beyaza çok yakın renkleri şeffaf yap
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          if (r > 240 && g > 240 && b > 240) {
            data[i + 3] = 0; // Alpha kanalını 0 yap (tam şeffaf)
          } else if (r > 230 && g > 230 && b > 230) {
            // Yumuşak geçiş için yarı şeffaf (Anti-aliasing kenarları)
            data[i + 3] = 100;
          }
        }

        ctx.putImageData(imageData, 0, 0);
        img.src = canvas.toDataURL('image/png');
      } catch (e) {
        console.warn('CORS or canvas error on image:', e);
      }
    }

    // Katalog render edildikten sonra çalıştır
    const originalRenderCatalogContent = renderCatalogContent;
    renderCatalogContent = function() {
      originalRenderCatalogContent();
      setTimeout(makeImagesTransparent, 100);
    };

    // Sayfa yüklendiğinde mevcut resimler için de çalıştır
    window.addEventListener('load', () => {
      setTimeout(makeImagesTransparent, 200);
    });

  </script>

    // pair.html gibi eski baglantilardan gelen ?category anahtarlarini eslestir
    var CATALOG_ALIAS = {
      lighting: 'aydinlatma', plugs: 'elektrik-ustasi', security: 'kamera-ve-kilit', locks: 'kamera-ve-kilit',
      climate: 'buyuk-ev-aletleri', sensors: 'sensor', entertainment: 'eglence', appliances: 'buyuk-ev-aletleri',
      hubs: 'ag-gecidi-kontrol-paneli', cleaning: 'kucuk-ev-aleti', energy: 'enerji-tasarrufu'
    };

    var activeCatalogCategory = CATALOG[0].key;

    function escapeCatalogHtml(value) {
      return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function totalCatalogProducts() {
      var t = 0;
      CATALOG.forEach(function (c) { c.groups.forEach(function (g) { t += g.items.length; }); });
      return t;
    }

    function updateCatalogCount() {
      var el = document.getElementById('catalog-count');
      if (!el) return;
      el.textContent = totalCatalogProducts() + ' ürün • ' + CATALOG.length + ' kategori';
    }

    function catalogTileHtml(item) {
      var safe = escapeCatalogHtml(item.n);
      return '<div class="product-tile text-center active:scale-95 transition-transform cursor-pointer flex flex-col items-center group" onclick="simulateConnection(this, \'' + safe + '\')">' +
        '<div class="w-full aspect-square overflow-hidden mb-2 relative flex items-center justify-center bg-transparent">' +
        '<img src="assets/products/' + item.img + '" alt="' + safe + '" class="w-[86%] h-[86%] object-contain transition-transform duration-500 group-hover:scale-105" loading="lazy" />' +
        '</div>' +
        '<p class="text-[0.72rem] font-medium text-slate-700 leading-tight w-full px-0.5 dark:text-slate-200">' + safe + '</p>' +
        '</div>';
    }

    function catalogGroupHtml(title, items) {
      return '<div class="mb-9">' +
        '<p class="catalog-group-title">' + escapeCatalogHtml(title) + '</p>' +
        '<div class="grid grid-cols-3 gap-x-3 gap-y-6">' + items.map(catalogTileHtml).join('') + '</div>' +
        '</div>';
    }

    function renderCatalogRail() {
      var rail = document.getElementById('catalog-rail');
      if (!rail) return;
      rail.innerHTML = CATALOG.map(function (c) {
        var cls = c.key === activeCatalogCategory ? 'cat-btn cat-active' : 'cat-btn cat-inactive';
        return '<button type="button" onclick="selectCatalogCategory(\'' + c.key + '\')" class="' + cls + ' w-full text-left py-3.5 px-3">' +
          '<span class="cat-text text-[13px] block">' + escapeCatalogHtml(c.label) + '</span></button>';
      }).join('');
    }

    function renderCatalogContent() {
      var content = document.getElementById('catalog-content');
      if (!content) return;
      var query = ((document.getElementById('catalog-search') || {}).value || '').trim().toLowerCase();

      if (query) {
        var matches = [];
        CATALOG.forEach(function (c) {
          c.groups.forEach(function (g) {
            g.items.forEach(function (it) {
              if (it.n.toLowerCase().indexOf(query) !== -1) matches.push(it);
            });
          });
        });
        content.innerHTML = matches.length
          ? catalogGroupHtml('Arama Sonuçları', matches)
          : '<div class="px-6 py-16 text-center"><p class="text-sm font-medium text-slate-500 dark:text-slate-300">Aramanla eşleşen cihazı bulunamadı.</p></div>';
        content.scrollTop = 0;
        return;
      }

      var cat = CATALOG.filter(function (c) { return c.key === activeCatalogCategory; })[0] || CATALOG[0];
      content.innerHTML = cat.groups.map(function (g) { return catalogGroupHtml(g.title, g.items); }).join('');
      content.scrollTop = 0;
    }

    function selectCatalogCategory(key) {
      activeCatalogCategory = key;
      var searchEl = document.getElementById('catalog-search');
      if (searchEl) searchEl.value = '';
      renderCatalogRail();
      renderCatalogContent();
    }

    function openCodeModal() {
      window.location.href = 'stitch-setup-code.html';
    }

    function closeCodeModal() {
      const modal = document.getElementById('code-modal');
      const content = document.getElementById('code-modal-content');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
        document.getElementById('setup-code-input').value = '';
      }, 200);
    }

    function submitCode() {
      const input = document.getElementById('setup-code-input').value;
      if (input.length < 4) {
        alert('Lütfen geçerli bir kod girin.');
        return;
      }
      closeCodeModal();
      setTimeout(() => {
        window.location.href = 'stitch-setup-code.html';
      }, 150);
    }

    function simulateConnection(el, deviceName) {
      const overlay = document.getElementById('loading-overlay');
      overlay.style.display = 'flex';
      document.getElementById('loading-spinner').classList.remove('hidden');
      document.getElementById('loading-notfound').classList.add('hidden');
      document.getElementById('loading-notfound').classList.remove('flex');

      clearTimeout(simulateConnection._t);
      simulateConnection._t = setTimeout(() => {
        const paired = getPairedDevices();
        const safeName = (deviceName || 'Yeni cihazı').trim();
        if (!paired.some((device) => device && device.name === safeName)) {
          paired.push({ name: safeName, icon: 'cpu', room: 'Ana sayfaya bağlı' });
          nexusSetItem('nexusPairedDevices', JSON.stringify(paired));
        }
        navigateAfterPair();
      }, 900);
    }

    function hideOverlay() {
      clearTimeout(simulateConnection._t);
      document.getElementById('loading-overlay').style.display = 'none';
    }

    function getPairedDevices() {
      let devices = [];
      try { devices = JSON.parse(nexusGetItem('nexusPairedDevices') || '[]'); } catch (error) {}
      return Array.isArray(devices) ? devices : [];
    }

    function navigateAfterPair() {
      const target = 'stitch-home.html';
      if (window.top && window.top !== window) {
        window.top.location.href = target;
        return;
      }
      window.location.href = target;
    }

    var _catalogSearchEl = document.getElementById('catalog-search');
    if (_catalogSearchEl) {
      _catalogSearchEl.addEventListener('input', renderCatalogContent);
    }

    (function initManualCatalog() {
      var params = new URLSearchParams(window.location.search);
      var requested = params.get('category');
      var mapped = requested ? (CATALOG_ALIAS[requested] || requested) : null;
      var valid = CATALOG.some(function (c) { return c.key === mapped; });
      activeCatalogCategory = valid ? mapped : CATALOG[0].key;
      updateCatalogCount();
      renderCatalogRail();
      renderCatalogContent();
    })();
  </script>
