<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NEXUS — Konum Seç</title>
<!-- Tailwind CSS CDN with plugins -->
<link href="css/tailwind.css" rel="stylesheet"/>
<!-- Google Fonts: Inter (NEXUS body font) -->
<link href="fonts/inter/inter.css" rel="stylesheet"/>
  <!-- Leaflet (etkileşimli harita, OSM embed yerine) -->
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style data-purpose="typography">
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
<style data-purpose="custom-layout">
    /* Confirm bar slides in after a location change */
    .confirm-bar { transition: transform 0.25s ease; transform: translateY(140%); }
    .confirm-bar.show { transform: translateY(0); }
    /* Harita en altta kalsın, üst katmanlar (header/pin/butonlar) üstte */
    #map { z-index: 0; }
    .leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,0.7); color: #64748B; }
    .leaflet-control-attribution a { color: #64748B; text-decoration: none; pointer-events: none; }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  </head>
<body class="bg-slate-100 min-h-screen relative overflow-hidden">
<!-- BEGIN: Map (Leaflet + OSM karo, tam etkileşimli konum seçici) -->
<div class="absolute inset-0 w-full h-full" data-purpose="location-map" id="map"></div>
<!-- END: Map -->
<!-- BEGIN: TopOverlay -->
<header class="absolute top-0 inset-x-0 z-10 pt-12 pb-6 px-5 bg-gradient-to-b from-white via-white/85 to-transparent" data-purpose="map-header">
<div class="flex items-center justify-between mb-4">
<a class="text-slate-700 text-lg font-medium" href="stitch-home.html" id="cancel-link">İptal</a>
<h1 class="text-slate-900 font-bold" id="map-title">Hava Durumu Konumu</h1>
<a class="text-[#4C7DFF] text-lg font-bold" href="#" id="save-link">Kaydet</a>
</div>
<!-- Search / address bar (Enter ile gerçek adres araması yapar) -->
<div class="bg-white rounded-2xl shadow-md flex items-center px-4 py-3 gap-3" data-purpose="address-search">
<svg class="w-5 h-5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.35-4.35" stroke-linecap="round"></path></svg>
<input class="flex-grow border-none focus:ring-0 p-0 text-slate-800 font-medium bg-transparent min-w-0" enterkeyhint="search" id="address-input" placeholder="Adres veya semt ara" type="text" value=""/>
<button aria-label="Temizle" class="w-6 h-6 text-slate-400 flex items-center justify-center flex-shrink-0 active:scale-90 transition-transform" onclick="document.getElementById('address-input').value=''; document.getElementById('address-input').focus()">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"></path></svg>
</button>
</div>
<!-- Search status (arama sırasında / hata durumunda görünür) -->
<p class="hidden text-xs font-medium text-slate-500 mt-2 px-1" id="search-status"></p>
</header>
<!-- END: TopOverlay -->
<!-- BEGIN: CenterPin -->
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-full z-10 pointer-events-none flex flex-col items-center" data-purpose="selected-pin">
<div class="bg-white rounded-xl shadow-md px-4 py-2 text-sm font-bold text-slate-800 mb-2 whitespace-nowrap max-w-[80vw] overflow-hidden text-ellipsis" id="pin-label">Konum seçilmedi</div>
<svg class="w-10 h-10 drop-shadow-lg" fill="#4C7DFF" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2a7 7 0 00-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 00-7-7z"></path><circle cx="12" cy="9" fill="white" r="2.5"></circle></svg>
</div>
<!-- END: CenterPin -->
<!-- BEGIN: LocateButton -->
<button aria-label="Konumumu bul" class="absolute bottom-12 right-5 z-10 w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center text-[#4C7DFF] active:scale-95 transition-transform" data-purpose="locate-me" onclick="locateMe()">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2" stroke-linecap="round"></path></svg>
</button>
<!-- END: LocateButton -->
<!-- BEGIN: ConfirmBar (konum seçilince Kaydet/İptal sorusu) -->
<div class="confirm-bar absolute bottom-0 inset-x-0 z-20 p-4 pb-8" data-purpose="confirm-bar" id="confirm-bar">
<div class="bg-white rounded-3xl shadow-xl p-5 max-w-xl mx-auto">
<p class="text-sm font-semibold text-slate-500 mb-1">Konum seçildi</p>
<p class="font-bold text-slate-900 mb-4 truncate" id="confirm-address"></p>
<div class="flex gap-3">
<button class="flex-1 bg-white border border-slate-200 rounded-2xl py-3.5 font-bold text-slate-700 active:scale-[0.98] transition-transform" onclick="discardLocation()">İptal Et</button>
<button class="flex-1 bg-[#4C7DFF] text-white rounded-2xl py-3.5 font-bold active:scale-[0.98] transition-transform" onclick="saveLocation()">Ayarları Kaydet</button>
</div>
</div>
</div>
<!-- END: ConfirmBar -->
<script data-purpose="map-interactions">
    /* ---------- Leaflet haritası (tam etkileşimli) ---------- */
    var map = L.map('map', { zoomControl: false, attributionControl: true })
      .setView([41.015, 28.985], 15);
    map.attributionControl.setPrefix(false); // "Leaflet" yazısını kaldır
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    /* ---------- Mod: varsayılan hava durumu / enerji mini uygulaması ---------- */
    var energyMode = new URLSearchParams(location.search).get('return') === 'energy';
    var returnPage = energyMode ? 'stitch-energy-strategy.html' : 'stitch-home.html';
    var storageKey = energyMode ? 'nexusHomeLocation' : 'nexusWeatherLocation';
    // Koordinatlar da kaydedilir: hava durumu kartı sokak/mahalle adlarını
    // geokodlayamadığında doğrudan bu koordinatları kullanır.
    var coordsKey = energyMode ? 'nexusHomeCoords' : 'nexusWeatherCoords';
    var cancelLink = document.getElementById('cancel-link');
    var saveLink = document.getElementById('save-link');
    cancelLink.href = returnPage;
    if (energyMode) document.getElementById('map-title').textContent = 'Ev Konumu';

    /* ---------- Kayıtlı konumu yükle ---------- */
    var pending = null; // henüz kaydedilmemiş seçim
    (function () {
      var saved = nexusGetItem(storageKey);
      if (saved) {
        document.getElementById('address-input').value = saved;
        document.getElementById('pin-label').textContent = saved;
      }
    })();

    /* ---------- Gerçek adres arama (OpenStreetMap Nominatim) ---------- */
    var addressInput = document.getElementById('address-input');
    addressInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); searchAddress(); }
    });
    function setStatus(msg) {
      var el = document.getElementById('search-status');
      el.textContent = msg || '';
      el.classList.toggle('hidden', !msg);
    }
    function searchAddress() {
      var q = addressInput.value.trim();
      if (!q) { addressInput.focus(); return; }
      setStatus('Aranıyor…');
      fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=tr&q=' + encodeURIComponent(q))
        .then(function (r) { return r.json(); })
        .then(function (results) {
          if (!results.length) { setStatus('Sonuç bulunamadı, adresi kontrol et.'); return; }
          setStatus('');
          var r = results[0];
          moveMap(parseFloat(r.lat), parseFloat(r.lon));
          selectLocation(shortName(r.display_name), parseFloat(r.lat), parseFloat(r.lon));
        })
        .catch(function () {
          // Çevrimdışı: yazılan adres yine de seçim olarak kullanılabilir
          setStatus('Arama servisine ulaşılamadı, yazdığın adres kullanılacak.');
          selectLocation(q);
        });
    }
    function shortName(displayName) {
      // "Cadde, Mahalle, İlçe, İl, ..." -> ilk 2 parça yeterli
      return displayName.split(',').slice(0, 2).join(',').trim();
    }
    function moveMap(lat, lon) {
      programmaticMove = true;
      map.setView([lat, lon], 16);
    }

    /* ---------- Manuel seçim: haritayı sürükle, pin ortada kalır, bırakınca seçilir ---------- */
    var programmaticMove = false;
    var dragTimer = null;
    map.on('movestart', function () {
      if (!programmaticMove) document.getElementById('confirm-bar').classList.remove('show');
    });
    map.on('moveend', function () {
      if (programmaticMove) { programmaticMove = false; return; }
      // Kısa bekleme: art arda sürüklemelerde gereksiz istek atma
      clearTimeout(dragTimer);
      dragTimer = setTimeout(function () {
        var c = map.getCenter();
        setStatus('Konum alınıyor…');
        fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=tr&lat=' + c.lat + '&lon=' + c.lng)
          .then(function (r) { return r.json(); })
          .then(function (r) {
            setStatus('');
            var name = r.display_name ? shortName(r.display_name) : (c.lat.toFixed(4) + ', ' + c.lng.toFixed(4));
            addressInput.value = name;
            selectLocation(name, c.lat, c.lng);
          })
          .catch(function () {
            setStatus('');
            var name = c.lat.toFixed(4) + ', ' + c.lng.toFixed(4);
            addressInput.value = name;
            selectLocation(name, c.lat, c.lng);
          });
      }, 500);
    });
    /* Tıklanan noktayı da seç: harita tıklanan yere kayar, pin oraya oturur */
    map.on('click', function (e) {
      map.panTo(e.latlng); // moveend tetiklenir, seçim otomatik yapılır
    });

    /* ---------- Konumumu bul: gerçek geolocation + ters geokodlama ---------- */
    function isNative() {
      return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    }
    async function locateMe(silent) {
      setStatus('Konumun bulunuyor...');
      try {
        let lat, lon;
        var geo = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation;
        if (isNative() && geo) {
          // Önce izin durumunu kontrol et, gerekiyorsa kullanıcıdan iste
          var perm = await geo.checkPermissions();
          if (perm.location !== 'granted' && perm.coarseLocation !== 'granted') {
            perm = await geo.requestPermissions();
          }
          if (perm.location !== 'granted' && perm.coarseLocation !== 'granted') {
            setStatus(silent ? '' : 'Konum izni verilmedi. Uygulama ayarlarından izin verebilirsin.');
            return;
          }
          const position = await geo.getCurrentPosition({ enableHighAccuracy: true, timeout: 15000 });
          lat = position.coords.latitude;
          lon = position.coords.longitude;
        } else {
          if (!navigator.geolocation) {
            setStatus('Cihazın konum servisini desteklemiyor.');
            return;
          }
          const p = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
          });
          lat = p.coords.latitude;
          lon = p.coords.longitude;
        }

        moveMap(lat, lon);
        fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=tr&lat=' + lat + '&lon=' + lon)
          .then(function (r) { return r.json(); })
          .then(function (r) {
            setStatus('');
            var name = r.display_name ? shortName(r.display_name) : 'Mevcut Konum';
            addressInput.value = name;
            selectLocation(name, lat, lon);
          })
          .catch(function () { setStatus(''); addressInput.value = 'Mevcut Konum'; selectLocation('Mevcut Konum', lat, lon); });
      } catch (e) {
        // Hataya özel mesaj: izin reddi / GPS kapıalı / zaman aşımı
        var msg = 'Konum alınamadı, tekrar dene.';
        var raw = (e && (e.message || '')) + '';
        if (e && e.code === 1) msg = 'Konum izni verilmedi. Uygulama ayarlarından izin verebilirsin.';
        else if (e && e.code === 2) msg = 'Konum belirlenemedi. Cihazın konum (GPS) servisi kapıalı olabilir.';
        else if (e && e.code === 3) msg = 'Konum araması zaman aşımına uğradı, tekrar dene.';
        else if (raw.toLowerCase().indexOf('location services') !== -1 || raw.toLowerCase().indexOf('disabled') !== -1) msg = 'Cihazın konum (GPS) servisi kapıalı. Açıp tekrar dene.';
        setStatus(silent && !(e && e.code === 1) ? '' : msg);
      }
    }

    /* ---------- Seçim + Kaydet/İptal onayı ---------- */
    var pendingCoords = null; // seçimin koordinatları (kaydedilince kalıcı olur)
    function selectLocation(name, lat, lon) {
      pending = name;
      if (typeof lat === 'number' && typeof lon === 'number' && isFinite(lat) && isFinite(lon)) {
        pendingCoords = { lat: lat, lon: lon };
      } else {
        var c = map.getCenter();
        pendingCoords = { lat: c.lat, lon: c.lng };
      }
      document.getElementById('pin-label').textContent = name;
      document.getElementById('confirm-address').textContent = name;
      document.getElementById('confirm-bar').classList.add('show');
    }
    function discardLocation() {
      pending = null;
      pendingCoords = null;
      document.getElementById('confirm-bar').classList.remove('show');
      var saved = nexusGetItem(storageKey);
      document.getElementById('pin-label').textContent = saved || 'Konum seçilmedi';
      addressInput.value = saved || '';
    }
    function saveCoords() {
      if (pendingCoords) {
        try { nexusSetItem(coordsKey, JSON.stringify(pendingCoords)); } catch (e) {}
      }
    }
    function saveLocation() {
      if (pending) { nexusSetItem(storageKey, pending); saveCoords(); }
      location.href = returnPage;
    }
    // Üstteki Kaydet de aynı davranır: bekleyen seçim varsa kalıcı olur
    saveLink.addEventListener('click', function (e) {
      e.preventDefault();
      var value = pending || addressInput.value.trim();
      if (value) { nexusSetItem(storageKey, value); saveCoords(); }
      location.href = returnPage;
    });

    // Otomatik konum bulma (sayfa yüklendiğinde)
    window.addEventListener('load', function() {
      // Kayıtlı konum yoksa mevcut konumu otomatik bul (sessiz mod: geçici hataları gösterme)
      locateMe(true);
    });
  </script>
</body></html>
