<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In — NEXUS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M16%201.5%2028.6%208.75v14.5L16%2030.5%203.4%2023.25V8.75z%22%20fill%3D%22%235b8dff%22%2F%3E%3Cpath%20d%3D%22M11%2022V10l10%2012V10%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E" />
<style>
:root {
  --bg: #0e0f12;
  --surface: #1a1c21;
  --text: #f2f3f5;
  --muted: #a2a6ad;
  --primary: #5b8dff;
  --on-primary: #0e0f12;
  --border: rgba(255,255,255,0.08);
  --radius: 12px;
  --radius-lg: 16px;
  --font: Inter, system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
/* Animated background */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(91,141,255,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 20%, rgba(139,92,246,0.06) 0%, transparent 60%);
  animation: bgShift 12s ease-in-out infinite alternate;
  z-index: 0;
}
@keyframes bgShift {
  0% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.05); }
  100% { opacity: 0.7; transform: scale(1); }
}
.login-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  padding: 24px;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 40px 32px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.4);
  animation: cardIn 0.5s ease-out both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 8px;
}
.brand-title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
}
.tagline {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 32px;
  line-height: 1.5;
}
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.form-group input {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 14px;
  font-family: var(--font);
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
.form-group input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(91,141,255,0.15);
}
.form-group input.error {
  border-color: #ef4444;
  animation: shake 0.4s ease;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.form-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  font-size: 12px;
}
.remember-me {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  cursor: pointer;
}
.remember-me input[type="checkbox"] {
  accent-color: var(--primary);
  width: 14px;
  height: 14px;
  cursor: pointer;
}
.forgot-link {
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
}
.forgot-link:hover {
  text-decoration: underline;
}
.btn-signin {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: var(--on-primary);
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-signin:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(91,141,255,0.3);
}
.btn-signin:active {
  transform: scale(0.98);
}
.btn-signin:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}
.btn-signin .spinner {
  width: 16px;
  height: 16px;
  border: 2px solid transparent;
  border-top-color: var(--on-primary);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: none;
}
.btn-signin.loading .spinner { display: block; }
.btn-signin.loading .btn-text { display: none; }
@keyframes spin {
  to { transform: rotate(360deg); }
}
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.signup-prompt {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}
.signup-prompt a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
}
.signup-prompt a:hover {
  text-decoration: underline;
}
.error-msg {
  color: #ef4444;
  font-size: 12px;
  margin-top: 4px;
  display: none;
}
.error-msg.show {
  display: block;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 480px) {
  .login-card { padding: 28px 20px; }
}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 32 32" role="img" aria-label="Nexus logo">
        <path d="M16 1.5 28.6 8.75v14.5L16 30.5 3.4 23.25V8.75z" fill="#5b8dff"/>
        <path d="M11 22V10l10 12V10" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-title">Nexus</span>
    </div>
    <p class="tagline">Sign in to your personal operating system</p>
    
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        <div class="error-msg" id="emailError">Please enter a valid email address</div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
        <div class="error-msg" id="passwordError">Password is required</div>
      </div>
      <div class="form-row">
        <label class="remember-me">
          <input type="checkbox" id="remember" />
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn-signin" id="signinBtn">
        <span class="btn-text">Sign In</span>
        <span class="spinner"></span>
      </button>
    </form>
    
    <div class="divider">or</div>
    <p class="signup-prompt">Don't have an account? <a href="#">Create one</a></p>
  </div>
</div>

<script>
(function() {
  var form = document.getElementById('loginForm');
  var emailInput = document.getElementById('email');
  var passwordInput = document.getElementById('password');
  var signinBtn = document.getElementById('signinBtn');
  var emailError = document.getElementById('emailError');
  var passwordError = document.getElementById('passwordError');

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function clearErrors() {
    emailInput.classList.remove('error');
    passwordInput.classList.remove('error');
    emailError.classList.remove('show');
    passwordError.classList.remove('show');
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    clearErrors();

    var email = emailInput.value.trim();
    var password = passwordInput.value.trim();
    var hasError = false;

    if (!email || !isValidEmail(email)) {
      emailInput.classList.add('error');
      emailError.classList.add('show');
      hasError = true;
    }
    if (!password) {
      passwordInput.classList.add('error');
      passwordError.classList.add('show');
      hasError = true;
    }
    if (hasError) return;

    // Simulate login
    signinBtn.classList.add('loading');
    signinBtn.disabled = true;

    setTimeout(function() {
      // Store auth flag
      localStorage.setItem('nexus_auth', '1');
      localStorage.setItem('nexus_user', email);
      
      // Redirect to main site
      var path = window.location.pathname;
      if (path.indexOf('/tr/') !== -1) {
        window.location.href = 'tr/index.html';
      } else {
        window.location.href = 'index.html';
      }
    }, 1200);
  });

  // Clear error on input
  emailInput.addEventListener('input', function() {
    emailInput.classList.remove('error');
    emailError.classList.remove('show');
  });
  passwordInput.addEventListener('input', function() {
    passwordInput.classList.remove('error');
    passwordError.classList.remove('show');
  });
})();
</script>
</body>
</html>
