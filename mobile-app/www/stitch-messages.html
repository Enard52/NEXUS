<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NEXUS — Mesaj Merkezi</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter (NEXUS body font) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<style data-purpose="custom-typography">
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<style data-purpose="custom-layout">
    /* Subtle brand-tinted gradient background (same as Profil) */
    .bg-gradient-custom {
      background: linear-gradient(to bottom, #ECE9FD 0%, #F5F3FF 40%, #ffffff 100%);
    }
    .menu-container-shadow {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gradient-custom text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- BEGIN: Header -->
<header class="pt-14 pb-4 px-5 flex items-center justify-between relative" data-purpose="page-header">
<a aria-label="Geri" class="p-1" href="stitch-profile.html">
<i class="w-7 h-7 text-slate-700" data-lucide="chevron-left"></i>
</a>
<h1 class="text-2xl font-bold absolute left-1/2 -translate-x-1/2">Mesaj Merkezi</h1>
<button aria-label="Tümünü okundu işaretle" class="p-1 text-[#0ea5e9]" onclick="markAllRead()">
<i class="w-6 h-6" data-lucide="check-check"></i>
</button>
</header>
<!-- END: Header -->
<!-- BEGIN: Tabs -->
<div class="px-5 pt-2 pb-4" data-purpose="message-tabs">
<div class="bg-white/70 rounded-full p-1 flex" id="tabs">
<button class="flex-1 py-2 rounded-full text-sm font-bold bg-[#0ea5e9] text-white" onclick="switchTab(this, 'tab-alerts')">Uyarılar</button>
<button class="flex-1 py-2 rounded-full text-sm font-semibold text-slate-500" onclick="switchTab(this, 'tab-family')">Aile</button>
<button class="flex-1 py-2 rounded-full text-sm font-semibold text-slate-500" onclick="switchTab(this, 'tab-notices')">Duyurular</button>
</div>
</div>
<!-- END: Tabs -->
<!-- BEGIN: MainContent -->
<main class="flex-grow px-5 pb-10">
<!-- Tab: Uyarılar -->
<section class="space-y-3" id="tab-alerts">
<article class="bg-white rounded-2xl menu-container-shadow p-4 flex gap-4">
<span class="unread-dot w-2.5 h-2.5 bg-[#FF3B5C] rounded-full mt-2 flex-shrink-0"></span>
<div class="min-w-0">
<h2 class="font-bold leading-tight">Cihaz çevrimdışı</h2>
<p class="text-sm text-slate-500 mt-1">Oturma Odası lambası bağlantısı kesildi.</p>
<p class="text-xs text-slate-400 mt-2">Bugün 09:42</p>
</div>
</article>
<article class="bg-white rounded-2xl menu-container-shadow p-4 flex gap-4">
<span class="unread-dot w-2.5 h-2.5 bg-[#FF3B5C] rounded-full mt-2 flex-shrink-0"></span>
<div class="min-w-0">
<h2 class="font-bold leading-tight">Düşük pil</h2>
<p class="text-sm text-slate-500 mt-1">Kapı sensörünün pili %15 seviyesinde.</p>
<p class="text-xs text-slate-400 mt-2">Dün 21:10</p>
</div>
</article>
</section>
<!-- Tab: Aile -->
<section class="hidden" id="tab-family">
<div class="flex flex-col items-center justify-center pt-20 text-center" data-purpose="empty-state">
<div class="w-16 h-16 rounded-2xl bg-white flex items-center justify-center text-slate-300 mb-4 menu-container-shadow">
<i class="w-8 h-8" data-lucide="users"></i>
</div>
<p class="text-slate-400 font-medium">Aile mesajı yok</p>
</div>
</section>
<!-- Tab: Duyurular -->
<section class="hidden space-y-3" id="tab-notices">
<article class="bg-white rounded-2xl menu-container-shadow p-4 flex gap-4">
<span class="unread-dot w-2.5 h-2.5 bg-[#FF3B5C] rounded-full mt-2 flex-shrink-0"></span>
<div class="min-w-0">
<h2 class="font-bold leading-tight">NEXUS güncellemesi hazır</h2>
<p class="text-sm text-slate-500 mt-1">Yeni sürümde enerji raporları geliştirildi.</p>
<p class="text-xs text-slate-400 mt-2">2 gün önce</p>
</div>
</article>
</section>
</main>
<!-- END: MainContent -->
<script data-purpose="message-interactions">
    lucide.createIcons();
    // Switch between message tabs
    function switchTab(btn, id) {
      document.querySelectorAll('#tabs button').forEach(function (b) {
        b.className = 'flex-1 py-2 rounded-full text-sm font-semibold text-slate-500';
      });
      btn.className = 'flex-1 py-2 rounded-full text-sm font-bold bg-[#0ea5e9] text-white';
      ['tab-alerts', 'tab-family', 'tab-notices'].forEach(function (t) {
        document.getElementById(t).classList.toggle('hidden', t !== id);
      });
    }
    // Clear all unread dots
    function markAllRead() {
      document.querySelectorAll('.unread-dot').forEach(function (d) {
        d.classList.remove('bg-[#FF3B5C]');
        d.classList.add('bg-slate-200');
      });
    }
  </script>
</body></html>
