</div>

<p class="text-slate-500 text-sm mt-1">Bildirimleri geçici olarak sessize al</p>

</span>
<span class="text-[17px] font-medium">1 saatliğine Rahatsız Etme</span>
</div>
<svg class="dnd-check w-5 h-5 text-nexus-purple hidden flex-shrink-0" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</li>
<li class="dnd-list-item flex items-center justify-between px-5 py-4 min-h-[64px] active:bg-gray-50 cursor-pointer" onclick="selectDnd(this)">
<div class="flex items-center gap-3.5 min-w-0">
<span class="w-10 h-10 rounded-xl bg-nexus-purple/10 text-nexus-purple flex items-center justify-center flex-shrink-0">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M18.63 13A17.89 17.89 0 0 1 18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18" stroke-linecap="round" stroke-linejoin="round"></path><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<span class="text-[17px] font-medium">3 saatliğine Rahatsız Etme</span>
</div>
<svg class="dnd-check w-5 h-5 text-nexus-purple hidden flex-shrink-0" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</li>
<li class="dnd-list-item flex items-center justify-between px-5 py-4 min-h-[64px] active:bg-gray-50 cursor-pointer" onclick="selectDnd(this)">
<div class="flex items-center gap-3.5 min-w-0">
<span class="w-10 h-10 rounded-xl bg-nexus-cyan/10 text-[#0EA5C4] flex items-center justify-center flex-shrink-0">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<span class="text-[17px] font-medium">12 saatliğine Rahatsız Etme</span>
</div>
<svg class="dnd-check w-5 h-5 text-nexus-purple hidden flex-shrink-0" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</li>
<li class="dnd-list-item flex items-center justify-between px-5 py-4 min-h-[64px] active:bg-gray-50 cursor-pointer" onclick="selectDnd(this)">
<div class="flex items-center gap-3.5 min-w-0">
<span class="w-10 h-10 rounded-xl bg-nexus-cyan/10 text-[#0EA5C4] flex items-center justify-center flex-shrink-0">

</span>
<span class="text-[17px] font-medium">24 saatliğine Rahatsız Etme</span>
</div>
<svg class="dnd-check w-5 h-5 text-nexus-purple hidden flex-shrink-0" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</li>
<li class="dnd-list-item flex items-center justify-between px-5 py-4 min-h-[64px] active:bg-gray-50 cursor-pointer" data-purpose="active-selection" onclick="selectDnd(this)">
<div class="flex items-center gap-3.5 min-w-0">
<span class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-600 flex items-center justify-center flex-shrink-0">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<span class="text-[17px] font-medium">Geçici Rahatsız Etme'yi Kapat</span>
</div>
<svg class="dnd-check w-5 h-5 text-nexus-purple flex-shrink-0" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>

</ul>
</section>
<!-- END: DND Options Card -->
</main>
<!-- END: Main Content -->
<!-- BEGIN: Footer Navigation Card -->
<footer class="px-6 pb-12">
<a class="w-full bg-white rounded-2xl shadow-sm px-5 py-4 flex items-center justify-between active:scale-[0.98] transition-transform" data-purpose="calendar-link" href="stitch-program.html">
<div class="min-w-0">
<span class="text-[17px] font-medium text-nexus-purple block">Rahatsız Etme Takvimi</span>
<!-- Kaydedilen program stitch-program.html'den localStorage ile senkronize gelir -->
<span class="hidden text-sm text-slate-500 mt-0.5 block truncate" id="schedule-summary"></span>
</div>
<svg class="w-5 h-5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
</footer>
<!-- END: Footer Navigation Card -->
<script data-purpose="dnd-interactions">
    // Move the checkmark to the tapped DND option and persist the choice
    function selectDnd(item) {
      document.querySelectorAll('#dnd-options .dnd-check').forEach(function (c) {
        c.classList.add('hidden');
      });
      item.querySelector('.dnd-check').classList.remove('hidden');
      // Ana sayfadaki Rahatsız Etme kartı bu durumla senkronize olur
      var label = item.querySelector('span.text-\\[17px\\]').textContent;
      localStorage.setItem('nexusDndState', label.indexOf('Kapat') !== -1 ? 'Kapalı' : label.replace(' Rahatsız Etme', ''));
    }
    // Restore the previously saved selection
    (function () {
      var state = localStorage.getItem('nexusDndState');
      if (!state || state === 'Kapalı') return;
      document.querySelectorAll('#dnd-options li').forEach(function (li) {
        var label = li.querySelector('span.text-\\[17px\\]').textContent;
        var on = label.indexOf(state) === 0;
        li.querySelector('.dnd-check').classList.toggle('hidden', !on);
      });
    })();
    // Show the saved schedule from the Program Ekle page (synced via localStorage)
    (function () {
      var raw = localStorage.getItem('nexusDndSchedule');
      if (!raw) return;
      try {
        var s = JSON.parse(raw);
        var el = document.getElementById('schedule-summary');
        el.textContent = s.start + ' – ' + s.end + ' · ' + s.repeat + ' · ' + s.devices;
        el.classList.remove('hidden');
      } catch (e) { /* bozuk kayıt varsa sessizce yok say */ }
    })();
  </script>
</body></html>
