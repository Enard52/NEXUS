<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NEXUS — Kullanıcı Bilgileri</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter (NEXUS body font) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<style data-purpose="typography">
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style data-purpose="custom-layout">
    /* Brand-tinted content background (source blue -> NEXUS purple tint) */
    .bg-nexus-tint {
      background: linear-gradient(to bottom, #ECE9FD 0%, #F5F3FF 60%, #F6F5FB 100%);
    }
    /* iOS-style list rows */
    .settings-row {
      min-height: 72px;
    }
    .chevron-right {
      width: 18px;
      height: 18px;
      color: #9CA3AF;
    }
    /* Bottom sheet transition */
    .sheet { transition: transform 0.25s ease; transform: translateY(100%); }
    .sheet.open { transform: translateY(0); }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-white min-h-screen flex flex-col">
<!-- BEGIN: Navigation Header -->
<header class="bg-white px-4 py-4 flex items-center justify-between border-b border-gray-50 relative" data-purpose="main-header">
<a aria-label="Geri" class="p-2 -ml-2" href="stitch-profile.html">
<svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<h1 class="text-xl font-semibold text-gray-900 absolute left-1/2 -translate-x-1/2">Kullanıcı Bilgileri</h1>
<!-- Empty div for flex balance -->
<div class="w-10"></div>
</header>
<!-- END: Navigation Header -->
<!-- BEGIN: Content Area -->
<main class="flex-1 bg-nexus-tint p-6" data-purpose="settings-container">
<!-- BEGIN: Settings Card (genişlik sınırı ile geniş ekranlarda da düzgün) -->
<div class="bg-white rounded-[2rem] shadow-sm overflow-hidden w-full max-w-xl mx-auto" data-purpose="info-card">
<!-- Row 1: Profile Photo (gerçek dosya seçici açar) -->
<button class="settings-row w-full flex items-center justify-between px-6 border-b border-gray-100 hover:bg-gray-50 active:bg-gray-50 transition-colors text-left" onclick="document.getElementById('avatar-input').click()">
<span class="text-[17px] font-medium text-gray-800">Profil Fotoğrafı</span>
<div class="flex items-center gap-3">
<div class="w-14 h-14 rounded-full overflow-hidden border border-gray-200 flex-shrink-0">
<img alt="Profil fotoğrafı" class="w-full h-full object-cover" id="avatar-img" src="https://randomuser.me/api/portraits/men/75.jpg"/>
</div>
<svg class="chevron-right flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</button>
<input accept="image/*" class="hidden" id="avatar-input" onchange="changeAvatar(this)" type="file"/>
<!-- Row 2: Username (düzenleme sheet'i açar) -->
<button class="settings-row w-full flex items-center justify-between px-6 border-b border-gray-100 hover:bg-gray-50 active:bg-gray-50 transition-colors text-left" onclick="openSheet('name')">
<span class="text-[17px] font-medium text-gray-800 flex-shrink-0">Kullanıcı Adı</span>
<div class="flex items-center gap-3 min-w-0">
<span class="text-[17px] text-gray-400 truncate" id="username-value">Deniz Yılmaz</span>
<svg class="chevron-right flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</button>
<!-- Row 3: Device Timezone (cihazdan otomatik okunur, sheet ile değiştirilebilir) -->
<button class="settings-row w-full flex items-center justify-between px-6 hover:bg-gray-50 active:bg-gray-50 transition-colors text-left" onclick="openSheet('tz')">
<span class="text-[17px] font-medium text-gray-800 flex-shrink-0">Cihaz Saat Dilimi</span>
<div class="flex items-center gap-3 min-w-0">
<span class="text-[17px] text-gray-400 truncate" id="timezone-value">İstanbul</span>
<svg class="chevron-right flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</button>
</div>
<!-- END: Settings Card -->
</main>
<!-- END: Content Area -->
<!-- BEGIN: Sheet backdrop -->
<div class="fixed inset-0 bg-black/40 z-40 hidden" id="sheet-backdrop" onclick="closeSheets()"></div>
<!-- BEGIN: Username Edit Sheet -->
<div class="sheet fixed bottom-0 inset-x-0 bg-white rounded-t-3xl z-50 p-6 pb-10 w-full max-w-xl mx-auto" data-purpose="name-sheet" id="sheet-name">
<div class="flex items-center justify-between mb-5">
<h3 class="text-lg font-bold">Kullanıcı Adını Düzenle</h3>
<button aria-label="Kapat" class="text-slate-400" onclick="closeSheets()"><i class="w-6 h-6" data-lucide="x"></i></button>
</div>
<input class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-[17px] font-medium focus:ring-2 focus:ring-[#0ea5e9] mb-2" id="name-input" maxlength="30" type="text" value="Deniz Yılmaz"/>
<p class="text-xs text-slate-400 mb-5"><span id="name-count">0</span>/30 karakter</p>
<div class="flex gap-3">
<button class="flex-1 bg-white border border-slate-200 rounded-2xl py-4 font-bold text-slate-700 active:scale-[0.98] transition-transform" onclick="closeSheets()">İptal</button>
<button class="flex-1 bg-[#0ea5e9] text-white rounded-2xl py-4 font-bold active:scale-[0.98] transition-transform" onclick="saveName()">Kaydet</button>
</div>
</div>
<!-- END: Username Edit Sheet -->
<!-- BEGIN: Timezone Sheet -->
<div class="sheet fixed bottom-0 inset-x-0 bg-white rounded-t-3xl z-50 p-6 pb-10 w-full max-w-xl mx-auto" data-purpose="timezone-sheet" id="sheet-tz">
<div class="flex items-center justify-between mb-2">
<h3 class="text-lg font-bold">Saat Dilimi</h3>
<button aria-label="Kapat" class="text-slate-400" onclick="closeSheets()"><i class="w-6 h-6" data-lucide="x"></i></button>
</div>
<p class="text-sm text-slate-400 mb-4">Ülkeni seç; senaryo ve programların bu ülkenin saatine göre çalışır.</p>
<!-- Ülke arama -->
<div class="bg-slate-50 rounded-2xl flex items-center px-4 py-3 gap-3 mb-3" data-purpose="tz-search-box">
<svg class="w-5 h-5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.35-4.35" stroke-linecap="round"></path></svg>
<input class="flex-grow border-none focus:ring-0 p-0 text-[16px] text-slate-800 font-medium bg-transparent min-w-0" id="tz-search" oninput="renderTzList(this.value)" placeholder="Ülke ara" type="text"/>
</div>
<!-- Tüm ülkeler (gerçek IANA saat dilimleriyle, script doldurur) -->
<div class="space-y-1 overflow-y-auto max-h-[45vh] -mx-2 px-2" id="tz-list"></div>
<p class="hidden text-sm text-slate-400 text-center py-6" id="tz-empty">Eşleşen ülke bulunamadı.</p>
</div>
<!-- END: Timezone Sheet -->
<script data-purpose="user-info-interactions">
    lucide.createIcons();

    /* ---------- Profil fotoğrafı: gerçek dosya seçimi ---------- */
    function changeAvatar(input) {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        document.getElementById('avatar-img').src = e.target.result;
        // Profil sayfası da aynı anahtardan okur
        try { localStorage.setItem('nexusAvatar', e.target.result); }
        catch (err) { /* çok büyük görselde kota aşılırsa yalnızca bu oturumda görünür */ }
      };
      reader.readAsDataURL(file);
    }

    /* ---------- Kullanıcı adı düzenleme ---------- */
    var nameInput = document.getElementById('name-input');
    nameInput.addEventListener('input', updateNameCount);
    nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveName(); });
    function updateNameCount() {
      document.getElementById('name-count').textContent = nameInput.value.length;
    }
    function saveName() {
      var v = nameInput.value.trim();
      if (!v) { nameInput.focus(); return; }
      localStorage.setItem('nexusUserName', v);
      document.getElementById('username-value').textContent = v;
      closeSheets();
    }

    /* ---------- Saat dilimi: tüm ülkeler, gerçek IANA dilimleri ---------- */
    /* Her ülkenin başkentinin IANA saat dilimi (ISO 3166 kodu -> dilim) */
    var COUNTRY_TZ = {
      AF:'Asia/Kabul', AL:'Europe/Tirane', DZ:'Africa/Algiers', AD:'Europe/Andorra', AO:'Africa/Luanda', AG:'America/Antigua', AR:'America/Argentina/Buenos_Aires', AM:'Asia/Yerevan',
      AU:'Australia/Sydney', AT:'Europe/Vienna', AZ:'Asia/Baku', BS:'America/Nassau', BH:'Asia/Bahrain', BD:'Asia/Dhaka', BB:'America/Barbados', BY:'Europe/Minsk',
      BE:'Europe/Brussels', BZ:'America/Belize', BJ:'Africa/Porto-Novo', BT:'Asia/Thimphu', BO:'America/La_Paz', BA:'Europe/Sarajevo', BW:'Africa/Gaborone', BR:'America/Sao_Paulo',
      BN:'Asia/Brunei', BG:'Europe/Sofia', BF:'Africa/Ouagadougou', BI:'Africa/Bujumbura', KH:'Asia/Phnom_Penh', CM:'Africa/Douala', CA:'America/Toronto', CV:'Atlantic/Cape_Verde',
      CF:'Africa/Bangui', TD:'Africa/Ndjamena', CL:'America/Santiago', CN:'Asia/Shanghai', CO:'America/Bogota', KM:'Indian/Comoro', CG:'Africa/Brazzaville', CD:'Africa/Kinshasa',
      CR:'America/Costa_Rica', CI:'Africa/Abidjan', HR:'Europe/Zagreb', CU:'America/Havana', CY:'Asia/Nicosia', CZ:'Europe/Prague', DK:'Europe/Copenhagen', DJ:'Africa/Djibouti',
      DM:'America/Dominica', DO:'America/Santo_Domingo', EC:'America/Guayaquil', EG:'Africa/Cairo', SV:'America/El_Salvador', GQ:'Africa/Malabo', ER:'Africa/Asmara', EE:'Europe/Tallinn',
      SZ:'Africa/Mbabane', ET:'Africa/Addis_Ababa', FJ:'Pacific/Fiji', FI:'Europe/Helsinki', FR:'Europe/Paris', GA:'Africa/Libreville', GM:'Africa/Banjul', GE:'Asia/Tbilisi',
      DE:'Europe/Berlin', GH:'Africa/Accra', GR:'Europe/Athens', GD:'America/Grenada', GT:'America/Guatemala', GN:'Africa/Conakry', GW:'Africa/Bissau', GY:'America/Guyana',
      HT:'America/Port-au-Prince', HN:'America/Tegucigalpa', HU:'Europe/Budapest', IS:'Atlantic/Reykjavik', IN:'Asia/Kolkata', ID:'Asia/Jakarta', IR:'Asia/Tehran', IQ:'Asia/Baghdad',
      IE:'Europe/Dublin', IL:'Asia/Jerusalem', IT:'Europe/Rome', JM:'America/Jamaica', JP:'Asia/Tokyo', JO:'Asia/Amman', KZ:'Asia/Almaty', KE:'Africa/Nairobi',
      KI:'Pacific/Tarawa', KP:'Asia/Pyongyang', KR:'Asia/Seoul', KW:'Asia/Kuwait', KG:'Asia/Bishkek', LA:'Asia/Vientiane', LV:'Europe/Riga', LB:'Asia/Beirut',
      LS:'Africa/Maseru', LR:'Africa/Monrovia', LY:'Africa/Tripoli', LI:'Europe/Vaduz', LT:'Europe/Vilnius', LU:'Europe/Luxembourg', MG:'Indian/Antananarivo', MW:'Africa/Blantyre',
      MY:'Asia/Kuala_Lumpur', MV:'Indian/Maldives', ML:'Africa/Bamako', MT:'Europe/Malta', MH:'Pacific/Majuro', MR:'Africa/Nouakchott', MU:'Indian/Mauritius', MX:'America/Mexico_City',
      FM:'Pacific/Pohnpei', MD:'Europe/Chisinau', MC:'Europe/Monaco', MN:'Asia/Ulaanbaatar', ME:'Europe/Podgorica', MA:'Africa/Casablanca', MZ:'Africa/Maputo', MM:'Asia/Yangon',
      NA:'Africa/Windhoek', NR:'Pacific/Nauru', NP:'Asia/Kathmandu', NL:'Europe/Amsterdam', NZ:'Pacific/Auckland', NI:'America/Managua', NE:'Africa/Niamey', NG:'Africa/Lagos',
      MK:'Europe/Skopje', NO:'Europe/Oslo', OM:'Asia/Muscat', PK:'Asia/Karachi', PW:'Pacific/Palau', PS:'Asia/Hebron', PA:'America/Panama', PG:'Pacific/Port_Moresby',
      PY:'America/Asuncion', PE:'America/Lima', PH:'Asia/Manila', PL:'Europe/Warsaw', PT:'Europe/Lisbon', QA:'Asia/Qatar', RO:'Europe/Bucharest', RU:'Europe/Moscow',
      RW:'Africa/Kigali', KN:'America/St_Kitts', LC:'America/St_Lucia', VC:'America/St_Vincent', WS:'Pacific/Apia', SM:'Europe/San_Marino', ST:'Africa/Sao_Tome', SA:'Asia/Riyadh',
      SN:'Africa/Dakar', RS:'Europe/Belgrade', SC:'Indian/Mahe', SL:'Africa/Freetown', SG:'Asia/Singapore', SK:'Europe/Bratislava', SI:'Europe/Ljubljana', SB:'Pacific/Guadalcanal',
      SO:'Africa/Mogadishu', ZA:'Africa/Johannesburg', SS:'Africa/Juba', ES:'Europe/Madrid', LK:'Asia/Colombo', SD:'Africa/Khartoum', SR:'America/Paramaribo', SE:'Europe/Stockholm',
      CH:'Europe/Zurich', SY:'Asia/Damascus', TW:'Asia/Taipei', TJ:'Asia/Dushanbe', TZ:'Africa/Dar_es_Salaam', TH:'Asia/Bangkok', TL:'Asia/Dili', TG:'Africa/Lome',
      TO:'Pacific/Tongatapu', TT:'America/Port_of_Spain', TN:'Africa/Tunis', TR:'Europe/Istanbul', TM:'Asia/Ashgabat', TV:'Pacific/Funafuti', UG:'Africa/Kampala', UA:'Europe/Kyiv',
      AE:'Asia/Dubai', GB:'Europe/London', US:'America/New_York', UY:'America/Montevideo', UZ:'Asia/Tashkent', VU:'Pacific/Efate', VA:'Europe/Vatican', VE:'America/Caracas',
      VN:'Asia/Ho_Chi_Minh', XK:'Europe/Belgrade', YE:'Asia/Aden', ZM:'Africa/Lusaka', ZW:'Africa/Harare'
    };
    /* Ülke adları tarayıcının gerçek Türkçe verisinden gelir */
    var countryName = (function () {
      try { var dn = new Intl.DisplayNames(['tr'], { type: 'region' }); return function (c) { return dn.of(c) || c; }; }
      catch (e) { return function (c) { return c; }; }
    })();
    var COUNTRIES = Object.keys(COUNTRY_TZ).map(function (code) {
      return { code: code, tz: COUNTRY_TZ[code], name: countryName(code) };
    }).sort(function (a, b) { return a.name.localeCompare(b.name, 'tr'); });

    function deviceTimezone() {
      try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Istanbul'; }
      catch (e) { return 'Europe/Istanbul'; }
    }
    function cityLabel(tz) {
      var CITY_TR = { Istanbul: 'İstanbul', London: 'Londra', Vienna: 'Viyana', Rome: 'Roma', Athens: 'Atina', Cairo: 'Kahire', Moscow: 'Moskova', Brussels: 'Brüksel', Zurich: 'Zürih', Warsaw: 'Varşova', Lisbon: 'Lizbon', Copenhagen: 'Kopenhag', Stockholm: 'Stokholm', Kyiv: 'Kiev', Jerusalem: 'Kudüs', Riyadh: 'Riyad', Baghdad: 'Bağdat', Tehran: 'Tahran', Damascus: 'Şam', Tripoli: 'Trablus', Tunis: 'Tunus', Algiers: 'Cezayir', Beirut: 'Beyrut', Nicosia: 'Lefkoşa', Tokyo: 'Tokyo', Seoul: 'Seul' };
      var city = tz.split('/').pop();
      return CITY_TR[city] || city.replace(/_/g, ' ');
    }
    /* Gerçek GMT farkı (yaz saati dahil, canlı hesaplanır) */
    function gmtOffset(tz) {
      try {
        var parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortOffset' }).formatToParts(new Date());
        var p = parts.filter(function (x) { return x.type === 'timeZoneName'; })[0];
        return p ? p.value : '';
      } catch (e) { return ''; }
    }
    /* Seçili ülke: kayıt yoksa cihaz diliminden eşleşen ülke bulunur */
    function selectedCountry() {
      var code = localStorage.getItem('nexusTimezoneCountry');
      if (code && COUNTRY_TZ[code]) return code;
      var saved = localStorage.getItem('nexusTimezone');
      var tz = (saved && saved !== 'auto') ? saved : deviceTimezone();
      var hit = COUNTRIES.filter(function (c) { return c.tz === tz; })[0];
      return hit ? hit.code : 'TR';
    }
    function renderTimezone() {
      var code = selectedCountry();
      var tz = COUNTRY_TZ[code];
      var now = '';
      try {
        now = new Intl.DateTimeFormat('tr-TR', { hour: '2-digit', minute: '2-digit', timeZone: tz }).format(new Date());
      } catch (e) { /* bilinmeyen dilimde yalnızca ad gösterilir */ }
      document.getElementById('timezone-value').textContent = countryName(code) + (now ? ' · ' + now : '');
      renderTzList(document.getElementById('tz-search').value);
    }
    function renderTzList(filter) {
      var list = document.getElementById('tz-list');
      var q = (filter || '').trim().toLocaleLowerCase('tr');
      var sel = selectedCountry();
      list.innerHTML = '';
      var shown = 0;
      COUNTRIES.forEach(function (c) {
        if (q && c.name.toLocaleLowerCase('tr').indexOf(q) === -1) return;
        shown++;
        var btn = document.createElement('button');
        btn.className = 'w-full flex items-center justify-between gap-3 rounded-2xl px-4 py-3 active:bg-slate-50 transition-colors text-left';
        btn.innerHTML =
          '<span class="min-w-0"><span class="block text-[16px] font-medium truncate">' + c.name + '</span>' +
          '<span class="block text-xs text-slate-400 mt-0.5">' + cityLabel(c.tz) + ' · ' + gmtOffset(c.tz) + '</span></span>' +
          (c.code === sel
            ? '<svg class="w-5 h-5 text-[#0ea5e9] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>'
            : '');
        btn.onclick = function () { pickCountry(c.code); };
        list.appendChild(btn);
      });
      document.getElementById('tz-empty').classList.toggle('hidden', shown > 0);
    }
    function pickCountry(code) {
      localStorage.setItem('nexusTimezoneCountry', code);
      localStorage.setItem('nexusTimezone', COUNTRY_TZ[code]);
      renderTimezone();
      closeSheets();
    }

    /* ---------- Bottom sheets ---------- */
    function openSheet(name) {
      document.getElementById('sheet-backdrop').classList.remove('hidden');
      document.getElementById('sheet-' + name).classList.add('open');
      if (name === 'name') setTimeout(function () { nameInput.focus(); }, 260);
    }
    function closeSheets() {
      document.getElementById('sheet-backdrop').classList.add('hidden');
      document.querySelectorAll('.sheet').forEach(function (s) { s.classList.remove('open'); });
    }

    /* Ülke verileri hazır olduktan sonra kayıtlı verileri yükle (profil sayfasıyla senkron) */
    (function () {
      var name = localStorage.getItem('nexusUserName') || 'Deniz Yılmaz';
      document.getElementById('username-value').textContent = name;
      nameInput.value = name;
      updateNameCount();
      var avatar = localStorage.getItem('nexusAvatar');
      if (avatar) document.getElementById('avatar-img').src = avatar;
      renderTimezone();
    })();
  </script>
</body></html>
