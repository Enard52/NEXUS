<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NEXUS — Tara</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter (NEXUS body font) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="typography">
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
<style data-purpose="scanner-animation">
    /* Cyan scan line sweeping inside the frame (NEXUS accent) */
    .scan-line {
      position: absolute;
      left: 6px;
      right: 6px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #22D3EE, transparent);
      box-shadow: 0 0 14px #22D3EE;
      animation: scan 2.8s ease-in-out infinite;
    }
    @keyframes scan {
      0%, 100% { top: 6%; }
      50% { top: 94%; }
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black text-white min-h-screen flex flex-col">
<!-- BEGIN: Header -->
<header class="pt-12 pb-2 px-4" data-purpose="scan-header">
<a aria-label="Geri" class="inline-flex w-10 h-10 items-center justify-center" href="stitch-home.html">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
</header>
<!-- END: Header -->
<!-- BEGIN: ScannerViewport -->
<main class="flex-grow relative" data-purpose="scanner-viewport">
<div class="absolute left-1/2 top-[42%] -translate-x-1/2 -translate-y-1/2 w-64 h-64" data-purpose="scan-frame">
<!-- Corner brackets -->
<span class="absolute top-0 left-0 w-9 h-9 border-t-[3px] border-l-[3px] border-white/80 rounded-tl-2xl"></span>
<span class="absolute top-0 right-0 w-9 h-9 border-t-[3px] border-r-[3px] border-white/80 rounded-tr-2xl"></span>
<span class="absolute bottom-0 left-0 w-9 h-9 border-b-[3px] border-l-[3px] border-white/80 rounded-bl-2xl"></span>
<span class="absolute bottom-0 right-0 w-9 h-9 border-b-[3px] border-r-[3px] border-white/80 rounded-br-2xl"></span>
<!-- Animated scan line -->
<span class="scan-line"></span>
</div>
</main>
<!-- END: ScannerViewport -->
<!-- BEGIN: Hints -->
<section class="px-8 pb-6 text-center space-y-5" data-purpose="scan-hints">
<p class="text-white/90 font-medium flex items-center justify-center gap-2">
    Tanımlama için QR kodunu/barkodu hizalayın.
    <button aria-label="Yardım" class="w-5 h-5 rounded-full bg-white/25 text-[11px] font-bold flex items-center justify-center" onclick="toggleScanHelp()">?</button>
</p>
<!-- Yardım balonu: alert() yerine tasarım sistemine uygun ipucu kutusu -->
<p class="hidden bg-white/15 text-white/90 text-sm font-medium rounded-2xl px-4 py-3 max-w-xs mx-auto" id="scan-help">Cihazın kutusundaki veya gövdesindeki QR kodu çerçeveye hizalayın. Kod okunmazsa kurulum kodunu elle girebilirsiniz.</p>
<!-- Manuel ekleme: radar keşif sayfasına gider -->
<a class="mx-auto flex items-center gap-1 text-white/70 font-medium" href="stitch-pair.html">
    QR kod bulunamadı, manuel ekleyin
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
</section>
<!-- END: Hints -->
<!-- BEGIN: BottomActions -->
<footer class="pb-12 pt-2 px-4 grid grid-cols-3 gap-2 items-start" data-purpose="scan-actions">
<!-- Setup code -->
<button class="flex flex-col items-center gap-2.5 text-white/90" onclick="toggleCodeSheet()">
<span class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><rect height="12" rx="2" width="20" x="2" y="6"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8" stroke-linecap="round"></path></svg>
</span>
<span class="text-sm leading-tight text-center">Kurulum<br/>Kodunu Girin</span>
</button>
<!-- Torch toggle -->
<button class="flex flex-col items-center gap-2.5 text-white/90" data-purpose="torch-toggle" onclick="toggleTorch(this)">
<span class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M18 6c0 2-2 2-2 4v10a2 2 0 01-2 2h-4a2 2 0 01-2-2V10c0-2-2-2-2-4V2h12v4zM6 6h12M12 13v1" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<span class="text-sm leading-tight text-center" id="torch-label">El Feneri<br/>Kapalı</span>
</button>
<!-- Album (real file picker) -->
<label class="flex flex-col items-center gap-2.5 text-white/90 cursor-pointer">
<input accept="image/*" class="hidden" type="file"/>
<span class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><rect height="18" rx="3" width="18" x="3" y="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-3.1-3.1a2 2 0 00-2.8 0L6 21" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<span class="text-sm leading-tight text-center">Albüm</span>
</label>
</footer>
<!-- END: BottomActions -->
<!-- BEGIN: SetupCodeSheet -->
<div class="hidden fixed inset-0 bg-black/60 z-50 flex items-end" id="code-sheet" onclick="toggleCodeSheet()">
<div class="bg-white text-slate-900 dark:text-slate-100 w-full rounded-t-3xl p-6 pb-10" onclick="event.stopPropagation()">
<div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-5"></div>
<h2 class="font-bold text-lg mb-1">Kurulum Kodunu Girin</h2>
<p class="text-slate-500 text-sm mb-4">Cihazın üzerindeki 8-11 haneli kurulum kodunu yazın.</p>
<input class="w-full border border-slate-200 rounded-xl px-4 py-3 mb-4 font-medium focus:border-[#0ea5e9] focus:ring-[#0ea5e9]" placeholder="Örn. 123-45-678" type="text"/>
<button class="w-full bg-[#0ea5e9] text-white font-bold py-3.5 rounded-xl active:scale-[0.98] transition-transform" onclick="toggleCodeSheet()">Onayla</button>
</div>
</div>
<!-- END: SetupCodeSheet -->
<script data-purpose="scan-interactions">
    // Yardım balonunu aç/kapat
    function toggleScanHelp() {
      document.getElementById('scan-help').classList.toggle('hidden');
    }
    // Bottom sheet for manual setup code entry
    function toggleCodeSheet() {
      document.getElementById('code-sheet').classList.toggle('hidden');
    }
    // Torch on/off visual state
    function toggleTorch(btn) {
      var label = document.getElementById('torch-label');
      var isOn = label.innerHTML.indexOf('Açık') !== -1;
      label.innerHTML = isOn ? 'El Feneri<br/>Kapalı' : 'El Feneri<br/>Açık';
      btn.classList.toggle('text-[#22D3EE]', !isOn);
      btn.classList.toggle('text-white/90', isOn);
    }
  </script>
</body></html>
