<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <title>NEXUS — Hoş Geldiniz</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    /* ── Temel ── */
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: max(884px, 100dvh);
      
      overflow: hidden;
    }

    /* ── Dekoratif daireler (arka plan) ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
    }
    .blob-1 {
      width: 340px; height: 340px;
      background: #0ea5e9;
      top: -80px; right: -80px;
    }
    .blob-2 {
      width: 260px; height: 260px;
      background: #22D3EE;
      bottom: 120px; left: -60px;
    }
    .blob-3 {
      width: 180px; height: 180px;
      background: #a78bfa;
      top: 45%; right: -40px;
    }

    /* ── Hero görsel halkası ── */
    .hero-ring {
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.75) 0%, rgba(236,233,253,0.4) 100%);
      box-shadow:
        0 0 0 12px rgba(14,165,233,0.08),
        0 0 0 28px rgba(14,165,233,0.04),
        0 24px 60px rgba(14,165,233,0.18);
    }

    /* ── Gradient buton ── */
    .btn-primary {
      background: linear-gradient(90deg, #0ea5e9 0%, #38bdf8 50%, #0ea5e9 100%);
      background-size: 200% auto;
      box-shadow: 0 12px 32px -4px rgba(14,165,233,0.45);
      transition: background-position 0.4s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-primary:active {
      transform: scale(0.97);
      box-shadow: 0 6px 20px -4px rgba(14,165,233,0.35);
      background-position: right center;
    }

    /* ── Slide-up giriş animasyonu ── */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-1 { animation: slideUp 0.6s ease both; }
    .anim-2 { animation: slideUp 0.6s 0.12s ease both; }
    .anim-3 { animation: slideUp 0.6s 0.24s ease both; }
    .anim-4 { animation: slideUp 0.6s 0.36s ease both; }
    .anim-5 { animation: slideUp 0.6s 0.48s ease both; }

    /* ── Özellik rozeti ── */
    .feature-badge {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 2px 12px rgba(14,165,233,0.1);
    }

    /* ── Sayfa göstergesi ── */
    .dot-active {
      background: #0ea5e9;
      width: 24px;
    }
    .dot-inactive {
      background: rgba(14,165,233,0.25);
      width: 8px;
    }
  </style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100" style="overflow-x: hidden;">

  <!-- Dekoratif arka plan bloblari -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- ── HEADER: Logo ── -->
  <header class="w-full flex items-center justify-between pt-14 pb-2 anim-1 relative z-10">
    <!-- NEXUS N logosu -->
    <div class="flex items-center gap-2">
      <svg class="w-9 h-9" fill="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="n-grad-ob" x1="0%" x2="100%" y1="0%" y2="100%">
            <stop offset="0%" stop-color="#0ea5e9"/>
            <stop offset="100%" stop-color="#22D3EE"/>
          </linearGradient>
        </defs>
        <path d="M22 78 V22 L78 78 V22" fill="none" stroke="url(#n-grad-ob)"
              stroke-linecap="round" stroke-linejoin="round" stroke-width="13"/>
      </svg>
      <span class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-slate-100">NEXUS</span>
    </div>

    <!-- Dil / Geç butonu -->
    <button
      id="skip-btn"
      onclick="goToApp()"
      class="text-sm font-medium text-slate-400 hover:text-slate-600 transition-colors px-1 py-1">
      Geç →
    </button>
  </header>

  <!-- ── MAIN: Hero görsel + metin ── -->
  <main class="flex-grow flex flex-col items-center justify-center w-full max-w-sm mx-auto relative z-10">

    <!-- Hero görsel halkası -->
    <div class="hero-ring rounded-[40px] p-4 mb-8 anim-2 w-full aspect-square flex items-center justify-center overflow-hidden">
      <img
        src="public/onboarding-hero.jpg"
        alt="Akıllı Ev Görseli"
        class="w-full h-full object-cover rounded-[28px]"
        onerror="this.src='https://lh3.googleusercontent.com/aida-public/AB6AXuB_JKPgE3dfTJ7HhmXDxorDP4q8xOBu9ctBJkTzYioOJH5NUlaMkR_1JZgbhqo2bAzLJkdGk9ex4Tw7vuZW3mERKxsFw4hEc6IbjC0Bz0g5WAYnIRyUTjgzNnfFfPq5VhNKSSxeBb3T3AtQGeg7fxyqhfdc9nXc9Nm8q-dMkl7n82FAn3oMvuWRtSLGl2Fbjms3VyD1KZtHPFssvtEYe-vPjgGn4XWdWK0qhuYBHDQ2TJoHkTyPEAYS'"
      />
    </div>

    <!-- Özellik rozetleri -->
    <div class="flex gap-2 mb-6 anim-3 flex-wrap justify-center">
      <span class="feature-badge rounded-full px-3 py-1.5 text-xs font-semibold text-violet-700">
        ⚡ Enerji Tasarrufu
      </span>
      <span class="feature-badge rounded-full px-3 py-1.5 text-xs font-semibold text-cyan-700">
        🏠 2.000+ Cihaz
      </span>
      <span class="feature-badge rounded-full px-3 py-1.5 text-xs font-semibold text-indigo-700">
        🤖 Yapay Zeka
      </span>
    </div>

    <!-- Başlık -->
    <div class="text-center px-2 anim-4">
      <h1 class="text-[2rem] leading-tight font-extrabold text-slate-900 dark:text-slate-100 mb-3 tracking-tight">
        Geleceğin Evi<br/>
        <span class="bg-gradient-to-r from-[#0ea5e9] to-[#22D3EE] bg-clip-text text-transparent">
          Şimdi Seninle
        </span>
      </h1>
      <p class="text-base text-slate-500 leading-relaxed font-medium">
        Yapay zeka ile evinizi akıllıca yönetin,<br/>enerjiden tasarruf edin, konforunuzu artırın.
      </p>
    </div>

  </main>

  <!-- ── FOOTER: Sayfa göstergesi + Buton ── -->
  <footer class="w-full max-w-sm mx-auto pb-10 pt-6 anim-5 relative z-10">

    <!-- Sayfa göstergesi noktaları -->
    <div class="flex items-center justify-center gap-2 mb-6">
      <div class="dot-active h-2 rounded-full transition-all duration-300"></div>
      <div class="dot-inactive h-2 rounded-full transition-all duration-300"></div>
      <div class="dot-inactive h-2 rounded-full transition-all duration-300"></div>
    </div>

    <!-- Ana buton -->
    <button
      id="cta-btn"
      onclick="goToApp()"
      class="btn-primary w-full py-4 rounded-full text-white text-lg font-bold focus:outline-none tracking-wide">
      Hemen Başla
    </button>

    <!-- Alt not -->
    <p class="text-center text-xs text-slate-400 mt-4 font-medium">
      Devam ederek
      <a href="#" class="text-violet-500 underline underline-offset-2">Kullanım Koşulları</a>'nı
      kabul etmiş olursunuz.
    </p>
  </footer>

  <script>
    // Onboarding'den login'e geç
    function goToApp() {
      window.location.replace('stitch-login.html');
    }

    // Eğer zaten giriş yapıldıysa direkt home'a git
    (function() {
      try {
        if (localStorage.getItem('nexus_onboarded') === '1') {
          window.location.replace('stitch-home.html');
        }
      } catch(e) {}
    })();
  </script>

</body>
</html>
