<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <title>NEXUS</title>
  <style>body{margin:0;background:#ECE9FD;}</style>
</head>
<body>
  <script>
    // İlk açılışta onboarding, sonrasında direkt home
    try {
      if (localStorage.getItem('nexus_onboarded') === '1') {
        location.replace('stitch-home.html');
      } else {
        location.replace('onboarding.html');
      }
    } catch(e) {
      location.replace('onboarding.html');
    }
  </script>
</body>
</html>
