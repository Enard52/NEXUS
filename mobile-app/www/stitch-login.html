<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <title>NEXUS — Giriş Yap</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: max(884px, 100dvh);
      
      overflow-x: hidden;
    }

    /* ── Dekoratif arka plan bloblari ── */
    .blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.3; pointer-events: none; }
    .blob-1 { width: 300px; height: 300px; background: #0ea5e9; top: -60px; right: -60px; }
    .blob-2 { width: 220px; height: 220px; background: #22D3EE; bottom: 200px; left: -50px; }

    /* ── Kart (cam efekti) ── */
    .glass-card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 8px 40px rgba(14,165,233,0.12), 0 1px 0 rgba(255,255,255,0.8) inset;
    }

    /* ── Input ── */
    .nexus-input {
      background: rgba(255,255,255,0.8);
      border: 1.5px solid rgba(186,230,253,0.6);
      border-radius: 14px;
      padding: 14px 16px;
      width: 100%;
      font-size: 15px;
      font-family: inherit;
      color: #1e1b4b;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .nexus-input::placeholder { color: #a0aec0; }
    .nexus-input:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
    }

    /* ── Gradient buton ── */
    .btn-primary {
      background: linear-gradient(90deg, #0ea5e9 0%, #38bdf8 50%, #0ea5e9 100%);
      background-size: 200% auto;
      box-shadow: 0 10px 28px -4px rgba(14,165,233,0.42);
      transition: background-position 0.4s ease, transform 0.15s ease, box-shadow 0.15s ease;
      border: none;
      cursor: pointer;
    }
    .btn-primary:active {
      transform: scale(0.97);
      box-shadow: 0 4px 16px -4px rgba(14,165,233,0.3);
      background-position: right center;
    }

    /* ── Sosyal buton ── */
    .btn-social {
      background: rgba(255,255,255,0.85);
      border: 1.5px solid rgba(186,230,253,0.5);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 13px 16px;
      font-weight: 600; font-size: 14px; color: #374151;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
    }
    .btn-social:active { background: rgba(255,255,255,1); transform: scale(0.98); }

    /* ── Sekme ── */
    .tab-btn {
      flex: 1; padding: 10px; border-radius: 12px; font-weight: 600;
      font-size: 14px; border: none; cursor: pointer; transition: all 0.2s;
      font-family: inherit;
    }
    .tab-btn.active {
      background: white;
      color: #0ea5e9;
      box-shadow: 0 2px 12px rgba(14,165,233,0.15);
    }
    .tab-btn.inactive {
      background: transparent;
      color: #9ca3af;
    }

    /* ── Giriş animasyonu ── */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-1 { animation: slideUp 0.55s ease both; }
    .anim-2 { animation: slideUp 0.55s 0.1s ease both; }
    .anim-3 { animation: slideUp 0.55s 0.2s ease both; }

    /* ── Hata mesajı ── */
    .error-msg {
      display: none;
      background: rgba(254,226,226,0.8);
      border: 1px solid rgba(252,165,165,0.6);
      color: #dc2626;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
    }
    .error-msg.show { display: block; }

    /* ── Divider ── */
    .divider { display: flex; align-items: center; gap: 12px; }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: rgba(14,165,233,0.15);
    }
  </style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100" style="overflow-x: hidden;">

  <!-- Blob'lar -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- ── HEADER ── -->
  <header class="w-full flex items-center justify-between pt-14 pb-2 anim-1 relative z-10 max-w-sm mx-auto">
    <a href="onboarding.html" class="p-2 -ml-2 text-slate-400 active:text-slate-600" aria-label="Geri">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <!-- NEXUS Logo -->
    <div class="flex items-center gap-1.5">
      <svg class="w-7 h-7" fill="none" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nxlogo-mob" x1="3" y1="2" x2="29" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6f9bff"/><stop offset="0.55" stop-color="#5b8dff"/><stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <linearGradient id="nxsheen-mob" x1="16" y1="1" x2="16" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.30"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#nxlogo-mob)"/>
  <circle cx="16" cy="16" r="15" fill="url(#nxsheen-mob)"/>
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
  <path d="M10.5 22.5V10.5L21.5 22.5V10.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
      <span class="text-lg font-extrabold tracking-tight text-slate-900 dark:text-slate-100">NEXUS</span>
    </div>
    <div class="w-10"></div>
  </header>

  <!-- ── MAIN ── -->
  <main class="flex-grow flex flex-col justify-center w-full max-w-sm mx-auto relative z-10 py-4">

    <!-- Başlık -->
    <div class="text-center mb-7 anim-1">
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-slate-100 mb-1 tracking-tight">Hesabına Giriş Yap</h1>
      <p class="text-sm text-slate-500 font-medium">NEXUS ile evinizi yönetmeye hazır mısınız?</p>
    </div>

    <!-- Kart -->
    <div class="glass-card rounded-3xl p-6 anim-2">

      <!-- Sekme: Giriş / Kayıt -->
      <div class="flex bg-slate-100/80 rounded-[14px] p-1 mb-6" id="tab-bar">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Giriş Yap</button>
        <button class="tab-btn inactive" id="tab-register" onclick="switchTab('register')">Kayıt Ol</button>
      </div>

      <!-- Hata mesajı -->
      <div class="error-msg mb-4" id="error-msg">
        E-posta veya şifre hatalı. Lütfen tekrar deneyin.
      </div>

      <!-- Form -->
      <form id="auth-form" onsubmit="handleSubmit(event)" novalidate>

        <!-- Kayıt formuna özel: Ad Soyad -->
        <div class="mb-4 hidden" id="field-name">
          <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">Ad Soyad</label>
          <input class="nexus-input" id="input-name" placeholder="Adınız ve soyadınız" type="text" autocomplete="name"/>
        </div>

        <!-- E-posta -->
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">E-posta</label>
          <input class="nexus-input" id="input-email" placeholder="ornek@mail.com" type="email" autocomplete="email" inputmode="email"/>
        </div>

        <!-- Şifre -->
        <div class="mb-4">
          <div class="flex justify-between items-center mb-1.5">
            <label class="block text-xs font-semibold text-slate-500 ml-1">Şifre</label>
            <a href="#" class="text-xs text-violet-500 font-medium" id="forgot-link">Şifremi Unuttum</a>
          </div>
          <div class="relative">
            <input class="nexus-input pr-12" id="input-password" placeholder="••••••••" type="password" autocomplete="current-password"/>
            <button type="button" onclick="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 p-1">
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Kayıt formuna özel: Şifre tekrar -->
        <div class="mb-5 hidden" id="field-password2">
          <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">Şifre Tekrar</label>
          <input class="nexus-input" id="input-password2" placeholder="••••••••" type="password" autocomplete="new-password"/>
        </div>

        <!-- Giriş / Kayıt Butonu -->
        <button type="submit" class="btn-primary w-full py-4 rounded-2xl text-white text-base font-bold tracking-wide" id="submit-btn">
          Giriş Yap
        </button>
      </form>

      <!-- Ayırıcı -->
      <div class="divider my-5">
        <span class="text-xs text-slate-400 font-medium whitespace-nowrap">veya şununla devam et</span>
      </div>

      <!-- Sosyal butonlar -->
      <div class="grid grid-cols-2 gap-3">
        <button class="btn-social" onclick="socialLogin('google')">
          <!-- Google SVG -->
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="btn-social" onclick="socialLogin('apple')">
          <!-- Apple SVG -->
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98l-.09.06c-.22.14-2.18 1.27-2.15 3.8.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.77M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          Apple
        </button>
      </div>
    </div>
  </main>

  <!-- ── FOOTER ── -->
  <footer class="w-full max-w-sm mx-auto pb-10 text-center anim-3 relative z-10">
    <p class="text-xs text-slate-400 font-medium" id="footer-text">
      Hesabın yok mu?
      <button onclick="switchTab('register')" class="text-violet-500 font-semibold bg-transparent border-none cursor-pointer font-['Inter']">
        Kayıt Ol
      </button>
    </p>
  </footer>

  <script>
    let currentTab = 'login';
    let pwVisible = false;

    function switchTab(tab) {
      currentTab = tab;
      const isRegister = tab === 'register';

      // Sekme görünümü
      document.getElementById('tab-login').className    = 'tab-btn ' + (isRegister ? 'inactive' : 'active');
      document.getElementById('tab-register').className = 'tab-btn ' + (isRegister ? 'active' : 'inactive');

      // Register-only alanlar
      document.getElementById('field-name').classList.toggle('hidden', !isRegister);
      document.getElementById('field-password2').classList.toggle('hidden', !isRegister);

      // "Şifremi Unuttum" sadece girişte görünür
      document.getElementById('forgot-link').style.display = isRegister ? 'none' : '';

      // Buton ve başlık metni
      document.getElementById('submit-btn').textContent = isRegister ? 'Hesap Oluştur' : 'Giriş Yap';
      document.querySelector('h1').textContent = isRegister ? 'Hesap Oluştur' : 'Hesabına Giriş Yap';
      document.querySelector('p.text-sm').textContent = isRegister
        ? 'Birkaç saniyede NEXUS\'a katılın.'
        : 'NEXUS ile evinizi yönetmeye hazır mısınız?';

      // Footer linki
      document.getElementById('footer-text').innerHTML = isRegister
        ? `Zaten hesabın var mı? <button onclick="switchTab('login')" class="text-violet-500 font-semibold bg-transparent border-none cursor-pointer font--['Inter']">Giriş Yap</button>`
        : `Hesabın yok mu? <button onclick="switchTab('register')" class="text-violet-500 font-semibold bg-transparent border-none cursor-pointer font-['Inter']">Kayıt Ol</button>`;

      // Hata temizle
      document.getElementById('error-msg').classList.remove('show');

      // autocomplete güncelle
      document.getElementById('input-password').setAttribute('autocomplete', isRegister ? 'new-password' : 'current-password');
    }

    function togglePassword() {
      pwVisible = !pwVisible;
      const inp = document.getElementById('input-password');
      const inp2 = document.getElementById('input-password2');
      inp.type = pwVisible ? 'text' : 'password';
      if (inp2) inp2.type = pwVisible ? 'text' : 'password';
      document.getElementById('eye-icon').style.opacity = pwVisible ? '0.4' : '1';
    }

    function handleSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const errorEl = document.getElementById('error-msg');

      // Basit validasyon
      if (!email || !password) {
        errorEl.textContent = 'Lütfen tüm alanları doldurun.';
        errorEl.classList.add('show');
        return;
      }
      if (currentTab === 'register') {
        const pw2 = document.getElementById('input-password2').value;
        if (password !== pw2) {
          errorEl.textContent = 'Şifreler eşleşmiyor.';
          errorEl.classList.add('show');
          return;
        }
        if (password.length < 6) {
          errorEl.textContent = 'Şifre en az 6 karakter olmalıdır.';
          errorEl.classList.add('show');
          return;
        }
      }

      errorEl.classList.remove('show');

      // ── Gerçek auth burada yapılır; şimdilik demo: onboard flag yaz ve home'a geç ──
      const btn = document.getElementById('submit-btn');
      btn.textContent = '...';
      btn.style.opacity = '0.7';

      setTimeout(() => {
        try { localStorage.setItem('nexus_onboarded', '1'); } catch(err) {}
        window.location.replace('stitch-home.html');
      }, 800);
    }

    function socialLogin(provider) {
      const btn = document.querySelector(\`button[onclick="socialLogin('\${provider}')"]\`);
      if (btn) { btn.style.opacity = '0.6'; btn.style.pointerEvents = 'none'; }
      setTimeout(() => {
        try { localStorage.setItem('nexus_onboarded', '1'); } catch(err) {}
        window.location.replace('stitch-home.html');
      }, 800);
    }
  </script>
</body>
</html>
