<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NEXUS — Cihazı Seç</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter (NEXUS body font) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<style data-purpose="custom-typography">
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      background-color: #F2F4F9;
    }
  </style>
<style data-purpose="custom-layout">
    .card-shadow {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-slate-900 min-h-screen flex flex-col">
<!-- BEGIN: Header -->
<header class="pt-14 pb-4 px-5 flex items-center justify-between relative" data-purpose="page-header">
<a aria-label="Geri" class="p-1 -ml-1" href="stitch-energy-strategy.html">
<i class="w-7 h-7 text-slate-700" data-lucide="chevron-left"></i>
</a>
<h1 class="text-lg font-bold absolute left-1/2 -translate-x-1/2">Cihazı Seç</h1>
<button class="text-slate-500 font-medium text-[17px]" onclick="resetSelection()">Sıfırla</button>
</header>
<!-- END: Header -->
<!-- BEGIN: MainContent -->
<main class="flex-grow px-4 pt-2 pb-10">
<!-- Category pill -->
<div class="mb-5" data-purpose="category-pill">
<button class="inline-flex items-center gap-2 bg-[#7C5CFF] text-white font-semibold text-sm pl-1.5 pr-4 py-1.5 rounded-2xl">
<span class="w-8 h-8 rounded-xl bg-white flex items-center justify-center">
<i class="w-4 h-4 text-[#7C5CFF]" data-lucide="lightbulb"></i>
</span>
<span id="category-label">Aydınlatma <span id="device-count">0</span></span>
</button>
</div>
<!-- Empty device card (yalnızca hiç cihaz eşleştirilmemişse görünür) -->
<section class="bg-white rounded-3xl card-shadow p-5 flex items-center gap-4" data-purpose="empty-device-card" id="empty-device-card">
<div class="w-14 h-14 rounded-xl bg-[#7C5CFF]/10 flex items-center justify-center flex-shrink-0">
<i class="w-7 h-7 text-[#7C5CFF]" data-lucide="package-open"></i>
</div>
<div class="min-w-0 flex-grow">
<h2 class="font-bold">Cihaz yok</h2>
<span class="inline-block text-xs font-semibold text-amber-600 bg-amber-100 rounded-md px-2 py-0.5 mt-1">Zorunlu</span>
</div>
<!-- Cihaz eşleştirme (radar) akışına gider -->
<a class="flex-shrink-0 bg-[#7C5CFF] text-white text-sm font-bold px-5 py-2.5 rounded-full active:scale-95 transition-transform" href="stitch-pair.html">Ekle</a>
</section>
<!-- Paired device list (eşleştirilmiş cihazlar buraya gerçek veriden gelir) -->
<section class="hidden space-y-3" data-purpose="paired-device-list" id="device-list"></section>
<!-- Feedback shortcut -->
<a class="flex items-center justify-center gap-2 text-sm font-medium text-slate-400 mt-8" data-purpose="feedback-link" href="stitch-feedback.html">
<i class="w-4 h-4" data-lucide="message-circle"></i>Cihazın listede yok mu? Geri bildirim gönder
</a>
</main>
<!-- END: MainContent -->
<script data-purpose="device-select-interactions">
    lucide.createIcons();
    // Kategori adı, seçilen stratejinin cihaz tipiyle senkronize gelir
    (function () {
      var raw = localStorage.getItem('nexusEnergyStrategy');
      if (raw) {
        try {
          var s = JSON.parse(raw);
          document.getElementById('category-label').firstChild.textContent = s.device + ' ';
        } catch (e) { /* varsayılan kategori kalır */ }
      }
    })();

    // --- Eşleştirilmiş cihazlar (stitch-pair.html kaydeder) ---
    var paired = [];
    try { paired = JSON.parse(localStorage.getItem('nexusPairedDevices') || '[]'); } catch (e) {}
    var selected = [];
    try { selected = JSON.parse(localStorage.getItem('nexusEnergySelectedDevices') || '[]'); } catch (e) {}
    // Kayıtlı seçimlerden artık mevcut olmayan cihazları ayıkla
    selected = selected.filter(function (n) {
      return paired.some(function (d) { return d.name === n; });
    });

    function persist() {
      localStorage.setItem('nexusEnergySelectedDevices', JSON.stringify(selected));
      localStorage.setItem('nexusEnergyDeviceCount', String(selected.length));
      document.getElementById('device-count').textContent = String(selected.length);
    }

    // Satıra dokununca seçimi değiştirir
    function toggleDevice(row) {
      var name = row.dataset.name;
      var idx = selected.indexOf(name);
      if (idx === -1) selected.push(name); else selected.splice(idx, 1);
      persist();
      renderList();
    }

    // Listeyi gerçek eşleştirme verisinden çizer
    function renderList() {
      var listEl = document.getElementById('device-list');
      var emptyEl = document.getElementById('empty-device-card');
      if (paired.length === 0) {
        emptyEl.classList.remove('hidden');
        listEl.classList.add('hidden');
        return;
      }
      emptyEl.classList.add('hidden');
      listEl.classList.remove('hidden');
      listEl.innerHTML = paired.map(function (d) {
        var isSel = selected.indexOf(d.name) !== -1;
        return '<button class="w-full bg-white rounded-3xl card-shadow p-4 flex items-center gap-4 text-left active:scale-[0.99] transition-transform" data-name="' + d.name + '" onclick="toggleDevice(this)">' +
          '<span class="w-12 h-12 rounded-xl bg-[#7C5CFF]/10 flex items-center justify-center flex-shrink-0"><i class="w-6 h-6 text-[#7C5CFF]" data-lucide="' + d.icon + '"></i></span>' +
          '<span class="min-w-0 flex-grow"><span class="block font-bold truncate">' + d.name + '</span><span class="block text-xs font-medium text-emerald-600 mt-0.5">Çevrimiçi</span></span>' +
          (isSel
            ? '<span class="w-7 h-7 rounded-full bg-[#7C5CFF] flex items-center justify-center flex-shrink-0"><i class="w-4 h-4 text-white" data-lucide="check"></i></span>'
            : '<span class="w-7 h-7 rounded-full border-2 border-slate-200 flex-shrink-0"></span>') +
          '</button>';
      }).join('');
      lucide.createIcons();
    }

    // Sıfırla: seçili cihaz sayısını temizler
    function resetSelection() {
      selected = [];
      persist();
      renderList();
    }

    persist();
    renderList();
  </script>
</body></html>
