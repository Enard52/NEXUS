<!DOCTYPE html>

  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>NEXUS ” Cihaz Kataloğu</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #F8F9FA;
      margin: 0;
      padding: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .text-brand { color: #7C5CFF; }
    .bg-brand { background-color: #7C5CFF; }
    
    .cat-active {
      background-color: white;
      color: #7C5CFF;
      font-weight: 700;
      border-left: 4px solid #7C5CFF;
    }
    .cat-inactive {
      color: #64748B;
      font-weight: 500;
      border-left: 4px solid transparent;
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
<script src="theme.js"></script>
<script src="ai-fab.js"></script>
</head>
<body class="text-slate-900">

  <!-- TOP HEADER & SEARCH -->
  <header class="bg-white px-4 pt-12 pb-3 shadow-sm z-20 flex-shrink-0">
    <div class="flex items-center justify-between mb-4">
      <a aria-label="Geri" class="p-1 -ml-1 text-slate-800" href="stitch-home.html">
        <i class="w-6 h-6" data-lucide="chevron-left"></i>
      </a>
      <h1 class="text-[17px] font-bold">Cihaz Ekle</h1>
      <a href="stitch-scan.html" class="p-1 text-slate-600">
        <i class="w-5 h-5" data-lucide="scan"></i>
      </a>
    </div>
    
    <div class="relative bg-slate-100 rounded-2xl flex items-center px-4 h-11">
      <i class="w-5 h-5 text-slate-400 mr-2" data-lucide="search"></i>
      <input type="text" id="search-input" class="bg-transparent border-none focus:ring-0 text-sm font-medium w-full text-slate-800 placeholder-slate-400" placeholder="Cihaz veya model ara..." oninput="filterProducts(this.value)" />
    </div>
  </header>

  <!-- BLUETOOTH WARNING BANNER -->
  <div id="bt-warning" class="bg-[#FFF1F2] border-b border-[#FECDD3] px-4 py-3 flex items-center justify-between z-10 flex-shrink-0 cursor-pointer" onclick="enableBluetooth()">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-[#FFE4E6] flex items-center justify-center text-[#E11D48] flex-shrink-0">
        <i class="w-4 h-4" data-lucide="bluetooth-off"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-[13px] font-bold text-slate-800">Bluetooth Kapalı</span>
        <span class="text-[11px] font-medium text-slate-500">Cihaz eşleştirmek için açın.</span>
      </div>
    </div>
    <button class="bg-[#E11D48] text-white text-[11px] font-bold px-3 py-1.5 rounded-full">Aç</button>
  </div>

  <!-- MAIN TWO-COLUMN LAYOUT -->
  <main class="flex-grow flex overflow-hidden">
    
    <!-- LEFT COLUMN: Categories -->
    <aside class="w-[35%] max-w-[140px] bg-slate-50 overflow-y-auto hide-scrollbar flex-shrink-0 pb-20 border-r border-slate-100" id="category-list">
      <!-- Categories injected via JS -->
    </aside>

    <!-- RIGHT COLUMN: Product Catalog -->
    <section class="w-[65%] flex-grow bg-white overflow-y-auto hide-scrollbar px-4 pt-4 pb-24" id="product-list">
      <!-- Products injected via JS -->
    </section>
  </main>

  <!-- BLUETOOTH ALERT MODAL -->
  <div id="bt-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-3xl p-6 w-72 text-center shadow-xl transform scale-95 transition-transform duration-200" id="bt-modal-content">
      <div class="w-16 h-16 bg-[#FFE4E6] text-[#E11D48] rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="w-8 h-8" data-lucide="bluetooth-off"></i>
      </div>
      <h3 class="text-lg font-bold text-slate-900 mb-2">Bluetooth Kapalı</h3>
      <p class="text-[13px] text-slate-500 mb-6 font-medium leading-relaxed">
        Cihaz aramak ve eşleştirmek için cihazınızın Bluetooth bağlantısını açmanız gerekmektedir.
      </p>
      <div class="flex gap-3">
        <button class="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl text-sm" onclick="closeBtModal()">İptal</button>
        <button class="flex-1 bg-[#7C5CFF] text-white font-bold py-3 rounded-xl text-sm" onclick="enableBluetooth()">Aç</button>
      </div>
    </div>
  </div>

    let activeCategory = "Küçük Ev Aleti"; // Default
    const categoryListEl = document.getElementById('category-list');
    const productListEl = document.getElementById('product-list');

    function renderCategories() {
      categoryListEl.innerHTML = '<ul class="flex flex-col py-2"></ul>';
      const ul = categoryListEl.querySelector('ul');
      
      Object.keys(catalogData).forEach(cat => {
        const li = document.createElement('li');
        li.textContent = cat;
        li.className = `px-3 py-4 text-[13px] cursor-pointer shadow-sm relative z-10 transition-colors ${cat === activeCategory ? 'cat-active' : 'cat-inactive'}`;
        li.onclick = () => {
          activeCategory = cat;
          renderCategories(); // Update active styling
          renderProducts(cat);
        };
        ul.appendChild(li);
      });
    }

    function renderProducts(category, searchQuery = '') {
      productListEl.innerHTML = '';
      const subCategories = catalogData[category];
      if (!subCategories) return;

      let hasAnyProduct = false;

      Object.entries(subCategories).forEach(([subCatName, products]) => {
        // Filter products if search is active
        const filteredProducts = products.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
        
        if (filteredProducts.length > 0) {
          hasAnyProduct = true;
          
          const sectionDiv = document.createElement('div');
          sectionDiv.className = 'mb-8 animate-[fadeIn_0.3s_ease-out]';
          
          sectionDiv.innerHTML = `
            <h3 class="text-[13px] font-bold text-slate-800 mb-4 tracking-wide uppercase">${subCatName}</h3>
            <div class="grid grid-cols-2 gap-x-4 gap-y-6">
              ${filteredProducts.map(p => `
                <a href="#" class="flex flex-col items-center group" onclick="checkBtAndNavigate(event, '${p.name}', '${p.img}')">
                  <div class="w-full aspect-square bg-slate-50 rounded-2xl flex items-center justify-center mb-2 overflow-hidden border border-slate-100 shadow-sm active:scale-95 transition-transform">
                    <img src="${p.img}" alt="${p.name}" class="w-[85%] h-[85%] object-cover rounded-xl" loading="lazy" />
                  </div>
                  <span class="text-[11px] font-semibold text-slate-700 text-center leading-tight px-1">${p.name}</span>
                </a>
              `).join('')}
            </div>
          `;
          productListEl.appendChild(sectionDiv);
        }
      });

      if (!hasAnyProduct) {
        productListEl.innerHTML = `
          <div class="flex flex-col items-center justify-center h-40 opacity-50">
            <i class="w-8 h-8 text-slate-400 mb-2" data-lucide="search-x"></i>
            <span class="text-sm font-medium">Cihaz bulunamadı</span>
          </div>
        `;
        lucide.createIcons();
      }
    }

    function filterProducts(query) {
      // If there's a global search, we can iterate through all categories and show results
      // For now, it searches within the ACTIVE category to keep UI clean, 
      // or we can overwrite and show global results. Let's do global search if query length > 1
      if(query.length > 1) {
        // Global search mode
        categoryListEl.style.opacity = '0.3';
        categoryListEl.style.pointerEvents = 'none';
        
        productListEl.innerHTML = '';
        let foundGlobal = false;
        
        Object.entries(catalogData).forEach(([catName, subCats]) => {
          Object.entries(subCats).forEach(([subCatName, products]) => {
            const matches = products.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));
            if(matches.length > 0) {
              foundGlobal = true;
              const sectionDiv = document.createElement('div');
              sectionDiv.className = 'mb-6';
              sectionDiv.innerHTML = `
                <h3 class="text-[11px] font-bold text-[#7C5CFF] mb-3 uppercase tracking-wider">${catName} > ${subCatName}</h3>
                <div class="grid grid-cols-2 gap-x-4 gap-y-6">
                  ${matches.map(p => `
                    <a href="#" class="flex flex-col items-center group" onclick="checkBtAndNavigate(event, '${p.name}', '${p.img}')">
                      <div class="w-full aspect-square bg-slate-50 rounded-2xl flex items-center justify-center mb-2 overflow-hidden border border-slate-100 shadow-sm active:scale-95 transition-transform">
                        <img src="${p.img}" alt="${p.name}" class="w-[85%] h-[85%] object-cover rounded-xl" loading="lazy" />
                      </div>
                      <span class="text-[11px] font-semibold text-slate-700 text-center leading-tight px-1">${p.name}</span>
                    </a>
                  `).join('')}
                </div>
              `;
              productListEl.appendChild(sectionDiv);
            }
          });
        });
        
        if(!foundGlobal) {
          productListEl.innerHTML = `
            <div class="flex flex-col items-center justify-center h-40 opacity-50 mt-10">
              <i class="w-8 h-8 text-slate-400 mb-2" data-lucide="search-x"></i>
              <span class="text-sm font-medium">Aramanızla eşleşen cihaz yok</span>
            </div>
          `;
          lucide.createIcons();
        }
      } else {
        // Reset to normal category view
        categoryListEl.style.opacity = '1';
        categoryListEl.style.pointerEvents = 'auto';
        renderProducts(activeCategory);
      }
    }

    // --- BLUETOOTH LOGIC ---
    let isBluetoothOn = false;
    let pendingDevice = null;
    let pendingDeviceImg = null;

    function enableBluetooth() {
      isBluetoothOn = true;
      document.getElementById('bt-warning').style.display = 'none';
      closeBtModal();
      
      if(pendingDevice) {
        setTimeout(() => {
          window.location.href = `stitch-radar.html?device=${encodeURIComponent(pendingDevice)}&img=${encodeURIComponent(pendingDeviceImg)}`;
        }, 300);
      }
    }

    function checkBtAndNavigate(e, deviceName, deviceImg) {
      e.preventDefault();
      if(!isBluetoothOn) {
        pendingDevice = deviceName;
        pendingDeviceImg = deviceImg;
        const modal = document.getElementById('bt-modal');
        const modalContent = document.getElementById('bt-modal-content');
        modal.classList.remove('hidden');
        requestAnimationFrame(() => {
          modal.classList.remove('opacity-0');
          modalContent.classList.remove('scale-95');
        });
      } else {
        window.location.href = `stitch-radar.html?device=${encodeURIComponent(deviceName)}&img=${encodeURIComponent(deviceImg)}`;
      }
    }

    function closeBtModal() {
      const modal = document.getElementById('bt-modal');
      const modalContent = document.getElementById('bt-modal-content');
      modal.classList.add('opacity-0');
      modalContent.classList.add('scale-95');
      setTimeout(() => { modal.classList.add('hidden'); }, 200);
      pendingDevice = null;
    }

    // Init
    window.onload = () => {
      renderCategories();
      renderProducts(activeCategory);
      lucide.createIcons();
    };
  </script>
