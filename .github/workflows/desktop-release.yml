name: Masaüstü sürümü

# "v1.0.0" gibi bir etiket gönderildiğinde Windows, macOS ve Linux kurulum dosyaları
# derlenir ve herkese açık Enard52/nexus-releases deposunun Releases bölümüne yüklenir.
# (Kaynak depo gizli olduğu için indirmeler ve otomatik güncelleme oradan yapılır.)
# Gerekli gizli anahtar: RELEASES_TOKEN — nexus-releases deposuna "Contents: Read and write"
# izni olan bir GitHub erişim anahtarı. Elle de çalıştırılabilir (Actions → Run workflow).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      # Sırayla: paralel işler aynı anda sürümü oluşturmaya çalışınca GitHub 422 (already_exists) veriyordu.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: --win
            suffix: ""
          - os: ubuntu-latest
            target: --linux
            suffix: ""
          # Linux ARM64 (Raspberry Pi 4/5, ARM dizüstü/sunucu): x64 koşucuda çapraz derlenir.
          # Dosya adları x64 ile çakışmasın diye -arm64 eki alır.
          - os: ubuntu-latest
            target: --linux AppImage deb rpm --arm64 -c.appImage.artifactName=NEXUS-linux-arm64.\${ext} -c.deb.artifactName=NEXUS-linux-arm64.\${ext} -c.rpm.artifactName=NEXUS-linux-arm64.\${ext}
            suffix: "-arm64"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Yayın anahtarını denetle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::RELEASES_TOKEN gizli anahtarı tanımlı değil (Settings → Secrets → Actions)."
            exit 1
          fi

      - name: rpm paketleme aracı (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Bağımlılıklar
        run: npm ci

      - name: Bulut yapılandırmasını yaz (depo değişkenlerinden)
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.NEXUS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXUS_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Bulut değişkenleri tanımlı değil; bulut özellikleri kapalı derlenecek."
            exit 0
          fi
          printf 'window.NEXUS_CLOUD = {\n  url: "%s",\n  anonKey: "%s"\n};\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > ../cloud-config.js

      - name: Uygulama dosyalarını hazırla
        run: node scripts/prepare-app.cjs

      # Yayın kapısı: electron-builder `files` listesi bir İZİN LİSTESİDİR. v1.0.32'de
      # kit/bridge.cjs listede olmadığı için tüm kurulumlar açılışta çöküyordu ve bunu
      # hiçbir adım fark etmedi (testler yayın işinde çalışmıyor). Denetim düşerse
      # derleme/yayın hiç başlamaz.
      - name: Paket içeriğini denetle (yayın öncesi)
        run: node ../scripts/verify-desktop-payload.mjs

      - name: Derle ve yayınla
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # İmza sertifikası yoksa imzasız derlenir (ücretsiz). CSC_LINK tanımsızken boş
          # string atanmaması için zaten hiç yansıtılmıyor; identity "-" imzalamayı kapatır.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      # Kemer + yedek: gerçek üretile paketin içine bakılır. Bulunan eksik burada kırmızı
      # işaret bırakır; sessiz ölü kurulum bir daha fark edilmeden çıkmasın.
      - name: Üretilen paketi denetle (app.asar içi)
        shell: bash
        run: |
          found=0
          while IFS= read -r a; do
            [ -n "$a" ] || continue
            found=1
            node ../scripts/verify-desktop-payload.mjs --asar "$a"
          done < <(find dist -name app.asar -type f)
          if [ "$found" = 0 ]; then
            echo "::error::denetlenecek app.asar bulunamadı (derleme mi başarısız?)"
            exit 1
          fi

      - name: SHA-256 özetleri
        shell: bash
        run: |
          cd dist
          for f in *.exe *.dmg *.zip *.AppImage *.deb *.rpm; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done > SHA256SUMS-${{ runner.os }}${{ matrix.suffix }}.txt
          cat SHA256SUMS-${{ runner.os }}${{ matrix.suffix }}.txt

      - name: Özetleri sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "dist/SHA256SUMS-${{ runner.os }}${{ matrix.suffix }}.txt" --clobber --repo Enard52/nexus-releases

      - name: Yerel derleme işaretini kaldır
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release delete-asset "${GITHUB_REF_NAME}" LOCAL-BUILD.txt --yes --repo Enard52/nexus-releases || true

      # Yalnızca bilgi amaçlı kopya (etiketsiz çalıştırmalarda indirilebilir):
      # yayından SONRA çalışır ve başarısız olursa (ör. Actions artifact kotası)
      # gerçek yayın etkilenmemiş demektir — işi kırmayasın.
      # NOT: Installer'lar buraya yazılmaz (iki build ~540 MB yapıyordu ve 500 MB
      # Actions depolama kotasını aşıyordu) — kurulumcular zaten sürümde duruyor.
      - name: Derleme çıktıları (etiketsiz çalıştırmalarda indirilebilir)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: nexus-desktop-${{ runner.os }}${{ matrix.suffix }}
          path: |
            desktop/dist/SHA256SUMS-*.txt
          if-no-files-found: warn
          retention-days: 14

# macOS derlemesi HAZIR (electron-builder mac: dmg+zip universal, main.cjs darwin
# kontrolleri tamam). Özel depoda macOS runner'lar 10x dakika yakıyor; açılışa
# kadar kapalı. Açmak için: Settings → Secrets and variables → Actions → Variables
# → MACOS_BUILD = true, sonra etiketi yeniden çalıştır (Actions → Run workflow).
# İmzalı/notarize derleme için (App Store'a dağıtım): secrets MACOS_IDENTITY,
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID + variables.MACOS_SIGN=true.
  macos:
    needs: build
    if: ${{ !cancelled() && vars.MACOS_BUILD == 'true' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: rpm paketleme aracı (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Bağımlılıklar
        run: npm ci

      - name: Bulut yapılandırmasını yaz (depo değişkenlerinden)
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.NEXUS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXUS_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Bulut değişkenleri tanımlı değil; bulut özellikleri kapalı derlenecek."
            exit 0
          fi
          printf 'window.NEXUS_CLOUD = {\n  url: "%s",\n  anonKey: "%s"\n};\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > ../cloud-config.js

      - name: Uygulama dosyalarını hazırla
        run: node scripts/prepare-app.cjs

      # Yayın kapısı (Windows/Linux işiyle aynı): yanlışsa derleme başlamaz.
      - name: Paket içeriğini denetle (yayın öncesi)
        run: node ../scripts/verify-desktop-payload.mjs

      - name: İmza modunu belirle (MACOS_SIGN)
        env:
          MACOS_SIGN: ${{ vars.MACOS_SIGN }}
          MACOS_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
        run: node scripts/configure-mac-sign.cjs

      - name: Derle ve yayınla
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ vars.MACOS_SIGN == 'true' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      # Kemer + yedek: üretilmiş .app içindeki app.asar gerçekten denetlenir.
      # Evrensel (x64+arm64) paket: iki mimarinin asar'ları farklıysa birleştirici küçük bir giriş app.asar'ı bırakır,
      # asıl içerik app-x64.asar / app-arm64.asar'dadır. Giriş asar'ı (içinde main.cjs yok) atlanır; GERÇEK içerik
      # taşıyan en az bir asar denetlenmeden adım geçmez.
      - name: Üretilen paketi denetle (app.asar içi)
        shell: bash
        run: |
          found=0
          while IFS= read -r a; do
            [ -n "$a" ] || continue
            size=$(wc -c < "$a")
            echo "asar: $a ($size bayt)"
            if [ "$size" -lt 100000 ]; then
              echo "giriş (stub) asar atlandı: $a"
              continue
            fi
            found=1
            node ../scripts/verify-desktop-payload.mjs --asar "$a"
          done < <(find dist -name '*.asar' -type f -not -path '*-temp/*')
          if [ "$found" = 0 ]; then
            echo "::error::denetlenecek app.asar bulunamadı (derleme mi başarısız?)"
            exit 1
          fi

      - name: SHA-256 özetleri
        shell: bash
        run: |
          cd dist
          for f in *.dmg *.zip; do
            [ -f "$f" ] || continue
            shasum -a 256 "$f"
          done > SHA256SUMS-macOS.txt
          cat SHA256SUMS-macOS.txt

      - name: Özetleri sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "dist/SHA256SUMS-macOS.txt" --clobber --repo Enard52/nexus-releases
