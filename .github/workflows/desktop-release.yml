name: MasaÃ¼stÃ¼ sÃ¼rÃ¼mÃ¼

# "v1.0.0" gibi bir etiket gÃ¶nderildiÄŸinde Windows, macOS ve Linux kurulum dosyalarÄ±
# derlenir ve herkese aÃ§Ä±k Enard52/nexus-releases deposunun Releases bÃ¶lÃ¼mÃ¼ne yÃ¼klenir.
# (Kaynak depo gizli olduÄŸu iÃ§in indirmeler ve otomatik gÃ¼ncelleme oradan yapÄ±lÄ±r.)
# Gerekli gizli anahtar: RELEASES_TOKEN â€” nexus-releases deposuna "Contents: Read and write"
# izni olan bir GitHub eriÅŸim anahtarÄ±. Elle de Ã§alÄ±ÅŸtÄ±rÄ±labilir (Actions â†’ Run workflow).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: YayÄ±n anahtarÄ±nÄ± denetle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::RELEASES_TOKEN gizli anahtarÄ± tanÄ±mlÄ± deÄŸil (Settings â†’ Secrets â†’ Actions)."
            exit 1
          fi

      - name: BaÄŸÄ±mlÄ±lÄ±klar
        run: npm ci

      - name: Bulut yapÄ±landÄ±rmasÄ±nÄ± yaz (depo deÄŸiÅŸkenlerinden)
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.NEXUS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXUS_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Bulut deÄŸiÅŸkenleri tanÄ±mlÄ± deÄŸil; bulut Ã¶zellikleri kapalÄ± derlenecek."
            exit 0
          fi
          printf 'window.NEXUS_CLOUD = {\n  url: "%s",\n  anonKey: "%s"\n};\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > ../cloud-config.js

      - name: Uygulama dosyalarÄ±nÄ± hazÄ±rla
        run: node scripts/prepare-app.cjs

      - name: Derle ve yayÄ±nla
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Ä°mza sertifikasÄ± yoksa imzasÄ±z derlenir (Ã¼cretsiz). CSC_LINK tanÄ±msÄ±zken boÅŸ
          # string atanmamasÄ± iÃ§in zaten hiÃ§ yansÄ±tÄ±lmÄ±yor; identity "-" imzalamayÄ± kapatÄ±r.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: SHA-256 Ã¶zetleri
        shell: bash
        run: |
          cd dist
          for f in *.exe *.dmg *.zip *.AppImage *.deb; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done > SHA256SUMS-${{ runner.os }}.txt
          cat SHA256SUMS-${{ runner.os }}.txt

      - name: Ã–zetleri sÃ¼rÃ¼me ekle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "dist/SHA256SUMS-${{ runner.os }}.txt" --clobber --repo Enard52/nexus-releases

      - name: Yerel derleme işaretini kaldır
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release delete-asset "${GITHUB_REF_NAME}" LOCAL-BUILD.txt --yes --repo Enard52/nexus-releases || true

      - name: Derleme Ã§Ä±ktÄ±larÄ± (etiketsiz Ã§alÄ±ÅŸtÄ±rmalarda indirilebilir)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-desktop-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/SHA256SUMS-*.txt
          if-no-files-found: warn
          retention-days: 14

