name: Masaüstü sürümü

# "v1.0.0" gibi bir etiket gönderildiğinde Windows, macOS ve Linux kurulum dosyaları
# derlenir ve herkese açık Enard52/nexus-releases deposunun Releases bölümüne yüklenir.
# (Kaynak depo gizli olduğu için indirmeler ve otomatik güncelleme oradan yapılır.)
# Gerekli gizli anahtar: RELEASES_TOKEN — nexus-releases deposuna "Contents: Read and write"
# izni olan bir GitHub erişim anahtarı. Elle de çalıştırılabilir (Actions → Run workflow).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Yayın anahtarını denetle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::RELEASES_TOKEN gizli anahtarı tanımlı değil (Settings → Secrets → Actions)."
            exit 1
          fi

      - name: Bağımlılıklar
        run: npm ci

      - name: Bulut yapılandırmasını yaz (depo değişkenlerinden)
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.NEXUS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXUS_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Bulut değişkenleri tanımlı değil; bulut özellikleri kapalı derlenecek."
            exit 0
          fi
          printf 'window.NEXUS_CLOUD = {\n  url: "%s",\n  anonKey: "%s"\n};\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > ../cloud-config.js

      - name: Uygulama dosyalarını hazırla
        run: node scripts/prepare-app.cjs

      - name: Derle ve yayınla
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # İmza sertifikası yoksa imzasız derlenir (ücretsiz). CSC_LINK tanımsızken boş
          # string atanmaması için zaten hiç yansıtılmıyor; identity "-" imzalamayı kapatır.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: SHA-256 özetleri
        shell: bash
        run: |
          cd dist
          for f in *.exe *.dmg *.zip *.AppImage *.deb; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done > SHA256SUMS-${{ runner.os }}.txt
          cat SHA256SUMS-${{ runner.os }}.txt

      - name: Özetleri sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "dist/SHA256SUMS-${{ runner.os }}.txt" --clobber --repo Enard52/nexus-releases

      - name: Yerel derleme işaretini kaldır
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release delete-asset "${GITHUB_REF_NAME}" LOCAL-BUILD.txt --yes --repo Enard52/nexus-releases || true

      # Yalnızca bilgi amaçlı kopya (etiketsiz çalıştırmalarda indirilebilir):
      # yayından SONRA çalışır ve başarısız olursa (ör. Actions artifact kotası)
      # gerçek yayın etkilenmemiş demektir — işi kırmayasın.
      # NOT: Installer'lar buraya yazılmaz (iki build ~540 MB yapıyordu ve 500 MB
      # Actions depolama kotasını aşıyordu) — kurulumcular zaten sürümde duruyor.
      - name: Derleme çıktıları (etiketsiz çalıştırmalarda indirilebilir)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: nexus-desktop-${{ runner.os }}
          path: |
            desktop/dist/SHA256SUMS-*.txt
          if-no-files-found: warn
          retention-days: 14

# macOS derlemesi HAZIR (electron-builder mac: dmg+zip universal, main.cjs darwin
# kontrolleri tamam). Özel depoda macOS runner'lar 10x dakika yakıyor; açılışa
# kadar kapalı. Açmak için: Settings → Secrets and variables → Actions → Variables
# → MACOS_BUILD = true, sonra etiketi yeniden çalıştır (Actions → Run workflow).
  macos:
    if: vars.MACOS_BUILD == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Bulut yapılandırmasını yaz (depo değişkenlerinden)
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.NEXUS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXUS_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Bulut değişkenleri tanımlı değil; bulut özellikleri kapalı derlenecek."
            exit 0
          fi
          printf 'window.NEXUS_CLOUD = {\n  url: "%s",\n  anonKey: "%s"\n};\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > ../cloud-config.js

      - name: Uygulama dosyalarını hazırla
        run: node scripts/prepare-app.cjs

      - name: Derle ve yayınla
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: SHA-256 özetleri
        shell: bash
        run: |
          cd dist
          for f in *.dmg *.zip; do
            [ -f "$f" ] || continue
            shasum -a 256 "$f"
          done > SHA256SUMS-macOS.txt
          cat SHA256SUMS-macOS.txt

      - name: Özetleri sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "dist/SHA256SUMS-macOS.txt" --clobber --repo Enard52/nexus-releases
