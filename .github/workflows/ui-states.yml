name: UI states

# Her ekranı 3 durumda (yeni kullanıcı, bir cihaz, çevrimdışı) açar; yakalanmamış JS hatası, yatay taşma,
# temel erişilebilirlik ihlali ve cihaz yokken uydurma ölçüm arar. Ayrıntı: scripts/qa-ui-states.mjs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-states:
    name: ui states · a11y basics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Audit screens in 3 states
        run: node scripts/qa-ui-states.mjs
