name: Android yayını

# v* etiketinde imzalı Android APK'sını derler ve nexus-releases sürümüne yükler.
# Gerekli gizli anahtarlar (scripts/setup-automation.ps1 kurar): ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD ve zaten var olan RELEASES_TOKEN. Eksikse adım atlanır.
# Hesap senkronu için depo değişkenleri gerekir: NEXUS_SUPABASE_URL, NEXUS_SUPABASE_ANON_KEY
# (yoksa uyarı verilir ve APK yerel modda derlenir).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      NEXUS_SUPABASE_URL: ${{ vars.NEXUS_SUPABASE_URL }}
      NEXUS_SUPABASE_ANON_KEY: ${{ vars.NEXUS_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Anahtarlar tamam mı?
        id: gate
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$GH_TOKEN" ]; then echo "::notice::Android imza anahtarları tanımlı değil; APK derlemesi atlandı."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Bağımlılıklar ve www
        if: steps.gate.outputs.run == 'true'
        run: |
          pnpm install --frozen-lockfile
          # cloud-config.js gitignore'da; üretilmezse APK yerel modda kalır — telefonda
          # gerçek hesap ve cihaz senkronu olmaz, masaüstü/web hesabıyla birleşmez.
          node scripts/ensure-cloud-config.mjs
          node scripts/sync-www.mjs
          pnpm exec cap sync android
      # Firebase istemci yapılandırması depoda YOKTUR (.gitignore). GOOGLE_SERVICES_JSON secret'ı varsa
      # derleme öncesi dosyaya yazılır; yoksa APK push'suz derlenir (google-services eklentisi atlanır).
      - name: Firebase yapılandırması (varsa)
        if: steps.gate.outputs.run == 'true'
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Secret yoksa ya da geçerli JSON değilse (ör. yanlış yapıştırılmış) yayın DÜŞMEZ: APK push'suz derlenir ve neden yazılır.
          if [ -z "$GS_JSON" ]; then echo "::notice::GOOGLE_SERVICES_JSON tanımlı değil; APK sunucu bildirimi (push) olmadan derlenecek."; elif printf '%s' "$GS_JSON" | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))" 2>/dev/null; then printf '%s' "$GS_JSON" > android/app/google-services.json; echo "google-services.json yazıldı."; else echo "::warning::GOOGLE_SERVICES_JSON geçerli bir JSON değil; secret dosyanın tam içeriğiyle yeniden girilmeli. APK push'suz derleniyor."; fi
      - name: İmzalı APK derle
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nexus-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/nexus-release.jks" "$KS_PASS" "${KS_ALIAS:-nexus}" "${KEY_PASS:-$KS_PASS}" > "$RUNNER_TEMP/keystore.properties"
          chmod +x android/gradlew
          cd android && NEXUS_KEYSTORE_PROPS="$RUNNER_TEMP/keystore.properties" ./gradlew assembleRelease --no-daemon
      - name: Sürüme yükle
        if: steps.gate.outputs.run == 'true'
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp android/app/build/outputs/apk/release/app-release.apk NEXUS-Android.apk
          sha256sum NEXUS-Android.apk | sed 's/NEXUS-Android.apk/NEXUS-Android.apk/' > NEXUS-Android.apk.sha256.txt
          cp NEXUS-Android.apk.sha256.txt SHA256SUMS-Android.txt
          gh release view "$TAG" --repo Enard52/nexus-releases >/dev/null 2>&1 || gh release create "$TAG" --repo Enard52/nexus-releases --title "NEXUS ${TAG#v}" --notes "NEXUS ${TAG#v}"
          gh release upload "$TAG" NEXUS-Android.apk NEXUS-Android.apk.sha256.txt SHA256SUMS-Android.txt --clobber --repo Enard52/nexus-releases
      # Anahtarsız (Sigstore) kaynak kanıtı. Başarısız olursa yayın DÜŞMEZ: doğrulama için SHA-256 yeterli kalır.
      - name: Kaynak kanıtı (attestation)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: NEXUS-Android.apk
