name: Web ve site yayını

# main'e push edilince web uygulamasını (Cloudflare Pages: nexus-web-jre) ve tanıtım sitesini (Enard52.github.io -> nexus-smarthome)
# kendiliğinden yayınlar. Gizli anahtarlar yoksa ilgili adım atlanır (hata vermez).
# Gerekli: CLOUDFLARE_API_TOKEN (Pages düzenleme izni), SITE_REPO_TOKEN (site deposuna yazma izni). scripts/setup-automation.ps1 kurar.
# Web uygulamasının hesap/cihaz senkronu için depo değişkenleri: NEXUS_SUPABASE_URL, NEXUS_SUPABASE_ANON_KEY.
on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "lan-connectors.js"
      - "stitch-*.html"
      - "*.js"
      # Site kaynağı: üreteç/değişkenler değişince de yayınlanmalı (ölçüldü: bayat çıktı).
      - "scripts/site-*.mjs"
      - "scripts/verify-site.mjs"
      - "scripts/ensure-cloud-config.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 24c5d9c4db354c0a3173febb9b7af3bd
      NEXUS_SUPABASE_URL: ${{ vars.NEXUS_SUPABASE_URL }}
      NEXUS_SUPABASE_ANON_KEY: ${{ vars.NEXUS_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # cloud-config.js gitignore'da; CI'de olmazsa yayınlanan uygulama "yerel mod"a düşer
      # ve hesap/cihaz senkronu hiç çalışmaz. Değerler depo değişkenlerinden gelir.
      - name: Bulut yapılandırmasını üret
        run: node scripts/ensure-cloud-config.mjs
      - name: www klasörünü kaynaklardan eşitle
        run: node scripts/sync-www.mjs
      - name: Web uygulamasını yayınla
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::CLOUDFLARE_API_TOKEN yok; web yayını atlandı."; exit 0; fi
          mkdir -p _stage && rsync -a --exclude public www/ _stage/
          # Cloudflare'de PROJE adı "nexus-web"; ÜRETİM ALANI adı nexus-web-jre.pages.dev.
          # Ölçüldü (wrangler pages project list): bu hesapta "nexus-web-jre" diye bir proje
          # yok — o adla deploy hiç yayınlayamıyordu, bu yüzden alan günlerdir bayat kaldı.
          npx --yes wrangler@4 pages deploy _stage --project-name nexus-web --branch main --commit-dirty=true
  site:
    runs-on: ubuntu-latest
    env:
      SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
      # Site girişi (kayıt/şifre sıfırlama) Supabase'e gidiyor; anahtar depoya girmiyor,
      # yayında üretiliyor. Değer yoksa site auth 'kullanımda değil' modunda yayınlanır.
      NEXUS_SUPABASE_URL: ${{ vars.NEXUS_SUPABASE_URL }}
      NEXUS_SUPABASE_ANON_KEY: ${{ vars.NEXUS_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # www/public TAKİPLİ bir üretime çıktısı; eskiden yalnızca elle üretiliyordu ve
      # CI bayat kopyayı rsync'liyordu. Artık önce üretiliyor, sonra denetleniyor.
      - name: Bulut yapılandırmasını üret
        run: node scripts/ensure-cloud-config.mjs
      - name: Siteyi kaynaklardan üret
        run: node scripts/site-build.mjs
      - name: Yapısal denetim (tarayıcısız kapı)
        run: node scripts/verify-site.mjs --smoke
      - name: Tanıtım sitesini site deposuna gönder
        run: |
          if [ -z "$SITE_REPO_TOKEN" ]; then echo "::notice::SITE_REPO_TOKEN yok; site yayını atlandı."; exit 0; fi
          git clone --depth 1 "https://x-access-token:${SITE_REPO_TOKEN}@github.com/Enard52/Enard52.github.io.git" _site
          rsync -a --delete --exclude .git --exclude .nojekyll www/public/ _site/
          cd _site
          if [ -z "$(git status --porcelain)" ]; then echo "Site değişmedi."; exit 0; fi
          git config user.name "nexus-ci"; git config user.email "ci@nexus.invalid"
          git add -A && git commit -m "site: main ${GITHUB_SHA::7} ile eşitlendi" && git push

