name: Device test report
description: Tell us whether NEXUS worked with your real device (this is how connectors get verified)
labels: ["device-report", "test"]
title: "[Device report] <brand model> — <works / partly / fails>"
body:
  - type: markdown
    attributes:
      value: |
        NEXUS connectors are written from public protocol documentation and covered by
        packet-format tests, but most of them have **not been verified on real hardware yet**.
        Your report is what turns "untested" into "verified" in
        [docs/COMPATIBILITY.md](https://github.com/Enard52/NEXUS/blob/main/docs/COMPATIBILITY.md).

        **Never paste passwords, local keys, tokens or account e-mails.** Describe what happened; do not attach secrets.
  - type: input
    id: device
    attributes:
      label: Device (brand, model)
      placeholder: e.g. TP-Link Tapo P100
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware / hardware version (if known)
      placeholder: e.g. 1.3.7 Build 20240101
  - type: dropdown
    id: connector
    attributes:
      label: Connector used in NEXUS
      options:
        - Shelly
        - Shelly (Gen2+ RPC)
        - Tasmota
        - WLED
        - ESPHome
        - Philips Hue
        - Home Assistant
        - TP-Link Kasa
        - TP-Link Tapo
        - Yeelight
        - Sonoff (DIY mode)
        - WiZ
        - LIFX
        - Govee (LAN)
        - Tuya (local)
        - Wake-on-LAN
        - HomeKit bridge
        - Other
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Works as expected
        - Works partly
        - Does not work
    validations:
      required: true
  - type: checkboxes
    id: worked
    attributes:
      label: What worked (tick all that apply)
      options:
        - label: Pairing / adding the device
        - label: Reading the current state
        - label: On / off
        - label: Brightness
        - label: Color or color temperature
        - label: Sensor events (motion, door/window, smoke/water)
        - label: Power / energy readings
        - label: Automations that use this device
  - type: dropdown
    id: platform
    attributes:
      label: NEXUS platform
      options:
        - Windows desktop
        - macOS desktop
        - Linux desktop
        - Android
        - iOS / PWA
        - Web
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NEXUS version
      placeholder: e.g. 1.0.32
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What did you do, what did you expect, what happened? Error messages shown in the app are very helpful.
    validations:
      required: true
