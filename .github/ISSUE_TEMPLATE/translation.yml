name: Translation
description: Report a missing/wrong translation or offer a new language
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        NEXUS ships in 68 languages across the application and marketing website.
        Write in any language you like. Community contributions are welcome! A language is updated
        or added by contributing dictionary files (`src/app/lang-<code>.js` and `scripts/site-content.<code>.mjs`).
        The step-by-step guide is docs/TRANSLATING.md.
  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options:
        - A string shows untranslated (in any language)
        - A translation is wrong or awkward
        - I want to offer a NEW language
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        For untranslated/wrong strings: which screen, what does it say, what
        should it say, and in which language?
        For new languages: which language, and are you willing to maintain it?
    validations:
      required: true
