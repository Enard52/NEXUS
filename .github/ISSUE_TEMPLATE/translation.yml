name: Translation
description: Report a missing/wrong translation or offer a new language
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        NEXUS ships in 68 languages; English and Turkish are fully covered (enforced by a test)
        and every other language falls back to English per string. Write in any language you like.
        Community languages are welcome! A language is added by contributing one
        dictionary file (`src/app/lang-<code>.js`) and one registry line in
        `src/app/theme.js`. The step-by-step guide is docs/TRANSLATING.md.
  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options:
        - A string shows untranslated (in any language)
        - A translation is wrong or awkward
        - I want to offer a NEW language
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        For untranslated/wrong strings: which screen, what does it say, what
        should it say, and in which language?
        For new languages: which language, and are you willing to maintain it?
    validations:
      required: true
